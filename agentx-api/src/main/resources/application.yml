server:
  port: ${SERVER_PORT:8084}
  # Behind a load balancer or tunnel, so rate limits see the real caller address
  forward-headers-strategy: native

spring:
  config:
    # Reads the .env file next to where the service starts (the agentx-api folder), so a run from the IDE or
    # the command line picks up the same settings as Docker. Real environment variables win over it. A missing file is fine.
    import: optional:file:.env[.properties]
  profiles:
    # Which database this service uses: postgresql, mysql or mongodb.
    # Change the word after the colon, or set DATABASE_TYPE in the environment.
    # The settings for each live in application-postgresql.yml, application-mysql.yml and application-mongodb.yml.
    active: ${DATABASE_TYPE:mongodb}
  application:
    name: agentx-api
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Private address of agent-service, which keeps the chat. Only this service talks to it.
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8082}

# Only used when agentx.code-delivery is sms
sms:
  username: ${SMS_USERNAME:sandbox}
  api-key: ${SMS_API_KEY:}
  sender-id: ${SMS_SENDER_ID:}
  base-url: ${SMS_BASE_URL:https://api.sandbox.africastalking.com}

# Shared secret between our own services (X-Internal-Key header). Only agent-service calls /internal/**.
# Browser access for the test console (console/console.html). Empty means off. Never set this in production.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

internal:
  key: ${INTERNAL_KEY}

agentx:
  # Signs the phone app's login tokens and hashes link codes. At least 32 random characters.
  token-secret: ${AGENTX_TOKEN_SECRET}
  token-ttl: ${AGENTX_TOKEN_TTL:P30D}
  link-code-ttl: PT10M
  link-max-attempts: 5
  link-codes-per-hour: ${AGENTX_CODES_PER_HOUR:5}
  action-ttl: ${AGENTX_ACTION_TTL:PT30M}
  max-open-actions: 10
  # M-Pesa's own limits still apply on the phone. These only stop obviously wrong requests.
  max-amount: ${AGENTX_MAX_AMOUNT:250000}
  min-airtime: 5
  # Public HTTPS address of this service. Links shown in the chat look like PUBLIC_BASE_URL/a/ACTION_ID
  public-base-url: ${AGENTX_PUBLIC_BASE_URL:http://localhost:8084}
  # For app links that open the app directly. Leave blank until the app is published.
  android-package: ${AGENTX_ANDROID_PACKAGE:}
  android-sha256: ${AGENTX_ANDROID_SHA256:}
  ios-app-id: ${AGENTX_IOS_APP_ID:}
  # How sign-in codes reach people: log (written to this service's log, for a developer), dev (also returned to the
  # app, for a test console only, never on a real system) or sms (sent through Africa's Talking, see the sms block).
  code-delivery: ${CODE_DELIVERY:log}
  # Name shown in the sign-in SMS
  app-name: ${AGENTX_APP_NAME:Daraja Agent-X}
  # Locks the business credentials people save in the app (consumer secrets, initiator passwords, passkeys).
  # 32 random bytes in Base64: openssl rand -base64 32. Keep a copy somewhere safe. If this key is lost or changed,
  # saved credentials cannot be opened and people must enter them again. Blank turns saving business credentials off.
  vault:
    key: ${AGENTX_VAULT_KEY:}
  daraja:
    sandbox-url: ${DARAJA_SANDBOX_URL:https://sandbox.safaricom.co.ke}
    production-url: ${DARAJA_PRODUCTION_URL:https://api.safaricom.co.ke}
    # Optional. A folder on the server holding sandbox/ and production/ sub folders with Safaricom's public
    # certificates. Blank uses the ones inside the application, in src/main/resources/certs.
    certs-directory: ${DARAJA_CERTS_DIR:}
  # Requests made on business accounts from the chat. Safaricom posts its answers to PUBLIC_BASE_URL/daraja/business/...,
  # so public-base-url above must be an HTTPS address that Safaricom can reach.
  business:
    # The most one request may move, in whole KES
    max-amount: ${AGENTX_BUSINESS_MAX_AMOUNT:150000}
    # How long a payout waits for the owner's approval in the app
    approval-ttl: ${AGENTX_BUSINESS_APPROVAL_TTL:PT30M}
    # false: STK Push goes out at once. true: it waits for approval in the app like a payout does.
    approve-collections: ${AGENTX_BUSINESS_APPROVE_COLLECTIONS:false}
    stk-per-hour: ${AGENTX_BUSINESS_STK_PER_HOUR:20}
    max-open-approvals: 10
  hand-off:
    # Verify every value below with the M-Pesa team before relying on it. The app falls back to guided steps
    # when a template is empty. Placeholders: {amount} {phone} {paybill} {account} {till}
    ussd-main: ${HANDOFF_USSD_MAIN:*334#}
    mpesa-android-package: ${HANDOFF_MPESA_ANDROID_PACKAGE:}
    mpesa-ios-url: ${HANDOFF_MPESA_IOS_URL:}
    # Keys are the request types the app looks up, so they keep their capitals. The [ ] keeps them exactly as written.
    ussd-templates:
      "[SEND_MONEY]": ${HANDOFF_USSD_SEND_MONEY:}
      "[PAY_BILL]": ${HANDOFF_USSD_PAY_BILL:}
      "[PAY_TILL]": ${HANDOFF_USSD_PAY_TILL:}
      "[BUY_AIRTIME]": ${HANDOFF_USSD_BUY_AIRTIME:}

logging:
  level:
    "[com.darajaagentx]": INFO

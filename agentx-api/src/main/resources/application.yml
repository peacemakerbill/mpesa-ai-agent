server:
  port: ${SERVER_PORT:8084}
  # Behind a load balancer or tunnel, so rate limits see the real caller address
  forward-headers-strategy: native

spring:
  config:
    # Reads the .env file next to where the service starts (the agentx-api folder), so a run from the IDE or
    # the command line picks up the same settings as Docker. Real environment variables win over it. A missing file is fine.
    import: optional:file:.env[.properties]
  profiles:
    # Which database this service uses: postgresql, mysql or mongodb.
    # Change the word after the colon, or set DATABASE_TYPE in the environment.
    # The settings for each live in application-postgresql.yml, application-mysql.yml and application-mongodb.yml.
    active: ${DATABASE_TYPE:mongodb}
  application:
    name: agentx-api
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Private address of agent-service, which keeps the chat. Only this service talks to it.
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8082}

# Only used when agentx.code-delivery is sms
sms:
  username: ${SMS_USERNAME:sandbox}
  api-key: ${SMS_API_KEY:}
  sender-id: ${SMS_SENDER_ID:}
  base-url: ${SMS_BASE_URL:https://api.sandbox.africastalking.com}

# Shared secret between our own services (X-Internal-Key header). Only agent-service calls /internal/**.
# Browser access for the test console (console/console.html). Empty means off. Never set this in production.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

internal:
  key: ${INTERNAL_KEY}

agentx:
  # Which copy of the system this is: development, staging (uat means the same) or production. Set APP_ENV.
  # production refuses to start with a setting that is only meant for development (CODE_DELIVERY=dev, CORS_ALLOWED_ORIGINS,
  # an example INTERNAL_KEY, an http or localhost public address). staging only warns about the same things.
  # Outside production, calls to a business account set to Safaricom's production Daraja are refused, so a test copy
  # cannot move real money. Email subjects start with [DEV] or [STAGING]. This is separate from a business account's own
  # sandbox or production setting.
  env: ${APP_ENV:development}
  # Lets a copy that is not production call live Daraja anyway. Leave false unless you really mean it.
  allow-live-daraja: ${AGENTX_ALLOW_LIVE_DARAJA:false}
  # Signs the phone app's login tokens and hashes link codes. At least 32 random characters.
  token-secret: ${AGENTX_TOKEN_SECRET}
  token-ttl: ${AGENTX_TOKEN_TTL:P30D}
  link-code-ttl: PT10M
  link-max-attempts: 5
  link-codes-per-hour: ${AGENTX_CODES_PER_HOUR:5}
  action-ttl: ${AGENTX_ACTION_TTL:PT30M}
  max-open-actions: 10
  # M-Pesa's own limits still apply on the phone. These only stop obviously wrong requests.
  max-amount: ${AGENTX_MAX_AMOUNT:250000}
  min-airtime: 5
  # Public HTTPS address of this service. Links shown in the chat look like PUBLIC_BASE_URL/a/ACTION_ID
  # On Render, RENDER_EXTERNAL_URL is this service's own https address, so nothing needs setting there.
  public-base-url: ${AGENTX_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8084}}
  # For app links that open the app directly. Leave blank until the app is published.
  android-package: ${AGENTX_ANDROID_PACKAGE:}
  android-sha256: ${AGENTX_ANDROID_SHA256:}
  ios-app-id: ${AGENTX_IOS_APP_ID:}
  # How sign-in codes reach people: log (written to this service's log, for a developer), dev (also returned to the
  # app, for a test console only, never on a real system) or sms (sent through Africa's Talking, see the sms block).
  code-delivery: ${CODE_DELIVERY:log}
  # Whether the app also shows the sign-in code on screen, so a tester needs no text message: auto (shown in development
  # and staging, never in production), true (the same, and production refuses to start) or false (never shown).
  # Set false once code-delivery is sms. Production never shows a code, whatever is set.
  show-code-in-app: ${CODE_SHOW_IN_APP:auto}
  # Name shown in the sign-in SMS
  app-name: ${AGENTX_APP_NAME:Daraja Agent-X}
  # Details in the footer of every email. All optional, a blank one is left out.
  # The design and wording of each email are files in src/main/resources/mail/templates.
  brand:
    # Where customers write for help. Blank uses MAIL_REPLY_TO, then MAIL_FROM.
    support-email: ${AGENTX_SUPPORT_EMAIL:}
    # Public address of the product. Shown as a link in the footer and on the welcome email's button.
    website: ${AGENTX_WEBSITE:}
    # Where the "Open" button goes: a Google Play or App Store link, or a web address that opens the app. Must start with https://.
    # Blank uses the website. With neither set, the emails have no button.
    app-url: ${AGENTX_APP_URL:}
    tagline: ${AGENTX_TAGLINE:M-Pesa payments and reports, by chat}
    # Name used in the copyright line, for example "Acme Payments Ltd". Blank uses app-name.
    company: ${AGENTX_COMPANY:}
    address: ${AGENTX_COMPANY_ADDRESS:}
    # The two or three letters in the square logo. Blank uses the initials of app-name.
    mark: ${AGENTX_BRAND_MARK:}
    # A folder with edited copies of the email files, so the look can change without a rebuild. Blank uses the built in files.
    templates-dir: ${MAIL_TEMPLATES_DIR:}
  # Locks the business credentials people save in the app (consumer secrets, initiator passwords, passkeys).
  # 32 random bytes in Base64: openssl rand -base64 32. Keep a copy somewhere safe. If this key is lost or changed,
  # saved credentials cannot be opened and people must enter them again. Blank turns saving business credentials off.
  vault:
    key: ${AGENTX_VAULT_KEY:}
  daraja:
    sandbox-url: ${DARAJA_SANDBOX_URL:https://sandbox.safaricom.co.ke}
    production-url: ${DARAJA_PRODUCTION_URL:https://api.safaricom.co.ke}
    # Optional. A folder on the server holding sandbox/ and production/ sub folders with Safaricom's public
    # certificates. Blank uses the ones inside the application, in src/main/resources/certs.
    certs-directory: ${DARAJA_CERTS_DIR:}
  # Where Safaricom posts the answer to an STK Push (paid, cancelled, no answer). Blank uses public-base-url. Set it when the
  # callbacks must go to a different public https address, for example a tunnel to your laptop while testing. Address only.
  stk:
    callback-url: ${AGENTX_STK_CALLBACK_URL:}
  # Where Safaricom posts the final answer to B2C, B2B, Pay to Pochi, balance, status and reversal requests. Each is an address
  # (the path and a secret token per request are added) or a template containing {id} and {token}. Blank uses public-base-url.
  initiator:
    result-url: ${AGENTX_RESULT_URL:}
    timeout-url: ${AGENTX_TIMEOUT_URL:}
  # Development only (docs/DEV_TUNNEL.md). When no public address is set for the STK answers, a zrok2 or ngrok tunnel is opened
  # once the service is up, installing the program into your own folder if it is missing. Needs one account token.
  dev-tunnel:
    mode: ${DEV_TUNNEL:auto}
    provider: ${DEV_TUNNEL_PROVIDER:auto}
    install: ${DEV_TUNNEL_INSTALL:true}
    wait-seconds: ${DEV_TUNNEL_WAIT:40}
    zrok-token: ${ZROK_ENABLE_TOKEN:}
    ngrok-token: ${NGROK_AUTHTOKEN:}
    zrok-version: ${ZROK2_VERSION:}
    zrok-share-args: ${ZROK_SHARE_ARGS:}
  # Requests made on business accounts from the chat. Safaricom posts its answers to PUBLIC_BASE_URL/daraja/business/...,
  # so public-base-url above must be an HTTPS address that Safaricom can reach.
  business:
    # The most one request may move, in whole KES
    max-amount: ${AGENTX_BUSINESS_MAX_AMOUNT:150000}
    # How long a payout waits for the owner's approval in the app
    approval-ttl: ${AGENTX_BUSINESS_APPROVAL_TTL:PT30M}
    # false: STK Push goes out at once. true: it waits for approval in the app like a payout does.
    approve-collections: ${AGENTX_BUSINESS_APPROVE_COLLECTIONS:false}
    stk-per-hour: ${AGENTX_BUSINESS_STK_PER_HOUR:20}
    max-open-approvals: 10
    # Safety net for an STK Push whose answer from Safaricom never arrived. Every interval it asks Safaricom about pushes
    # that have waited longer than min-age, and marks a push UNKNOWN after give-up-after so the owner checks the M-Pesa statement.
    reconcile:
      enabled: ${AGENTX_RECONCILE_ENABLED:true}
      interval: ${AGENTX_RECONCILE_INTERVAL:PT1M}
      min-age: ${AGENTX_RECONCILE_MIN_AGE:PT2M}
      give-up-after: ${AGENTX_RECONCILE_GIVE_UP_AFTER:PT15M}
  # ---------------------------------------------------------------------------------------------------------------
  # Email. Used for the code that verifies a customer's email address, the welcome and sign in notices, the notice when a
  # payment or business request finishes, and reports the customer asks to have emailed (PDF, CSV or Excel).
  # transport: log writes every email to this service's log and sends nothing (default, for a developer).
  #            smtp sends through the mail server below. Fill in the MAIL_ values in .env.
  # ---------------------------------------------------------------------------------------------------------------
  mail:
    transport: ${MAIL_TRANSPORT:log}
    # The sender. Most mail servers only accept an address they own, for example the same as MAIL_USERNAME.
    from: ${MAIL_FROM:no-reply@localhost}
    from-name: ${MAIL_FROM_NAME:Daraja Agent-X}
    reply-to: ${MAIL_REPLY_TO:}
    smtp:
      host: ${MAIL_HOST:}
      # 587 with start-tls true, or 465 with ssl true
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      start-tls: ${MAIL_STARTTLS:true}
      ssl: ${MAIL_SSL:false}
      connect-timeout: PT10S
      timeout: PT30S
    # Which automatic emails exist at all. Each customer can also switch sign in and payment notices off in their profile.
    notifications:
      welcome: ${MAIL_NOTIFY_WELCOME:true}
      sign-in: ${MAIL_NOTIFY_SIGN_IN:true}
      payments: ${MAIL_NOTIFY_PAYMENTS:true}
    reports:
      max-recipients: ${MAIL_REPORT_MAX_RECIPIENTS:10}
      per-hour: ${MAIL_REPORT_PER_HOUR:10}
      max-rows: ${MAIL_REPORT_MAX_ROWS:5000}
      max-attachment-bytes: ${MAIL_REPORT_MAX_BYTES:8388608}
      # false: a report can only go to the customer's own verified email or to addresses on their saved list
      allow-external: ${MAIL_REPORT_ALLOW_EXTERNAL:true}
      # Comma separated. When set, reports can only go to these domains (the customer's own email always works)
      allowed-domains: ${MAIL_REPORT_ALLOWED_DOMAINS:}
    code-ttl: PT10M
    code-max-attempts: 5
    codes-per-hour: 5
    # The least time between two "new sign in" emails to the same customer
    sign-in-alert-gap: ${MAIL_SIGN_IN_ALERT_GAP:PT30M}
  # ---------------------------------------------------------------------------------------------------------------
  # Where files kept by this service go: the profile pictures, and the chat files when the agent is set to use this service.
  # type: local   a folder on this server (local.path)
  #       network a shared folder mounted on this server: NFS, SMB/CIFS, a NAS (network.path). The share must already be
  #               mounted, otherwise the service refuses to start instead of quietly writing to its own disk.
  #       database the database this service already uses, no disk and no other account needed (database.max-file-bytes)
  #       cloudinary Cloudinary, as private files (cloudinary.*)
  # ---------------------------------------------------------------------------------------------------------------
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      path: ${STORAGE_LOCAL_PATH:./data/files}
    network:
      # For example /mnt/agentx on Linux, or \\nas\agentx on Windows. Used only when type is network.
      path: ${STORAGE_NETWORK_PATH:}
      create-if-missing: ${STORAGE_NETWORK_CREATE:false}
      # A folder inside the share, so several services can use one share
      subfolder: ${STORAGE_NETWORK_SUBFOLDER:agentx-api}
    # Used when type is database. Files are kept in the database this service already uses. MongoDB documents stop at 16 MB.
    database:
      max-file-bytes: ${STORAGE_DB_MAX_FILE_BYTES:15728640}
    # Used when type is cloudinary. Give the address from the dashboard (cloudinary://API_KEY:API_SECRET@CLOUD_NAME), or the three values.
    cloudinary:
      url: ${CLOUDINARY_URL:}
      cloud-name: ${STORAGE_CLOUDINARY_CLOUD_NAME:}
      api-key: ${STORAGE_CLOUDINARY_API_KEY:}
      api-secret: ${STORAGE_CLOUDINARY_API_SECRET:}
      folder: ${STORAGE_CLOUDINARY_FOLDER:agentx}
    # How often database files past their keep time are removed
    purge-interval: ${STORAGE_PURGE_INTERVAL:PT1H}
    max-picture-bytes: ${STORAGE_MAX_PICTURE_BYTES:3145728}
  # Sign up and the lists customers keep
  profile:
    # false closes sign up. People who already have an account can still sign in.
    signup-enabled: ${SIGNUP_ENABLED:true}
    signup-ttl: PT15M
    max-recipients: 200
  hand-off:
    # Verify every value below with the M-Pesa team before relying on it. The app falls back to guided steps
    # when a template is empty. Placeholders: {amount} {phone} {paybill} {account} {till}
    ussd-main: ${HANDOFF_USSD_MAIN:*334#}
    mpesa-android-package: ${HANDOFF_MPESA_ANDROID_PACKAGE:}
    mpesa-ios-url: ${HANDOFF_MPESA_IOS_URL:}
    # Keys are the request types the app looks up, so they keep their capitals. The [ ] keeps them exactly as written.
    ussd-templates:
      "[SEND_MONEY]": ${HANDOFF_USSD_SEND_MONEY:}
      "[PAY_BILL]": ${HANDOFF_USSD_PAY_BILL:}
      "[PAY_TILL]": ${HANDOFF_USSD_PAY_TILL:}
      "[BUY_AIRTIME]": ${HANDOFF_USSD_BUY_AIRTIME:}

logging:
  level:
    "[com.darajaagentx]": INFO

<p style="margin:0 0 16px 0;">Hello,</p>
<p style="margin:0 0 20px 0;">{{who}} sent you a report from {{brand}}.</p>
{{#if note}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;"><tr>
<td class="pk" width="6" bgcolor="#43B02A" style="width:6px;background-color:#43B02A;font-size:0;line-height:0;">&nbsp;</td>
<td class="tx" style="padding:2px 0 2px 18px;font-family:'Bricolage Grotesque','Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif;font-size:21px;line-height:29px;font-weight:500;letter-spacing:-0.3px;color:#0C2414;">{{note}}</td>
</tr></table>
{{/if}}
<table role="presentation" class="bd" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:2px solid #0A4A20;margin:0 0 8px 0;"><tr>
<td class="filebox" width="84" align="center" valign="middle" bgcolor="#0A4A20" style="width:84px;background-color:#0A4A20;font-family:'DM Mono','Courier New',Courier,monospace;font-size:16px;line-height:20px;font-weight:bold;color:#FFFFFF;padding:18px 0;"><span style="color:#FFFFFF;">{{ext}}</span></td>
<td valign="middle" style="padding:16px 18px;">
<div class="tx" style="font-family:'Bricolage Grotesque','Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:24px;font-weight:700;letter-spacing:-0.3px;color:#0C2414;word-break:break-all;">{{fileName}}</div>
<div class="tx-muted" style="font-family:'DM Mono','Courier New',Courier,monospace;font-size:12px;line-height:20px;color:#4E6355;padding-top:2px;">{{rowsLabel}}, made {{when}}</div>
<div class="tx-muted" style="font-family:'DM Mono','Courier New',Courier,monospace;font-size:12px;line-height:20px;color:#4E6355;">Attached to this email</div>
</td>
</tr></table>

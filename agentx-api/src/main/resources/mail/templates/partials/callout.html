{{! A boxed note with a coloured edge. Needs calloutTitle, calloutText and accent. }}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:10px 0 6px 0;">
<tr>
<td width="6" bgcolor="{{accent}}" style="width:6px;background-color:{{accent}};font-size:0;line-height:0;">&nbsp;</td>
<td style="padding:2px 0 2px 16px;font-family:'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;">
<div class="tx" style="font-family:'Bricolage Grotesque','Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:24px;font-weight:700;letter-spacing:-0.2px;color:#0C2414;padding-bottom:2px;">{{calloutTitle}}</div>
<div class="tx-muted" style="color:#4E6355;">{{calloutText}}</div>
</td>
</tr>
</table>

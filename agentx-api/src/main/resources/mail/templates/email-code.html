<p style="margin:0 0 16px 0;">{{greeting}}</p>
<p style="margin:0 0 22px 0;">Enter this code in {{brand}} to verify your email address.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 22px 0;"><tr>
{{#each digits}}
<td class="digit bd" align="center" valign="middle" width="46" height="58" style="width:46px;height:58px;border:2px solid #0A4A20;font-family:'DM Mono','Courier New',Courier,monospace;font-size:30px;line-height:34px;font-weight:500;color:#0C2414;"><span class="tx" style="color:#0C2414;">{{d}}</span></td>
<td class="gap" width="6" style="width:6px;font-size:0;line-height:0;">&nbsp;</td>
{{/each}}
</tr></table>
<p style="margin:0 0 22px 0;">It works once and expires in {{minutes}} minutes, at {{expires}} {{zoneName}}.</p>
{{> callout}}

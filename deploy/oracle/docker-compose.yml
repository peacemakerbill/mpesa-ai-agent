# Daraja Agent-X on one server (for example an Oracle Cloud Always Free VM).
# Start from this folder:  docker compose up -d --build
# Settings come from the .env file next to this one. Make it with: bash init-env.sh
# Step by step instructions: docs/DEPLOY_ORACLE.md
#
# Only Caddy is reachable from the internet (ports 80 and 443). Everything else stays on the private network of this file.
name: agentx

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - agentx-api

  agentx-api:
    build: ../../agentx-api
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: "8084"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      DATABASE_TYPE: mongodb
      MONGODB_URI: ${MONGODB_URI}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-agentx}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AGENT_BASE_URL: http://agent-service:8082
      INTERNAL_KEY: ${INTERNAL_KEY}
      AGENTX_TOKEN_SECRET: ${AGENTX_TOKEN_SECRET}
      AGENTX_VAULT_KEY: ${AGENTX_VAULT_KEY:-}
      AGENTX_PUBLIC_BASE_URL: https://${DOMAIN}
      AGENTX_WEBSITE: ${AGENTX_WEBSITE:-}
      AGENTX_APP_URL: ${AGENTX_APP_URL:-}
      # Files people upload are kept in the database, so they survive a rebuild of this server and expire on schedule.
      STORAGE_TYPE: database
      CODE_DELIVERY: ${CODE_DELIVERY:-log}
      CORS_ALLOWED_ORIGINS: ""
      SMS_USERNAME: ${SMS_USERNAME:-sandbox}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      SMS_BASE_URL: ${SMS_BASE_URL:-https://api.sandbox.africastalking.com}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Daraja Agent-X}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}

  agent-service:
    build: ../../agent-service
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      agentx-api:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: "8082"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGENT_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-agentx}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AGENTX_BASE_URL: http://agentx-api:8084
      AGENTX_PUBLIC_BASE_URL: https://${DOMAIN}
      INTERNAL_KEY: ${INTERNAL_KEY}
      # Chat files are sent to agentx-api, which keeps them in its database
      CHAT_MEDIA_STORE: agentx
      BUSINESS_NAME: ${BUSINESS_NAME:-Daraja Agent-X}
      BUSINESS_SUPPORT_PHONE: ${BUSINESS_SUPPORT_PHONE:-}
      CORS_ALLOWED_ORIGINS: ""

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-agentx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  rabbit_data:

# Used when the database type is postgresql (the default).
spring:
  datasource:
    url: ${DB_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/companion}}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      # Give up on one connection attempt after 5 seconds (milliseconds), so a missing database is noticed quickly
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate checks the tables against the entities when the service starts
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    # If the database is not up yet (for example it is still starting), wait for it instead of stopping at once:
    # about 6 tries, 1 second apart at first, growing to at most 5 seconds. Then the service stops with a clear message.
    connect-retries: 6
    connect-retries-interval: 5s
  autoconfigure:
    exclude:
      # Spring Boot 4 class names (they moved out of org.springframework.boot.autoconfigure)
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration
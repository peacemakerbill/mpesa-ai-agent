# Used when the database type is mysql (MySQL 8 or later).
spring:
  datasource:
    # The connection settings keep every timestamp in UTC
    url: ${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/companion?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&useSSL=false&allowPublicKeyRetrieval=true}}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      # Flyway owns the tables. Hibernate's own column type check is too strict for MySQL date columns.
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.mongo.MongoHealthContributorAutoConfiguration

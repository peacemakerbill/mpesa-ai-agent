name: mpesa_companion
description: Chat with the M-Pesa assistant, approve a request with your fingerprint, face or phone lock, then finish it inside M-Pesa.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# SMS reading (flutter_sms_inbox, permission_handler) is Android only and needs the READ_SMS permission, see docs/SMS.md.
# Chat attachments: image_picker, file_picker, record, audioplayers, geolocator, open_filex. Contact search: flutter_contacts,
# google_sign_in 6.x (Google), flutter_appauth (Microsoft), file_picker (vCard and CSV). Permissions and OAuth setup: docs/PLATFORM_SETUP.md and docs/CONTACTS.md.
# Versions are from memory and were not resolved in the build sandbox. Run `flutter pub get`
# and `flutter pub outdated`, then adjust. local_auth is pinned to 2.x because the code uses its AuthenticationOptions API.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  flutter_contacts: ^1.1.9+2
  android_intent_plus: ^5.2.0
  flutter_sms_inbox: ^1.0.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  geolocator: ^13.0.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  google_sign_in: ^6.2.1
  flutter_appauth: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

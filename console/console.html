<!doctype html>
<html lang="en" data-theme="daylight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Console</title>
<meta name="description" content="Try every API of the M-Pesa assistant from one page: a request trace, a chat, a phone and an API explorer.">
<style>
/* =====================================================================
   Ten themes. They share one structure and differ in material.
   daylight  light, cool grey, cobalt accent
   graphite  dark, neutral grey, amber accent
   pwani     light, coastal teal header
   mono      print black on white, hard rules, serif headings
   matatu    street yellow, black rules, red accent
   kahawa    espresso brown, teal accent, serif headings
   blueprint drafting navy with a grid, cyan accent
   ===================================================================== */
:root {
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-head: var(--font);
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --head-weight: 650; --head-track: -0.012em;
  --radius: 8px; --radius-sm: 6px;
  --bw: 1px;
  --m-get: #1b7f55; --m-post: #3a5fcf; --m-delete: #c62d3b;
  --accent-2: var(--accent); --tab-line: var(--accent);
}
[data-theme="daylight"] {
  --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f0f2f6; --surface-3: #e6e9ef;
  --line: #e1e4ea; --line-strong: #c9ced8;
  --ink: #11151b; --ink-2: #4a5362; --ink-3: #646e7f;
  --accent: #2457d6; --accent-ink: #ffffff; --accent-soft: #e7edfc; --accent-line: #b6c8f4;
  --good: #137a4a; --warn: #9a5d00; --bad: #c42b3a; --info: #2457d6;
  --head-bg: #ffffff; --head-ink: #11151b; --head-line: #e1e4ea;
  --code-bg: #f7f8fa; --lane: #d4d9e2;
  --elev: 0 1px 2px rgba(17, 21, 27, .05);
  --pop: 0 12px 32px -8px rgba(17, 21, 27, .25), 0 0 0 1px rgba(17, 21, 27, .06);
}
[data-theme="graphite"] {
  --bg: #0d0f12; --surface: #14171c; --surface-2: #1a1e24; --surface-3: #232830;
  --line: #242932; --line-strong: #343b46;
  --ink: #e7e9ee; --ink-2: #a0a8b5; --ink-3: #808895;
  --accent: #f0a63a; --accent-ink: #1b1304; --accent-soft: #2a2110; --accent-line: #5a4318;
  --good: #52c68f; --warn: #f0a63a; --bad: #f07272; --info: #78aaff;
  --head-bg: #101317; --head-ink: #e7e9ee; --head-line: #242932;
  --code-bg: #0f1216; --lane: #2a303a;
  --elev: none;
  --pop: 0 16px 40px -8px rgba(0, 0, 0, .7), 0 0 0 1px #343b46;
  --m-get: #52c68f; --m-post: #78aaff; --m-delete: #f07272;
  --font-head: var(--font);
}
[data-theme="pwani"] {
  --bg: #edf3f3; --surface: #ffffff; --surface-2: #e4eded; --surface-3: #d6e4e5;
  --line: #d3e0e0; --line-strong: #aec6c7;
  --ink: #0f2b33; --ink-2: #3b5961; --ink-3: #567078;
  --accent: #0a7480; --accent-ink: #ffffff; --accent-soft: #d9eef0; --accent-line: #8fc6cc; --accent-2: #c2571a;
  --good: #0b6b4b; --warn: #8a4b1f; --bad: #b3261e; --info: #1c5da6;
  --head-bg: #0a5c66; --head-ink: #ffffff; --head-line: #0a5c66; --tab-line: #ffffff;
  --code-bg: #f5f9f9; --lane: #bdd3d4;
  --radius: 10px; --radius-sm: 7px;
  --elev: 0 1px 2px rgba(15, 43, 51, .06);
  --pop: 0 12px 32px -8px rgba(15, 43, 51, .3), 0 0 0 1px rgba(15, 43, 51, .08);
  --font: "Avenir Next", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-head: var(--font);
}
[data-theme="mono"] {
  --font: "Helvetica Neue", Helvetica, "Inter", Arial, sans-serif;
  --font-head: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --head-weight: 700; --head-track: -0.005em;
  --radius: 0; --radius-sm: 0; --bw: 1px;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f3f3f3; --surface-3: #e8e8e8;
  --line: #111111; --line-strong: #111111;
  --ink: #000000; --ink-2: #2e2e2e; --ink-3: #5c5c5c;
  --accent: #000000; --accent-ink: #ffffff; --accent-soft: #ececec; --accent-line: #000000;
  --good: #0a6a2c; --warn: #8a5300; --bad: #b00020; --info: #0b3fa8;
  --head-bg: #ffffff; --head-ink: #000000; --head-line: #000000;
  --code-bg: #f7f7f7; --lane: #9a9a9a;
  --elev: none;
  --pop: 6px 6px 0 #000, 0 0 0 1px #000;
  --m-get: #0a6a2c; --m-post: #0b3fa8; --m-delete: #b00020;
}

[data-theme="savanna"] {
  --bg: #f6f8f5; --surface: #ffffff; --surface-2: #edf2ee; --surface-3: #dfe8e1;
  --line: #dce5de; --line-strong: #b9c9be;
  --ink: #10201a; --ink-2: #3f5348; --ink-3: #586c60;
  --accent: #087f36; --accent-ink: #ffffff; --accent-soft: #e1f3e7; --accent-line: #9fd3b1; --accent-2: #d6001c;
  --good: #087f36; --warn: #8f5b00; --bad: #c8102e; --info: #1c5da6;
  --head-bg: #087f36; --head-ink: #ffffff; --head-line: #087f36; --tab-line: #ffffff;
  --code-bg: #f8faf7; --lane: #c9d8cd;
  --radius: 14px; --radius-sm: 9px;
  --elev: 0 1px 2px rgba(16, 32, 26, .06);
  --pop: 0 14px 34px -8px rgba(16, 32, 26, .3), 0 0 0 1px rgba(16, 32, 26, .08);
}
[data-theme="lipa"] {
  --bg: #f4f4f5; --surface: #ffffff; --surface-2: #eeeef0; --surface-3: #e2e2e6;
  --line: #e2e2e5; --line-strong: #c8c8ce;
  --ink: #17171a; --ink-2: #4f4f57; --ink-3: #676770;
  --accent: #c8001a; --accent-ink: #ffffff; --accent-soft: #fbe6e9; --accent-line: #f0a8b1; --accent-2: #0a7a3b;
  --good: #0a7a3b; --warn: #8f5b00; --bad: #c8001a; --info: #1c5da6;
  --head-bg: #ffffff; --head-ink: #17171a; --head-line: #c8001a;
  --code-bg: #f8f8f9; --lane: #d4d4da;
  --radius: 10px; --radius-sm: 7px;
  --elev: 0 1px 2px rgba(23, 23, 26, .06);
  --pop: 0 12px 32px -8px rgba(23, 23, 26, .3), 0 0 0 1px rgba(23, 23, 26, .07);
}
[data-theme="lipa"] .bar { border-bottom-width: 3px; }
[data-theme="matatu"] {
  --font: "Trebuchet MS", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-head: "Arial Black", "Helvetica Neue", Impact, sans-serif; --head-weight: 900; --head-track: -0.01em;
  --radius: 4px; --radius-sm: 3px;
  --bg: #ffd400; --surface: #ffffff; --surface-2: #fff3b0; --surface-3: #ffe680;
  --line: #111111; --line-strong: #111111;
  --ink: #111111; --ink-2: #2b2b2b; --ink-3: #4a4400;
  --accent: #d4002a; --accent-ink: #ffffff; --accent-soft: #ffe7a1; --accent-line: #111111; --accent-2: #111111;
  --good: #0a6b2f; --warn: #7a4a00; --bad: #b00020; --info: #0b3fa8;
  --head-bg: #111111; --head-ink: #ffd400; --head-line: #111111; --tab-line: #d4002a;
  --code-bg: #fffbe0; --lane: #111111;
  --elev: 3px 3px 0 #111111;
  --pop: 6px 6px 0 #111111, 0 0 0 2px #111111;
  --m-get: #0a6b2f; --m-post: #0b3fa8; --m-delete: #b00020;
}
[data-theme="matatu"] .panel, [data-theme="matatu"] .ph, [data-theme="matatu"] .bar { border-width: 2px; }
[data-theme="matatu"] .bar { border-bottom-color: #d4002a; border-bottom-width: 4px; }
[data-theme="matatu"] .btn { border-width: 2px; border-color: #111111; font-weight: 700; }
[data-theme="matatu"] .bar .dot.up { background: #ffd400; }
[data-theme="matatu"] .bar .dot.down { background: #ff6b6b; }
[data-theme="kahawa"] {
  --bg: #1b1410; --surface: #251c16; --surface-2: #2e231c; --surface-3: #3a2d24;
  --line: #3a2d24; --line-strong: #5a4636;
  --ink: #f3e9dc; --ink-2: #cdbba6; --ink-3: #a8927b;
  --accent: #6cc4b5; --accent-ink: #0d1f1c; --accent-soft: #17302c; --accent-line: #2f6b62; --accent-2: #e6b450;
  --good: #86d0a0; --warn: #e6b450; --bad: #f08a7c; --info: #8fb8e8;
  --head-bg: #140e0b; --head-ink: #f3e9dc; --head-line: #3a2d24;
  --code-bg: #170f0b; --lane: #4a3a2e;
  --radius: 10px; --radius-sm: 7px;
  --elev: none;
  --pop: 0 16px 40px -8px rgba(0, 0, 0, .7), 0 0 0 1px #5a4636;
  --m-get: #86d0a0; --m-post: #8fb8e8; --m-delete: #f08a7c;
  --font-head: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --head-weight: 600; --head-track: 0;
}
[data-theme="kahawa"] { color-scheme: dark; }
[data-theme="blueprint"] {
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; --head-weight: 600; --head-track: 0;
  --radius: 2px; --radius-sm: 2px;
  --bg: #0e2a47; --surface: #123354; --surface-2: #173c63; --surface-3: #1d4875;
  --line: #2d5b8c; --line-strong: #4a7db3;
  --ink: #e8f1fb; --ink-2: #b4cde6; --ink-3: #93b3d4;
  --accent: #7fd6ff; --accent-ink: #06223a; --accent-soft: #16436e; --accent-line: #3d7db3; --accent-2: #ffd24a;
  --good: #7be0a8; --warn: #ffd24a; --bad: #ff8f8f; --info: #7fd6ff;
  --head-bg: #0a2037; --head-ink: #e8f1fb; --head-line: #2d5b8c;
  --code-bg: #0b2540; --lane: #3a6a9c;
  --elev: none;
  --pop: 0 16px 40px -8px rgba(0, 0, 0, .6), 0 0 0 1px #4a7db3;
  --m-get: #7be0a8; --m-post: #7fd6ff; --m-delete: #ff8f8f;
}
[data-theme="blueprint"] { color-scheme: dark; }
[data-theme="blueprint"] body, [data-theme="blueprint"] .app { background-image: linear-gradient(rgba(127, 214, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(127, 214, 255, .06) 1px, transparent 1px); background-size: 24px 24px; }
[data-theme="receipt"] {
  --font: "Courier New", "Courier Prime", "Liberation Mono", ui-monospace, monospace;
  --font-head: var(--font); --head-weight: 700; --head-track: 0;
  --radius: 0; --radius-sm: 0;
  --bg: #ecebe6; --surface: #fbfbf8; --surface-2: #f1f0eb; --surface-3: #e4e3dc;
  --line: #b5b4ae; --line-strong: #6b6a65;
  --ink: #1d1d1b; --ink-2: #45453f; --ink-3: #62625c;
  --accent: #0b6b2e; --accent-ink: #ffffff; --accent-soft: #e4eee2; --accent-line: #9dbe9a; --accent-2: #b3001b;
  --good: #0b6b2e; --warn: #8a5300; --bad: #b3001b; --info: #0b3fa8;
  --head-bg: #fbfbf8; --head-ink: #1d1d1b; --head-line: #1d1d1b; --tab-line: #1d1d1b;
  --code-bg: #f6f5f0; --lane: #8d8c86;
  --elev: none;
  --pop: 5px 5px 0 #1d1d1b, 0 0 0 1px #1d1d1b;
  --m-get: #0b6b2e; --m-post: #0b3fa8; --m-delete: #b3001b;
}
[data-theme="receipt"] .panel, [data-theme="receipt"] .ph, [data-theme="receipt"] .bar { border-style: dashed; }
[data-theme="receipt"] .panel { border-color: var(--line-strong); }
[data-theme="receipt"] .ph, [data-theme="receipt"] th, [data-theme="receipt"] td, [data-theme="receipt"] .logrow { border-bottom-style: dashed; }
[data-theme="receipt"] .btn.primary { border-style: solid; }
[data-theme="receipt"] body, [data-theme="receipt"] .app { background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(0, 0, 0, .025) 27px 28px); }

/* ===================================================================== base */
* { box-sizing: border-box; }
html { color-scheme: light; }
[data-theme="graphite"] { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-head); font-weight: var(--head-weight); letter-spacing: var(--head-track); line-height: 1.2; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.05rem; } h3 { font-size: .95rem; }
p { margin: 0; }
a { color: var(--accent); }
code, pre, kbd, .mono { font-family: var(--font-mono); font-size: .85em; }
kbd { border: var(--bw) solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); font-size: .78rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-theme="mono"] :focus-visible { outline: 3px solid #000; outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.small { font-size: .82rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: grid; gap: 14px; }
.stack.tight { gap: 8px; }
[hidden] { display: none !important; }

/* ===================================================================== app shell */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 20px; height: 52px; background: var(--head-bg); color: var(--head-ink); border-bottom: var(--bw) solid var(--head-line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: var(--head-weight); letter-spacing: var(--head-track); font-size: 1rem; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
[data-theme="pwani"] .brand svg path, [data-theme="savanna"] .brand svg path { stroke: var(--head-ink); }
[data-theme="matatu"] .brand svg path { stroke: #d4002a; }
.tabs-nav { display: flex; height: 100%; gap: 2px; margin-left: 10px; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: none; border: 0; cursor: pointer; color: inherit; opacity: .68; font-weight: 550; }
.tab svg { width: 17px; height: 17px; }
.tab:hover { opacity: 1; }
.tab[aria-current="page"] { opacity: 1; }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; background: var(--tab-line); }
[data-theme="mono"] .tab[aria-current="page"]::after { height: 3px; }
.bar .sp { flex: 1; }
.chips { display: flex; gap: 6px; }
.svc-chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 999px; border: var(--bw) solid color-mix(in srgb, currentColor 22%, transparent); background: transparent; color: inherit; cursor: pointer; font-size: .8rem; }
.svc-chip:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
[data-theme="mono"] .svc-chip { border-radius: 0; border-color: #000; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; display: inline-block; }
.dot.up { background: var(--good); } .dot.blocked { background: var(--warn); } .dot.down { background: var(--bad); }
[data-theme="pwani"] .bar .dot.up { background: #9ff0d0; }
[data-theme="pwani"] .bar .dot.down { background: #ffd0c8; }
[data-theme="savanna"] .bar .dot.up { background: #d4ffe2; }
[data-theme="savanna"] .bar .dot.down { background: #ffd0d6; }
[data-theme="mono"] .dot { border-radius: 0; }
[data-theme="mono"] .dot.up { background: #000; } [data-theme="mono"] .dot.down { background: #fff; box-shadow: inset 0 0 0 2px #000; }
.icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm); border: var(--bw) solid transparent; background: none; color: inherit; cursor: pointer; opacity: .8; }
.icon-btn:hover { opacity: 1; background: color-mix(in srgb, currentColor 10%, transparent); }
.icon-btn svg { width: 18px; height: 18px; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--radius-sm); border: var(--bw) solid color-mix(in srgb, currentColor 22%, transparent); font-size: .85rem; }
.menu summary::-webkit-details-marker { display: none; }
.menu summary:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
.menu[open] summary { background: color-mix(in srgb, currentColor 10%, transparent); }
.menu .pop { position: absolute; right: 0; top: 40px; width: 280px; max-height: calc(100vh - 80px); overflow: auto; background: var(--surface); color: var(--ink); border-radius: var(--radius); box-shadow: var(--pop); border: var(--bw) solid var(--line); padding: 6px; z-index: 50; }
.theme-group { padding: 10px 8px 4px; font-size: .74rem; font-weight: 650; color: var(--ink-3); }
.theme-opt { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px; background: none; border: var(--bw) solid transparent; border-radius: var(--radius-sm); cursor: pointer; color: inherit; }
.theme-opt:hover { background: var(--surface-2); }
.theme-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.theme-opt .name { font-weight: 600; } .theme-opt .desc { font-size: .78rem; color: var(--ink-2); }
.swatch { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 44px; height: 30px; border-radius: 5px; overflow: hidden; border: var(--bw) solid rgba(0, 0, 0, .25); }
[data-theme="mono"] .swatch { border-radius: 0; }
.swatch i { display: block; }

main { flex: 1; min-width: 0; }
.view { padding: 22px 24px 28px; max-width: 1360px; margin: 0 auto; width: 100%; display: grid; gap: 18px; align-content: start; }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.view-head p { color: var(--ink-2); max-width: 62ch; margin-top: 4px; }

/* ===================================================================== parts */
.panel { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--elev); min-width: 0; }
[data-theme="mono"] .panel { box-shadow: none; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 16px; border-bottom: var(--bw) solid var(--line); min-height: 46px; flex-wrap: wrap; }
.pb { padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: var(--radius-sm); border: var(--bw) solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 550; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn:active { background: var(--surface-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: .8rem; }
[data-theme="mono"] .btn { border-color: #000; }
[data-theme="mono"] .btn.primary:hover { background: #333; filter: none; }
.field { display: grid; gap: 5px; }
.field > label, .lbl { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
input[type=text], input[type=password], input[type=search], input[type=tel], select, textarea {
  width: 100%; height: 34px; padding: 0 10px; background: var(--surface); border: var(--bw) solid var(--line-strong); border-radius: var(--radius-sm); color: var(--ink);
}
select { padding-right: 6px; }
textarea { height: auto; min-height: 120px; padding: 9px 10px; font-family: var(--font-mono); font-size: .82rem; line-height: 1.55; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: .88rem; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); flex: none; width: 15px; height: 15px; }

/* ===================================================================== journey (request trace) */

.lane-grid { position: relative; padding: 6px 0 14px; min-height: 260px;
  background-image: linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane));
  background-repeat: no-repeat; background-size: 1px 100%;
  background-position: 10% 0, 30% 0, 50% 0, 70% 0, 90% 0; }
.ev { width: 100%; padding: 0; background: none; border: 0; text-align: left; color: inherit; cursor: pointer; display: grid; }

/* ===================================================================== chat */

/* composer: attach menu, tray, recorder, media bubbles */
.chat { position: relative; }

.attach-wrap { position: relative; }

.ic.c0 { background: #5d6675; } .ic.c1 { background: #1f7a4d; } .ic.c2 { background: #a1253a; } .ic.c3 { background: #7a3fb0; }
.ic.c4 { background: #b35a00; } .ic.c5 { background: #2457d6; } .ic.c6 { background: #00758f; } .ic.c7 { background: #8a6a00; }
.tray { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }

.tray-item { display: flex; align-items: center; gap: 9px; padding: 5px 6px 5px 5px; border: var(--bw) solid var(--line-strong); border-radius: var(--radius); background: var(--surface-2); flex: none; max-width: 260px; }

@media (prefers-reduced-motion: reduce) { .recdot { animation: none; } }
#recWave { width: 120px; max-width: 30vw; height: 32px; flex: none; }
.grow { flex: 1; min-width: 0; }
.dropveil { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 2px dashed var(--accent); border-radius: inherit; font-weight: 650; color: var(--accent); pointer-events: none; }

.bubble .m-img { display: block; max-width: 100%; width: 260px; max-height: 260px; object-fit: cover; border-radius: 8px; background: #000; }

/* camera */

dialog.small-dlg { width: min(420px, calc(100vw - 20px)); }
.form-grid.one { grid-template-columns: 1fr; }
.brand .logo { width: 24px; height: 24px; border-radius: 6px; object-fit: contain; flex: none; }

.screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; position: relative; }

.hero-amt { display: grid; gap: 2px; padding: 6px 0 2px; }

.timeline { display: grid; gap: 0; padding: 4px 0; }
.tl { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }

.tl::before { content: ""; position: absolute; left: 8px; top: 16px; bottom: -2px; width: 2px; background: var(--line-strong); }

<script>
(() => {
'use strict';

// A Microsoft sign-in popup lands back on this page with ?code=...: hand it to the page that opened it and close.
if (window.opener && /[?&]code=/.test(location.search) && /[?&]state=mpcms/.test(location.search)) {
  try { window.opener.postMessage({ mpcMs: location.search }, location.origin); } catch (e) { /* the opener is gone */ }
  window.close();
  return;
}

/* ------------------------------------------------------------------ helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('mpc.' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('mpc.' + k, JSON.stringify(v)); } catch (e) { /* private window: keep working without saving */ } },
};
const dig = (obj, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
const time = (d = new Date()) => d.toLocaleTimeString('en-GB', { hour12: false });

const ICON = {
  route: '<path d="M5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M7 17h6a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h6"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  api: '<path d="M8 8 3 12l5 4M16 8l5 4-5 4M14 5l-4 14"/>',
  finger: '<path d="M6.2 9.5A6 6 0 0 1 18 9c0 3 .2 5-.8 8M12 11v3c0 3-1 5-2.4 6.5M9 14c0 3-.6 4.5-1.6 6M15 12c0 3-.5 5.5-1.6 7.6M4 12c0 2 .2 3.4-.4 5"/>',
  send: '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  play: '<path d="M7 4.5v15l12-7.5z"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  clip: '<path d="M12 5v14M5 12h14"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
  video: '<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-3v10l-5-3z"/>',
  camera: '<path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
  pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  audio: '<path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  more: '<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
};
const icon = (name, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[name]}</svg>`;

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3800);
}

function highlight(value) {
  let text;
  try { text = typeof value === 'string' ? JSON.stringify(JSON.parse(value), null, 2) : JSON.stringify(value, null, 2); } catch (e) { text = String(value); }
  return esc(text).replace(/(&quot;(?:(?!&quot;)[\s\S])*&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g, (m, str, colon, lit, num) => {
    if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
    if (lit) return `<span class="b">${lit}</span>`;
    return `<span class="n">${num}</span>`;
  });
}

/* ------------------------------------------------------------------ settings and saved values */
const DEFAULTS = {
  agentUrl: 'http://localhost:8082', paymentUrl: 'http://localhost:8083', companionUrl: 'http://localhost:8084',
  internalKey: 'change-me-to-a-long-random-string',
  customerPhone: '254700000001', staffPhone: '254700000002', approverPhone: '254700000003', adminPhone: '254700000004',
  callbackSecret: 'your-mpesa-callback-secret', deviceId: 'console-device-0001',
  googleClientId: '', microsoftClientId: '',
};
const VAR_DEFAULTS = {
  actionId: '00000000-0000-0000-0000-000000000000', paymentId: '00000000-0000-0000-0000-000000000000', operationId: '00000000-0000-0000-0000-000000000000',
  checkoutRequestId: 'ws_CO_000000000000000000', originatorConversationId: '00000000-0000-0000-0000-000000000000', linkCode: '', deviceToken: '', mediaId: '',
};
const cfg = Object.assign({}, DEFAULTS, store.get('cfg') || {});
const vars = Object.assign({}, VAR_DEFAULTS, store.get('vars') || {});
const saveCfg = () => store.set('cfg', cfg);
const saveVars = () => store.set('vars', vars);

const DYN = {
  uuid: () => crypto.randomUUID(),
  idem: () => 'wa-' + hex(20), opkey: () => 'op-' + hex(20), paykey: () => 'pay-' + hex(20),
  msgid: () => 'msg-' + hex(12),
  now: () => String(Math.floor(Date.now() / 1000)), nowMs: () => String(Date.now()),
  tomorrow: () => new Date(Date.now() + 86400000 + 3 * 3600000).toISOString().slice(0, 10),
};
function fill(text, ctx = {}) {
  return String(text).replace(/\{\{(\w+)\}\}/g, (m, k) => {
    if (k in DYN) return (ctx[k] = ctx[k] ?? DYN[k]());
    if (vars[k]) return vars[k];
    if (k in cfg) return cfg[k];
    return m;
  });
}

/* ------------------------------------------------------------------ the one function that talks to the services */
const LOG = [];
async function http(o) {
  const ctx = {};
  const f = (s) => fill(s, ctx);
  const base = String(cfg[o.svc + 'Url'] || '').replace(/\/+$/, '');
  const path = f(o.path);
  let qs = '';
  if (o.query) {
    const p = new URLSearchParams();
    Object.entries(o.query).forEach(([k, v]) => { if (v !== '' && v != null) p.append(k, f(String(v))); });
    qs = p.toString() ? '?' + p.toString() : '';
  }
  const url = base + path + qs;
  const headers = { Accept: 'application/json, text/plain, */*' };
  let bodyText;
  if (o.body != null && o.method !== 'GET') {
    bodyText = typeof o.body === 'string' ? f(o.body) : JSON.stringify(o.body);
    bodyText = f(bodyText.replace(/("smsAt":)"\{\{nowMs\}\}"/, '$1{{nowMs}}'));
    headers['Content-Type'] = 'application/json';
  }
  if (o.auth === 'internal') headers['X-Internal-Key'] = cfg.internalKey;
  if (o.auth === 'bearer') headers.Authorization = 'Bearer ' + (vars.deviceToken || '');
  if (o.headers) Object.entries(o.headers).forEach(([k, v]) => { headers[k] = f(String(v)); });
  const result = { method: o.method, url, svc: o.svc, path: path + qs, reqHeaders: headers, reqBody: bodyText, at: new Date(), ms: 0, status: 0, ok: false };
  const t0 = performance.now();
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), o.timeout || 30000);
    let res;
    try { res = await fetch(url, { method: o.method, headers, body: bodyText, signal: ctl.signal }); } finally { clearTimeout(timer); }
    result.status = res.status; result.ok = res.ok;
    result.resHeaders = Array.from(res.headers.entries());
    const mime = (res.headers.get('content-type') || '').split(';')[0].trim();
    result.mime = mime;
    if (/json/.test(mime)) {
      result.text = await res.text();
      try { result.json = JSON.parse(result.text); } catch (e) { /* show as text */ }
    } else if (/pdf|image|octet|audio|video/.test(mime)) {
      const blob = await res.blob();
      result.blobUrl = URL.createObjectURL(blob); result.size = blob.size;
    } else {
      result.text = await res.text();
    }
  } catch (e) {
    result.error = e.name === 'AbortError' ? 'The service took too long to answer.'
      : (e.message && !/fetch|network|load failed/i.test(e.message) ? e.message
        : `Cannot reach ${base}. Is the service running? If it is, start it with CORS_ALLOWED_ORIGINS=${location.origin} so this page may call it.`);
  }
  result.ms = Math.round(performance.now() - t0);
  if (result.ok && o.save && result.json) {
    Object.entries(o.save).forEach(([name, expr]) => {
      const v = dig(result.json, expr);
      if (v != null) vars[name] = String(v);
    });
    saveVars();
  }
  if (!o.silent) { LOG.unshift(result); if (LOG.length > 200) LOG.pop(); renderLogBar(); }
  return result;
}

function curlOf(r) {
  const parts = [`curl -i -X ${r.method} '${r.url}'`];
  Object.entries(r.reqHeaders || {}).forEach(([k, v]) => { if (k !== 'Accept') parts.push(`  -H '${k}: ${v}'`); });
  if (r.reqBody) parts.push(`  -d '${r.reqBody.replace(/'/g, "'\\''")}'`);
  return parts.join(' \\\n');
}

async function ping(svc) {
  const t0 = performance.now();
  const probe = {
    agent: { method: 'POST', path: '/internal/inbound', auth: 'internal', body: {} },
    companion: { method: 'GET', path: '/api/config', auth: 'none' },
    payment: { method: 'GET', path: '/internal/staff/' + cfg.customerPhone, auth: 'internal' },
  }[svc];
  const r = await http(Object.assign({ svc, silent: true, timeout: 3500 }, probe));
  if (!r.error) return { state: 'up', ms: r.ms, status: r.status };
  // The service may be running but not allow this page. A no-cors request tells the two cases apart.
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 2500);
    await fetch(String(cfg[svc + 'Url']).replace(/\/+$/, '') + '/', { mode: 'no-cors', signal: ctl.signal });
    clearTimeout(timer);
    return { state: 'blocked', ms: Math.round(performance.now() - t0) };
  } catch (e) { return { state: 'down', ms: Math.round(performance.now() - t0) }; }
}

  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => toast('Copy was blocked by the browser'));
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy was blocked by the browser'); } ta.remove(); }
}

/** One response, shown the same way in the explorer and in the log. */
function responseView(r) {
  const wrap = document.createElement('div');
  const head = `<div class="row"><span class="tag ${tone(r.status)}">${r.status || 'No answer'}</span><span class="muted small">${r.ms} ms</span><span class="muted small">${esc(r.method)} ${esc(r.path)}</span></div>`;
  let body;
  if (r.error) body = `<div class="callout warn">${esc(r.error)}</div>`;
  else if (r.blobUrl) {
    const pdf = /pdf/.test(r.mime), img = /image/.test(r.mime);
    body = `<div class="muted small">${esc(r.mime)}, ${(r.size / 1024).toFixed(1)} KB</div>` +
      (pdf ? `<iframe title="PDF preview" src="${r.blobUrl}" style="width:100%;height:420px;border:0;border-radius:10px;background:#fff"></iframe>` : img ? `<img alt="Response image" src="${r.blobUrl}" style="max-width:100%;border-radius:10px">` : '') +
      `<a class="btn sm" href="${r.blobUrl}" download="response">Download</a>`;
  } else body = `<pre class="json">${r.json !== undefined ? highlight(r.json) : esc(r.text || '(empty body)')}</pre>`;
  const hdrs = (r.resHeaders || []).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td><code>${esc(v)}</code></td></tr>`).join('') || '<tr><td class="muted">No headers (the request did not reach the service).</td></tr>';
  const reqH = Object.entries(r.reqHeaders || {}).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td><code>${esc(v)}</code></td></tr>`).join('');
  const tabs = ['Body', 'Headers', 'Request', 'curl'];
  const panes = [body, `<table>${hdrs}</table>`,
    `<table>${reqH}</table>` + (r.reqBody ? `<pre class="json" style="margin-top:10px">${highlight(r.reqBody)}</pre>` : ''),
    `<pre class="json">${esc(curlOf(r))}</pre><button type="button" class="btn sm" data-copycurl>Copy curl</button>`];
  wrap.innerHTML = head + `<div class="tabs" role="tablist" style="margin-top:10px">${tabs.map((t, i) => `<button type="button" role="tab" aria-selected="${i === 0}" data-tab="${i}">${t}</button>`).join('')}</div>` +
    panes.map((p, i) => `<div data-pane="${i}" ${i ? 'hidden' : ''}>${p}</div>`).join('');
  wrap.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { $$('[data-tab]', wrap).forEach((b) => b.setAttribute('aria-selected', String(b === t))); $$('[data-pane]', wrap).forEach((p) => { p.hidden = p.dataset.pane !== t.dataset.tab; }); }
    if (e.target.closest('[data-copycurl]')) copyText(curlOf(r), 'curl command');
  });
  return wrap;
}

/* ------------------------------------------------------------------ the fake M-Pesa messages (ported from the Flutter parser) */
function parseSms(text) {
  const t = String(text).replace(/\s+/g, ' ').trim();
  const code = (/^([A-Z0-9]{10})\s+confirmed/i.exec(t) || [])[1];
  const amt = /Ksh\s?([\d,]+(?:\.\d{1,2})?)/i.exec(t);
  if (!code || !amt) return null;
  const amount = Math.round(parseFloat(amt[1].replace(/,/g, '')));
  let m;
  if ((m = /bought Ksh\s?[\d,.]+ of airtime(?: for (\+?\d+))?/i.exec(t))) return { code: code.toUpperCase(), kind: 'AIRTIME', amount, payee: m[1] || null, account: null };
  if ((m = /sent to (.+?) for account (\S+?)\.? on /i.exec(t))) return { code: code.toUpperCase(), kind: 'BILL', amount, payee: m[1].trim(), account: m[2] };
  if ((m = /paid to (.+?)\.? on \d/i.exec(t))) return { code: code.toUpperCase(), kind: 'PAID', amount, payee: m[1].trim(), account: null };
  if ((m = /sent to (.+?) on \d/i.exec(t))) return { code: code.toUpperCase(), kind: 'SENT', amount, payee: m[1].trim(), account: null };
  return null;
}
const SMS_CODE = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'; return 'S' + Array.from(crypto.getRandomValues(new Uint8Array(9)), (b) => a[b % a.length]).join(''); };
function smsDate(d = new Date()) {
  const dd = String(d.getDate()).padStart(2, '0'), mm = String(d.getMonth() + 1).padStart(2, '0'), yy = String(d.getFullYear()).slice(2);
  let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${dd}/${mm}/${yy} at ${h}:${String(d.getMinutes()).padStart(2, '0')} ${ap}`;
}
function wrongDigits(num) { const n = String(num); return n.slice(0, -1) + ((Number(n.slice(-1)) + 1) % 10); }
/** What Safaricom would send the customer after this request is paid in M-Pesa. Only for the simulator. */
function fakeSmsFor(a, wrong) {
  const code = SMS_CODE(), when = smsDate(), kes = 'Ksh' + fmtKes(a.amount), d = a.details || {};
  const phone10 = (p) => '0' + String(p).replace(/\D/g, '').slice(-9);
  let text;
  switch (a.type) {
    case 'SEND_MONEY': { const n = d.recipientPhone ? phone10(d.recipientPhone) : '0712345678'; text = `${code} Confirmed. ${kes} sent to ${(d.recipientName || d.contactName || 'JOHN DOE').toUpperCase()} ${wrong ? wrongDigits(n) : n} on ${when}. New M-PESA balance is Ksh2,340.00. Transaction cost, Ksh7.00.`; break; }
    case 'PAY_POCHI': { const n = phone10(d.pochiPhone || '0722000111'); text = `${code} Confirmed. ${kes} sent to ${(d.businessName || 'POCHI SHOP').toUpperCase()} ${wrong ? wrongDigits(n) : n} on ${when}. New M-PESA balance is Ksh2,340.00.`; break; }
    case 'PAY_TILL': text = `${code} Confirmed. ${kes} paid to ${(d.businessName || 'MAMA MBOGA').toUpperCase()}. on ${when}. New M-PESA balance is Ksh2,340.00.`; break;
    case 'PAY_BILL': { const acc = d.account || '123456'; text = `${code} Confirmed. ${kes} sent to ${(d.businessName || 'KPLC PREPAID').toUpperCase()} for account ${wrong ? wrongDigits(acc) : acc} on ${when}. New M-PESA balance is Ksh2,340.00.`; break; }
    case 'BUY_AIRTIME': { const n = d.airtimePhone ? phone10(d.airtimePhone) : null; text = `${code} confirmed. You bought ${kes} of airtime${n ? ' for ' + (wrong ? wrongDigits(n) : n) : ''} on ${when}. New M-PESA balance is Ksh2,340.00.`; break; }
    default: return null;
  }
  return { code, text, at: Date.now() };
}
const INBOX = store.get('inbox') || [];
const saveInbox = () => store.set('inbox', INBOX.slice(0, 20));
function sendableEvidence(sms, action) {
  const p = parseSms(sms.text);
  if (!p) return null;
  // Like the real app: when the request names a contact, the payee is not sent, so the server never learns the number.
  const contact = action && action.details && action.details.contactName && !action.details.recipientPhone;
  return { code: p.code, kind: p.kind, amount: p.amount, payee: contact ? null : p.payee, account: p.account, smsAt: sms.at };
}

/** Adds one line to the trace. Lanes are numbered 1 to 5. Returns the element so it can be finished later. */
function evAdd(from, to, title, state, sub) {

    : `<span class="ev-track"><span class="ev-text">${esc(title)}</span><span class="ev-rule"></span><span class="ev-sub">${esc(sub || '')}</span></span>`;

}
function evFinish(b, state, title, sub, r) {

  const s = $('.ev-sub', b); if (s) s.textContent = sub || '';

/** A real call: shown as a moving line, then finished with the answer. */
async function evCall(from, to, title, promise) {

  evFinish(b, r.ok ? 'ok' : 'err', r.ok ? title : `${title}: ${errText(r)}`, subOf(r), r);

}

async function runRoute() {
  if (RT.busy) return;

  const stop = (msg) => { evFinish(evAdd(3, 3, msg, 'err'), 'err', msg); $('#rtOutcome').innerHTML = '<span class="tag bad">Stopped</span>'; };
  try {
    // 1 the customer writes
    if (ai) {
      const r = await evCall(1, 2, 'Customer text goes to the agent', send('ag.text', { body: inbound({ text: sc.say }) }));
      if (!r.ok) await evNote(2, 2, 'The AI step failed, the journey carries on without it');
    } else await evNote(1, 2, `Customer writes: ${sc.say}`, 'Simulated, no AI used');
    // 2 the agent prepares the request
    const made = await evCall(2, 3, 'Agent prepares the request', send(sc.ep));
    if (!made.ok) return stop('The request was not created. Check the companion address and the internal key in Settings.');
    const id = made.json.id; vars.actionId = id; saveVars();
    // 3 the phone is signed in and opens it
    let got = vars.deviceToken ? await send('co.a.get', { silent: true, path: `/api/actions/${id}` }) : { ok: false };
    if (!got.ok) {
      const code = await evCall(2, 3, 'A sign-in code is made for the customer', send('co.i.link'));
      if (!code.ok) return stop('No sign-in code could be made.');
      const ver = await evCall(4, 3, 'Phone signs in with the code', send('co.a.verify'));

    }
    got = await evCall(4, 3, 'Phone opens the request', send('co.a.get', { path: `/api/actions/${id}` }));
    if (!got.ok) return stop('The phone cannot see the request.');

    } else if (chk.ok) {

/* ------------------------------------------------------------------ contact finder
   Looks a person up wherever the customer keeps contacts: a Google account, a Microsoft or Outlook account,
   the device's own address book, or a vCard or CSV file exported from anywhere else. Everything is read in this
   browser. Nothing is saved, and only the person the customer picks is sent on. */
const CF = {
  source: store.get('csrc') || '', q: '', list: [], busy: false, err: '', note: '', done: false,
  onPick: null, token: { google: null, microsoft: null }, ms: null, file: null, fileName: '', picked: null, warmed: false,
};
const CF_SOURCES = [['google', 'Google'], ['microsoft', 'Microsoft'], ['device', 'This device'], ['file', 'vCard or CSV'], ['type', 'Type it']];
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/contacts.readonly https://www.googleapis.com/auth/contacts.other.readonly';

/** 0712345678 for Kenyan numbers in any common spelling, +country digits for the rest. */
function kenyanPhone(raw) {
  let d = String(raw || '').replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = '+' + d.slice(2);
  if (d.startsWith('+')) { const x = d.slice(1); return x.startsWith('254') && x.length === 12 ? '0' + x.slice(3) : d; }
  if (d.startsWith('254') && d.length === 12) return '0' + d.slice(3);
  if (/^[17]\d{8}$/.test(d)) return '0' + d;
  return d;
}
const looksLikeNumber = (n) => String(n).replace(/\D/g, '').length >= 7;

/* ---------------------------------------------------------------- file parsers */
function parseVcf(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').replace(/=\n/g, '').replace(/\n[ \t]/g, '').split('\n');
  const out = []; let cur = null;
  const decode = (v, head) => {
    if (/ENCODING=QUOTED-PRINTABLE/i.test(head)) { try { return decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi, '%$1')); } catch (e) { return v; } }
    return v.replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\n/gi, ' ');
  };
  for (const line of lines) {
    const i = line.indexOf(':'); if (i < 0) continue;
    const head = line.slice(0, i), value = line.slice(i + 1);
    const prop = head.split(';')[0].replace(/^[\w-]+\./, '').toUpperCase();
    if (prop === 'BEGIN') { cur = { name: '', alt: '', phones: [] }; continue; }
    if (prop === 'END') { if (cur && cur.phones.length) out.push({ name: cur.name || cur.alt || '(no name)', phones: cur.phones }); cur = null; continue; }
    if (!cur) continue;
    if (prop === 'FN') cur.name = decode(value, head).trim();
    else if (prop === 'N') { const p = decode(value, head).split(';'); cur.alt = [p[1], p[2], p[0]].filter(Boolean).join(' ').trim(); }
    else if (prop === 'TEL') {
      const label = (/TYPE=([^;:]+)/i.exec(head) || [])[1] || (/;(CELL|HOME|WORK|VOICE)\b/i.exec(head) || [])[1] || '';
      const n = value.replace(/^tel:/i, '').trim(); if (looksLikeNumber(n)) cur.phones.push({ n, label: label.toLowerCase() });
    }
  }
  return out;
}
function parseCsvRows(text) {
  const rows = []; let row = [], cell = '', q = false;
  const s = String(text).replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && s[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some((x) => x.trim())) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some((x) => x.trim())) rows.push(row);
  return rows;
}
/** Google, Outlook and most phone exports: a header row, a name or first and last name, and one or more phone columns. */
function parseCsv(text) {
  const rows = parseCsvRows(text); if (rows.length < 2) return [];
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const idx = (re) => head.map((h, i) => (re.test(h) ? i : -1)).filter((i) => i >= 0);
  const nameCols = idx(/^(name|display name|full name|file as)$/);
  const part = [idx(/^(first name|given name)$/)[0], idx(/^(middle name|additional name)$/)[0], idx(/^(last name|family name|surname)$/)[0]].filter((i) => i != null);
  const phoneCols = head.map((h, i) => (/(phone|mobile|tel|cell)/.test(h) && !/(label|type|country|code)\b/.test(h) ? i : -1)).filter((i) => i >= 0);
  const out = [];
  rows.slice(1).forEach((r) => {
    const name = (nameCols.map((i) => (r[i] || '').trim()).find(Boolean)) || part.map((i) => (r[i] || '').trim()).filter(Boolean).join(' ');
    const phones = [];
    phoneCols.forEach((i) => String(r[i] || '').split(/\s*:::\s*/).forEach((n) => { n = n.trim(); if (looksLikeNumber(n)) phones.push({ n, label: head[i].replace(/\s*-?\s*value$/, '').replace(/phone\s*\d*\s*/, '').trim() }); }));
    if (phones.length) out.push({ name: name || '(no name)', phones });
  });
  return out;
}

/* ---------------------------------------------------------------- Google */
function loadScript(src) {
  return new Promise((ok, no) => {
    if ($(`script[data-src="${src}"]`)) { const s = $(`script[data-src="${src}"]`); if (s.dataset.ready) return ok(); s.addEventListener('load', ok); s.addEventListener('error', no); return; }
    const s = document.createElement('script'); s.src = src; s.async = true; s.dataset.src = src;

const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  const w = window.open(url, 'mpcms', 'width=520,height=680');

    let done = false;

      const q = new URLSearchParams(ev.data.mpcMs);
      if (q.get('state') !== state) return no(new Error('Microsoft answered a different sign-in request. Try again.'));
      if (q.get('error')) return no(new Error(q.get('error_description') || q.get('error')));

    };

      if (!w.closed) return;

      setTimeout(() => { if (!done) { window.removeEventListener('message', onMsg); no(new Error('The Microsoft window was closed before access was allowed.')); } }, 400);
    }, 500);

  });

async function microsoftLoad() {

  for (let page = 0; url && page < 10; page++) {

    if (r.status === 401) { CF.token.microsoft = null; throw new Error('Microsoft sign-in expired. Search again to sign in.'); }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error((j.error && j.error.message) || `Microsoft answered ${r.status}.`); }

/* ---------------------------------------------------------------- searching */
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function localFilter(list, q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return list.slice(0, 50);
  return list.filter((c) => {
    const hay = norm(c.name) + ' ' + c.phones.map((p) => { const k = kenyanPhone(p.n).replace(/\D/g, ''); return p.n.replace(/\D/g, '') + ' ' + k + (/^0\d{9}$/.test(k) ? ' 254' + k.slice(1) : ''); }).join(' ');
    return words.every((w) => (/^[\d+()-]+$/.test(w) ? hay.includes(w.replace(/\D/g, '')) : hay.includes(w)));
  }).slice(0, 50);
}
async function cfSearch() {
  CF.busy = true; CF.err = ''; CF.note = ''; CF.done = false; drawFindResults();

    if (CF.source === 'google') CF.list = await googleSearch(CF.q.trim() || '');
    else if (CF.source === 'microsoft') CF.list = localFilter(await microsoftLoad(), CF.q);
    else if (CF.source === 'file') CF.list = localFilter(CF.file || [], CF.q);
    else if (CF.source === 'device') CF.list = localFilter(CF.picked || [], CF.q);
    CF.done = true;
  } catch (e) { CF.err = e.message || String(e); CF.list = []; }
  CF.busy = false; drawFindResults();
}

/* ---------------------------------------------------------------- composer */

  wireFinder();

  const toggle = (open) => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); btn.classList.toggle('on', open); if (open) $('button', menu).focus(); };
  btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(menu.hidden); });

  menu.addEventListener('keydown', (e) => {
    const items = $$('button', menu), i = items.indexOf(document.activeElement);

  });
  menu.addEventListener('click', (e) => {

    else if (a === 'audio') $('#fAudio').click();
    else if (a === 'doc') $('#fDoc').click();

    else if (a === 'location') openLocation();

  ['fPhoto', 'fVideo', 'fAudio', 'fDoc'].forEach((id) => $('#' + id).addEventListener('change', (e) => { stageFiles(Array.from(e.target.files)); e.target.value = ''; }));
  // drag and drop onto the whole chat
  const panel = $('#chPanel'); let depth = 0;
  panel.addEventListener('dragenter', (e) => { if ((e.dataTransfer.types || []).includes('Files')) { depth++; $('#chDrop').hidden = false; } });
  panel.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('#chDrop').hidden = true; });
  panel.addEventListener('dragover', (e) => { if ((e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
  panel.addEventListener('drop', (e) => { e.preventDefault(); depth = 0; $('#chDrop').hidden = true; stageFiles(Array.from(e.dataTransfer.files || [])); });
  // voice notes
  $('#chMic').addEventListener('click', startRec);
  $('#recCancel').addEventListener('click', () => stopRec(false));

  $('#chTray').addEventListener('click', (e) => { const x = e.target.closest('[data-rm]'); if (x) { ATT.splice(Number(x.dataset.rm), 1); drawTray(); } });

const refreshComposer = () => { if (wireComposer.refresh) wireComposer.refresh(); };

function kindOf(mime) { return /^image\//.test(mime) ? 'IMAGE' : /^video\//.test(mime) ? 'VIDEO' : /^audio\//.test(mime) ? 'AUDIO' : 'DOCUMENT'; }
function stageFiles(files) {
  files.forEach((f) => {
    if (f.size > 20 * 1048576) { toast(`${f.name} is larger than 20 MB, the upload limit`); return; }
    ATT.push({ kind: kindOf(f.type || ''), blob: f, name: f.name, mime: f.type || 'application/octet-stream', size: f.size, url: URL.createObjectURL(f) });
  });
  drawTray();
  $('#chText').focus();
}
function stageBlob(blob, kind, name, extra = {}) {
  ATT.push(Object.assign({ kind, blob, name, mime: blob.type, size: blob.size, url: URL.createObjectURL(blob) }, extra));
  drawTray();
}
function thumbOf(a) {
  if (a.kind === 'IMAGE') return `<img src="${a.url}" alt="">`;
  if (a.kind === 'VIDEO') return `<video src="${a.url}" muted preload="metadata"></video>`;
  return `<span class="ic big">${icon(a.kind === 'AUDIO' ? 'audio' : a.kind === 'CONTACTS' ? 'user' : a.kind === 'LOCATION' ? 'pin' : 'doc')}</span>`;
}
function drawTray() {
  const tray = $('#chTray');
  tray.hidden = !ATT.length;
  tray.innerHTML = ATT.map((a, i) => `<div class="tray-item"><div class="thumb">${thumbOf(a)}</div><div class="tinfo"><b>${esc(a.name)}</b><small>${a.size != null ? fmtSize(a.size) : ''}${a.sub ? esc(a.sub) : ''}</small></div><button type="button" class="round sm" data-rm="${i}" aria-label="Remove ${esc(a.name)}">${icon('x')}</button></div>`).join('');
  refreshComposer();
}

/* ---------------------------------------------------------------- voice notes */
async function startRec() {
  if (REC.rec) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { sys('This browser cannot record. Open the console as http://localhost:PORT in a current Chrome, Edge, Firefox or Safari.'); return; }
  try { REC.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { sys(e.name === 'NotAllowedError' ? 'The microphone was blocked. Allow it for this page in the address bar, then try again.' : 'No microphone could be opened: ' + e.message); return; }
  const mime = pickMime(['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']);
  REC.chunks = []; REC.send = false;
  REC.rec = new MediaRecorder(REC.stream, mime ? { mimeType: mime } : {});
  REC.rec.ondataavailable = (e) => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  REC.rec.onstop = finishRec;
  REC.rec.start(250);
  REC.t0 = Date.now();
  $('#chForm').hidden = true; $('#chRec').hidden = false; $('#chChips').hidden = true;
  REC.timer = setInterval(() => {
    const s = Math.floor((Date.now() - REC.t0) / 1000);
    $('#recTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s >= 180) stopRec(true);
  }, 250);
  // a live level meter, drawn on a small canvas
  try {
    REC.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = REC.ctx.createAnalyser(); an.fftSize = 64;
    REC.ctx.createMediaStreamSource(REC.stream).connect(an);
    const data = new Uint8Array(an.frequencyBinCount), cv = $('#recWave'), g = cv.getContext('2d');
    const draw = () => {
      an.getByteFrequencyData(data);
      g.clearRect(0, 0, cv.width, cv.height);
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2457d6';
      const n = 24, w = cv.width / n;
      for (let i = 0; i < n; i++) { const v = data[Math.floor(i * data.length / n)] / 255, h = Math.max(3, v * cv.height); g.fillRect(i * w + 2, (cv.height - h) / 2, w - 4, h); }
      REC.raf = requestAnimationFrame(draw);
    };
    draw();
  } catch (e) { /* the meter is optional */ }
  $('#recHint').textContent = 'Recording. Press send when done.';
}
function stopRec(send) {
  if (!REC.rec) return;
  REC.send = send;
  try { REC.rec.stop(); } catch (e) { finishRec(); }
}
function finishRec() {
  clearInterval(REC.timer); cancelAnimationFrame(REC.raf);
  if (REC.stream) REC.stream.getTracks().forEach((t) => t.stop());
  if (REC.ctx) { try { REC.ctx.close(); } catch (e) { /* already closed */ } REC.ctx = null; }
  const mime = (REC.rec && REC.rec.mimeType) || 'audio/webm', chunks = REC.chunks, send = REC.send, secs = Math.round((Date.now() - REC.t0) / 1000);
  REC.rec = null; REC.stream = null; REC.chunks = [];
  $('#chRec').hidden = true; $('#chForm').hidden = false; $('#chChips').hidden = false; $('#recTime').textContent = '0:00';
  if (send && chunks.length && secs >= 1) {
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    ATT.push({ kind: 'AUDIO', voice: true, blob, name: `Voice note ${secs}s`, mime: blob.type, size: blob.size, url: URL.createObjectURL(blob), secs });
    sendChat();
  } else if (send) toast('That was too short. Hold on a little longer.');
}

/* ---------------------------------------------------------------- camera and location */
const CAM = { stream: null, rec: null, chunks: [], mode: 'photo', t0: 0, timer: 0 };
async function openCam(mode) {

}
async function setCamMode(mode) {

  $$('#camMode button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.m === mode)));

  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: mode === 'video' });
    const v = $('#camView'); v.srcObject = CAM.stream; v.muted = true; await v.play().catch(() => {});
  } catch (e) {
    $('#camErr').hidden = false;
    $('#camErr').textContent = (e.name === 'NotAllowedError' ? 'The camera was blocked. Allow it for this page in the address bar. ' : e.name === 'NotFoundError' ? 'No camera was found on this computer. ' : 'The camera could not start: ' + e.message + '. ') + 'You can still choose a file instead.';
  }
}
function stopCamStream() { if (CAM.stream) CAM.stream.getTracks().forEach((t) => t.stop()); CAM.stream = null; $('#camView').srcObject = null; }
function closeCam() { if (CAM.rec) { CAM.rec.onstop = null; try { CAM.rec.stop(); } catch (e) { /* idle */ } CAM.rec = null; } clearInterval(CAM.timer); stopCamStream(); const d = $('#dlgCam'); if (d.open) d.close(); }
function wireDialogs() {
  $('#camMode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !CAM.rec) setCamMode(b.dataset.m); });
  $('#camShot').addEventListener('click', () => {
    const v = $('#camView'); if (!v.videoWidth) return;

  });
  $('#camRec').addEventListener('click', () => {
    if (CAM.rec) { CAM.rec.stop(); return; }

    CAM.chunks = []; CAM.rec = new MediaRecorder(CAM.stream, mime ? { mimeType: mime } : {});
    CAM.rec.ondataavailable = (e) => { if (e.data && e.data.size) CAM.chunks.push(e.data); };
    CAM.rec.onstop = () => {
      const type = (CAM.rec && CAM.rec.mimeType || 'video/webm').split(';')[0];
      const blob = new Blob(CAM.chunks, { type }); CAM.rec = null;

    CAM.timer = setInterval(() => { const s = Math.floor((Date.now() - CAM.t0) / 1000); $('#camTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s >= 60 && CAM.rec) CAM.rec.stop(); }, 250);
  });
  $('#camFile').addEventListener('click', () => { const m = CAM.mode; closeCam(); $(m === 'video' ? '#fVideo' : '#fPhoto').click(); });

  // location
  $('#locHere').addEventListener('click', () => {

    $('#locHere').disabled = true;

      (err) => { $('#locHere').disabled = false; toast(err.code === 1 ? 'Location was blocked for this page' : 'Could not find your location'); }, { timeout: 8000 });
  });

  $('#locForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const label = $('#locLabel').value.trim();

  });
}
const openLocation = () => { $('#dlgLocation').showModal(); };

/* ---------------------------------------------------------------- bubbles */
/** *bold*, _italic_, `code` and links, the little Markdown the assistant writes. */
function rich(text) {
  let h = esc(text);
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<b>$2</b>').replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>').replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return h.replace(/\n/g, '<br>');
}
function bubble(cls, html, meta) {
  const b = document.createElement('div'); b.className = 'bubble ' + cls;
  b.innerHTML = html + (meta === false ? '' : `<div class="meta">${meta || time()}</div>`);
  const box = $('#chMsgs'); const typing = $('#chTyping');
  if (typing) box.insertBefore(b, typing); else box.append(b);
  box.scrollTop = box.scrollHeight; return b;
}
const sys = (t) => bubble('sys', esc(t), false);
function cardActions(a) {
  const open = ['CREATED', 'APPROVED'].includes(a.status);
  return `<div class="actions"><button type="button" class="btn sm" data-open="${a.id}">Open in phone</button>${open ? `<button type="button" class="btn sm danger" data-cancel="${a.id}">Cancel</button>` : ''}</div>`;
}
const MEDIA = new Map();
/** Chat files need the sign-in header, so they are fetched and shown from a local blob. */
async function mediaUrl(id) {
  if (MEDIA.has(id)) return MEDIA.get(id);
  const p = (async () => {
    const res = await fetch(String(cfg.companionUrl).replace(/\/+$/, '') + '/api/chat/media/' + encodeURIComponent(id), { headers: { Authorization: 'Bearer ' + (vars.deviceToken || '') } });
    if (res.status === 401 || res.status === 403) { dropSession('Your sign-in ended. Sign in again.'); throw new Error('signed out'); }
    if (!res.ok) throw new Error('The file is no longer available (' + res.status + ').');
    return URL.createObjectURL(await res.blob());
  })();
  MEDIA.set(id, p); p.catch(() => MEDIA.delete(id));
  return p;
}
function hydrateMedia(root) {
  $$('[data-media]', root).forEach((el) => {
    if (el.dataset.loading) return; el.dataset.loading = '1';
    mediaUrl(el.dataset.media).then((u) => {
      if (el.tagName === 'A') { el.href = u; el.classList.remove('wait'); } else { el.src = u; el.classList.remove('wait'); }
    }).catch((e) => { if (el.tagName !== 'A') { el.replaceWith(Object.assign(document.createElement('small'), { textContent: e.message })); } else el.classList.add('gone'); });
  });
}
function localMediaHtml(a, caption) {
  const cap = caption ? `<div class="cap">${esc(caption)}</div>` : '';
  switch (a.kind) {
    case 'IMAGE': return `<img class="m-img" src="${a.url}" alt="${esc(a.name)}">${cap}`;
    case 'VIDEO': return `<video class="m-img" src="${a.url}" controls preload="metadata"></video>${cap}`;
    case 'AUDIO': return `<div class="m-audio"><span class="ic">${icon(a.voice ? 'mic' : 'audio')}</span><audio src="${a.url}" controls preload="metadata"></audio></div><div class="small">${esc(a.name)}</div>`;
    case 'DOCUMENT': return `<a class="m-doc" href="${a.url}" download="${esc(a.name)}"><span class="ic">${icon('doc')}</span><span><b>${esc(a.name)}</b><small>${fmtSize(a.size)}, ${esc(a.mime.split('/').pop())}</small></span></a>${cap}`;
    default: return esc(a.name);
  }
}
/** A link to a request in the assistant's words becomes a button that opens it in the Phone tab. */
function openLink(m) {
  const link = m.dir === 'out' && /\/a\/([0-9a-fA-F-]{36})/.exec(m.text || '');
  return link ? `<div class="actions"><button type="button" class="btn sm" data-open="${link[1]}">Open in phone</button></div>` : '';
}
/** One chat message from the server, as a bubble. dir "in" is the customer, "out" is the assistant. */
function messageHtml(m) {
  const cap = m.caption ? `<div class="cap">${rich(m.caption)}</div>` : '';
  switch (m.kind) {
    case 'TEXT': return rich(m.text || '') + openLink(m);
    case 'BUTTONS': return rich(m.text || '') + openLink(m) + (m.footer ? `<div class="foot">${esc(m.footer)}</div>` : '') + `<div class="qbtns">${(m.buttons || []).map((b) => `<button type="button" class="btn sm" data-btn="${esc(b.id)}" data-title="${esc(b.title)}">${esc(b.title)}</button>`).join('')}</div>`;
    case 'LIST': return rich(m.text || '') + `<div class="qlist">${m.listTitle ? `<div class="lbl">${esc(m.listTitle)}</div>` : ''}${(m.rows || []).map((r) => `<button type="button" class="qrow" data-row="${esc(r.id)}" data-title="${esc(r.title)}"><b>${esc(r.title)}</b>${r.description ? `<small>${esc(r.description)}</small>` : ''}</button>`).join('')}</div>`;
    case 'IMAGE': return `<img class="m-img wait" data-media="${esc(m.mediaId)}" alt="${esc(m.caption || 'Image')}">${cap}`;
    case 'VIDEO': return `<video class="m-img wait" data-media="${esc(m.mediaId)}" controls preload="metadata"></video>${cap}`;
    case 'AUDIO': return `<div class="m-audio"><span class="ic">${icon(m.voiceNote ? 'mic' : 'audio')}</span><audio class="wait" data-media="${esc(m.mediaId)}" controls preload="metadata"></audio></div><div class="small">${esc(m.fileName || (m.voiceNote ? 'Voice note' : 'Audio'))}</div>`;
    case 'DOCUMENT': return `<a class="m-doc wait" data-media="${esc(m.mediaId)}" download="${esc(m.fileName || 'file')}" href="#"><span class="ic">${icon('doc')}</span><span><b>${esc(m.fileName || 'Document')}</b><small>${esc(String(m.mimeType || '').split('/').pop())}</small></span></a>${cap}`;
    case 'LOCATION': { const la = Number(m.latitude), lo = Number(m.longitude); return `<div class="m-card"><span class="ic">${icon('pin')}</span><span><b>${esc(m.locationLabel || 'Shared location')}</b><small>${la.toFixed(5)}, ${lo.toFixed(5)}</small></span></div><a class="small" href="https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}#map=16/${la}/${lo}" target="_blank" rel="noopener noreferrer">Open the map</a>`; }
    case 'CONTACTS': return `<div class="m-card"><span class="ic">${icon('user')}</span><span><b>${esc(String(m.contactsSummary || '').replace(/\s\S+$/, '') || 'Contact')}</b><small>${esc((/\S+$/.exec(m.contactsSummary || '') || [''])[0])}</small></span></div>`;
    case 'CONTACT_LOOKUP': return `<div class="m-card"><span class="ic">${icon('user')}</span><span><b>Looking for ${esc(m.query || 'a contact')}</b><small>Choose the person from your contacts</small></span></div><div class="actions"><button type="button" class="btn sm primary" data-find="${esc(m.query || '')}">Find in contacts</button></div>`;
    case 'BUTTON_REPLY': case 'LIST_REPLY': return `<span class="small">Chose</span> <b>${esc(m.actionTitle || m.actionId)}</b>`;
    default: return esc(m.text || m.kind);
  }
}
function addMessage(m) {
  const at = m.at ? new Date(m.at).toLocaleTimeString('en-GB', { hour12: false }) : time();
  const b = bubble(m.dir === 'in' ? 'me' : 'bot', messageHtml(m), at);
  b.dataset.mid = m.id; b.dataset.kind = m.kind;
  hydrateMedia(b);
  return b;
}

/* ---------------------------------------------------------------- sending */
async function postChat(fields) {
  const r = await send('co.ch.send', { body: Object.assign({ clientMessageId: DYN.msgid() }, fields) });
  if (r.status === 401 || r.status === 403) { dropSession('Your sign-in ended. Sign in again.'); return r; }
  if (!r.ok) sys(`The message was not sent: ${errText(r)}`);
  pollChat(true); setTimeout(() => pollChat(true), 1200);
  return r;
}
/** Uploads one file to the chat and returns the media id, or null. */
async function uploadMedia(a) {
  const url = String(cfg.companionUrl).replace(/\/+$/, '') + '/api/chat/media';
  const headers = { 'Content-Type': a.mime || 'application/octet-stream', Authorization: 'Bearer ' + (vars.deviceToken || ''), 'X-File-Name': String(a.name || 'file').replace(/[^\x20-\x7e]/g, '_') };
  const r = { method: 'POST', url, svc: 'companion', path: '/api/chat/media', reqHeaders: headers, reqBody: `(${a.size} bytes of ${a.mime})`, at: new Date(), ms: 0, status: 0, ok: false };
  const t0 = performance.now();
  try {

function cmdItems() {
  const items = [];
  VIEWS.forEach((v) => items.push({ k: 'Go to', t: v.title, run: () => show(v.id) }));
  items.push({ k: 'Do', t: 'Run the journey', run: () => { show('route'); setTimeout(runRoute, 60); } });
  items.push({ k: 'Do', t: 'Check the services again', run: checkServices });
  items.push({ k: 'Do', t: 'Open settings', run: openSettings });
  items.push({ k: 'Do', t: 'Show or hide the request log', run: () => setDock($('#logList').hidden) });
  THEMES.forEach((t) => items.push({ k: 'Theme', t: t.name, run: () => setTheme(t.id) }));
  CATALOG.forEach((e) => items.push({ k: e.method, t: `${e.name}  ${e.path}`, run: () => { EX.sel = e.id; EX.q = ''; EX.svc = 'all'; const b = $('#v-api'); delete b.dataset.built; b.innerHTML = ''; show('api'); } }));
  return items;
}
function drawCmd() {
  const q = $('#cmdIn').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  CMD.shown = CMD.items.filter((i) => words.every((w) => (i.k + ' ' + i.t).toLowerCase().includes(w))).slice(0, 40);
  CMD.sel = Math.min(CMD.sel, Math.max(0, CMD.shown.length - 1));
  $('#cmdList').innerHTML = CMD.shown.length ? CMD.shown.map((i, n) => `<button type="button" class="cmd-item" role="option" data-n="${n}" aria-selected="${n === CMD.sel}"><span class="tag ${['GET', 'POST', 'DELETE'].includes(i.k) ? 'method ' + i.k.toLowerCase() : ''}" style="min-width:56px;justify-content:center">${esc(i.k)}</span><span>${esc(i.t)}</span></button>`).join('') : '<div class="empty">Nothing matches.</div>';
  const cur = $('#cmdList [aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function openCmd() {
  CMD.items = cmdItems(); CMD.sel = 0; $('#cmdIn').value = '';
  if (!$('#dlgCmd').open) $('#dlgCmd').showModal();
  drawCmd(); $('#cmdIn').focus();
}
function runCmd(n) { const it = CMD.shown[n]; if (!it) return; $('#dlgCmd').close(); it.run(); }
$('#cmdIn').addEventListener('input', () => { CMD.sel = 0; drawCmd(); });
$('#cmdIn').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); CMD.sel = Math.min(CMD.sel + 1, CMD.shown.length - 1); drawCmd(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CMD.sel = Math.max(CMD.sel - 1, 0); drawCmd(); }
  else if (e.key === 'Enter') { e.preventDefault(); runCmd(CMD.sel); }
});
$('#cmdList').addEventListener('click', (e) => { const b = e.target.closest('.cmd-item'); if (b) runCmd(Number(b.dataset.n)); });
$('#openCmd').addEventListener('click', openCmd);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if ($('#dlgCmd').open) $('#dlgCmd').close(); else openCmd(); }
});

/* ------------------------------------------------------------------ start */
initThemes();
initNav();
renderPills();
drawRoute();
const startView = (location.hash || '').slice(1) || store.get('view') || 'route';
show(startView);
checkServices();
setInterval(() => { if (!document.hidden) checkServices(); }, 45000);
applyLogo();
})();
</script>

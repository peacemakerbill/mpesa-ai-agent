const CF_SOURCES = [['google', 'Google'], ['microsoft', 'Microsoft'], ['device', 'This device'], ['file', 'vCard or CSV'], ['type', 'Type it']];
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/contacts.readonly https://www.googleapis.com/auth/contacts.other.readonly';

/** 0712345678 for Kenyan numbers in any common spelling, +country digits for the rest. */
function kenyanPhone(raw) {
  let d = String(raw || '').replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = '+' + d.slice(2);
  if (d.startsWith('+')) { const x = d.slice(1); return x.startsWith('254') && x.length === 12 ? '0' + x.slice(3) : d; }
  if (d.startsWith('254') && d.length === 12) return '0' + d.slice(3);
  if (/^[17]\d{8}$/.test(d)) return '0' + d;
  return d;
}
const looksLikeNumber = (n) => String(n).replace(/\D/g, '').length >= 7;

/* ---------------------------------------------------------------- file parsers */
function parseVcf(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').replace(/=\n/g, '').replace(/\n[ \t]/g, '').split('\n');
  const out = []; let cur = null;
  const decode = (v, head) => {
    if (/ENCODING=QUOTED-PRINTABLE/i.test(head)) { try { return decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi, '%$1')); } catch (e) { return v; } }
    return v.replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\n/gi, ' ');
  };
  for (const line of lines) {
    const i = line.indexOf(':'); if (i < 0) continue;
    const head = line.slice(0, i), value = line.slice(i + 1);
    const prop = head.split(';')[0].replace(/^[\w-]+\./, '').toUpperCase();
    if (prop === 'BEGIN') { cur = { name: '', alt: '', phones: [] }; continue; }
    if (prop === 'END') { if (cur && cur.phones.length) out.push({ name: cur.name || cur.alt || '(no name)', phones: cur.phones }); cur = null; continue; }
    if (!cur) continue;
    if (prop === 'FN') cur.name = decode(value, head).trim();
    else if (prop === 'N') { const p = decode(value, head).split(';'); cur.alt = [p[1], p[2], p[0]].filter(Boolean).join(' ').trim(); }
    else if (prop === 'TEL') {
      const label = (/TYPE=([^;:]+)/i.exec(head) || [])[1] || (/;(CELL|HOME|WORK|VOICE)\b/i.exec(head) || [])[1] || '';
      const n = value.replace(/^tel:/i, '').trim(); if (looksLikeNumber(n)) cur.phones.push({ n, label: label.toLowerCase() });
    }
  }
  return out;
}
function parseCsvRows(text) {
  const rows = []; let row = [], cell = '', q = false;
  const s = String(text).replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && s[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some((x) => x.trim())) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some((x) => x.trim())) rows.push(row);
  return rows;
}
/** Google, Outlook and most phone exports: a header row, a name or first and last name, and one or more phone columns. */
function parseCsv(text) {
  const rows = parseCsvRows(text); if (rows.length < 2) return [];
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const idx = (re) => head.map((h, i) => (re.test(h) ? i : -1)).filter((i) => i >= 0);
  const nameCols = idx(/^(name|display name|full name|file as)$/);
  const part = [idx(/^(first name|given name)$/)[0], idx(/^(middle name|additional name)$/)[0], idx(/^(last name|family name|surname)$/)[0]].filter((i) => i != null);
  const phoneCols = head.map((h, i) => (/(phone|mobile|tel|cell)/.test(h) && !/(label|type|country|code)\b/.test(h) ? i : -1)).filter((i) => i >= 0);
  const out = [];
  rows.slice(1).forEach((r) => {
    const name = (nameCols.map((i) => (r[i] || '').trim()).find(Boolean)) || part.map((i) => (r[i] || '').trim()).filter(Boolean).join(' ');
    const phones = [];
    phoneCols.forEach((i) => String(r[i] || '').split(/\s*:::\s*/).forEach((n) => { n = n.trim(); if (looksLikeNumber(n)) phones.push({ n, label: head[i].replace(/\s*-?\s*value$/, '').replace(/phone\s*\d*\s*/, '').trim() }); }));
    if (phones.length) out.push({ name: name || '(no name)', phones });
  });
  return out;
}

function loadScript(src) {
  return new Promise((ok, no) => {
    if ($(`script[data-src="${src}"]`)) { const s = $(`script[data-src="${src}"]`); if (s.dataset.ready) return ok(); s.addEventListener('load', ok); s.addEventListener('error', no); return; }
    const s = document.createElement('script'); s.src = src; s.async = true; s.dataset.src = src;
    s.onload = () => { s.dataset.ready = '1'; ok(); }; s.onerror = () => no(new Error('Could not load ' + new URL(src).host + '. Check your connection.'));
    document.head.append(s);
  });
}
function googleToken() {
  const t = CF.token.google; if (t && t.exp > Date.now() + 30000) return Promise.resolve(t.t);
  if (!window.google || !google.accounts || !google.accounts.oauth2) return Promise.reject(new Error('Google sign-in is still loading. Try again in a moment.'));
  return new Promise((ok, no) => {
    const c = google.accounts.oauth2.initTokenClient({
      client_id: cfg.googleClientId, scope: GOOGLE_SCOPES, prompt: '',
      callback: (r) => { if (r.error) no(new Error(r.error_description || r.error)); else { CF.token.google = { t: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000 }; ok(r.access_token); } },
      error_callback: (e) => no(new Error(e && e.type === 'popup_closed' ? 'The Google window was closed before access was allowed.' : e && e.type === 'popup_failed_to_open' ? 'The browser blocked the Google window. Allow pop-ups for this page.' : 'Google sign-in failed.')),
    });

async function googleSearch(q) {
  const token = await googleToken();
  const get = async (url) => {
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { CF.token.google = null; throw new Error('Google sign-in expired. Search again to sign in.'); }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error((j.error && j.error.message) || `Google answered ${r.status}.`); }
    return r.json();
  };
  const base = 'https://people.googleapis.com/v1/', mask = 'names,phoneNumbers';
  if (!CF.warmed) { CF.warmed = true; await Promise.all([get(`${base}people:searchContacts?query=&readMask=names`), get(`${base}otherContacts:search?query=&readMask=names`)]).catch(() => {}); }
  const e = encodeURIComponent(q);
  const [mine, other] = await Promise.all([get(`${base}people:searchContacts?query=${e}&readMask=${mask}&pageSize=10`), get(`${base}otherContacts:search?query=${e}&readMask=${mask}&pageSize=10`).catch(() => ({}))]);
  const seen = new Set(), out = [];

    const name = ((p.names || [])[0] || {}).displayName || '(no name)', key = name + '|' + phones.map((n) => kenyanPhone(n.n)).join(',');
    if (phones.length && !seen.has(key)) { seen.add(key); out.push({ name, phones, from: label }); }

/* ---------------------------------------------------------------- Microsoft */
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function microsoftToken() {
  const t = CF.token.microsoft; if (t && t.exp > Date.now() + 30000) return t.t;
  if (!crypto.subtle) throw new Error('Microsoft sign-in needs a secure page. Open this console as http://localhost:PORT.');
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32))), challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const state = 'mpcms' + hex(8), redirect = location.origin + location.pathname, scope = 'Contacts.Read';
  const url = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize?' + new URLSearchParams({ client_id: cfg.microsoftClientId, response_type: 'code', redirect_uri: redirect, response_mode: 'query', scope, code_challenge: challenge, code_challenge_method: 'S256', state, prompt: 'select_account' });
  const w = window.open(url, 'mpcms', 'width=520,height=680');
  if (!w) throw new Error('The browser blocked the Microsoft window. Allow pop-ups for this page.');
  const code = await new Promise((ok, no) => {
    let done = false;
    const onMsg = (ev) => {
      if (ev.origin !== location.origin || !ev.data || !ev.data.mpcMs) return;
      done = true; window.removeEventListener('message', onMsg); clearInterval(timer);
      const q = new URLSearchParams(ev.data.mpcMs);
      if (q.get('state') !== state) return no(new Error('Microsoft answered a different sign-in request. Try again.'));
      if (q.get('error')) return no(new Error(q.get('error_description') || q.get('error')));
      ok(q.get('code'));
    };
    const timer = setInterval(() => {
      if (!w.closed) return;
      clearInterval(timer);
      // the popup posts its answer and closes itself, so give the message a moment to arrive
      setTimeout(() => { if (!done) { window.removeEventListener('message', onMsg); no(new Error('The Microsoft window was closed before access was allowed.')); } }, 400);
    }, 500);
    window.addEventListener('message', onMsg);
  });
  const res = await fetch('https://login.microsoftonline.com/common/oauth2/v2.0/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: cfg.microsoftClientId, grant_type: 'authorization_code', code, redirect_uri: redirect, code_verifier: verifier, scope }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || !j.access_token) throw new Error(j.error_description ? j.error_description.split('\n')[0] : 'Microsoft did not give access.');

}
/** Outlook contacts are listed once, then searched here. Graph has no name search for contacts. */
async function microsoftLoad() {

  for (let page = 0; url && page < 10; page++) {

    if (r.status === 401) { CF.token.microsoft = null; throw new Error('Microsoft sign-in expired. Search again to sign in.'); }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error((j.error && j.error.message) || `Microsoft answered ${r.status}.`); }

/* ---------------------------------------------------------------- searching */
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function localFilter(list, q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return list.slice(0, 50);
  return list.filter((c) => {
    const hay = norm(c.name) + ' ' + c.phones.map((p) => { const k = kenyanPhone(p.n).replace(/\D/g, ''); return p.n.replace(/\D/g, '') + ' ' + k + (/^0\d{9}$/.test(k) ? ' 254' + k.slice(1) : ''); }).join(' ');
    return words.every((w) => (/^[\d+()-]+$/.test(w) ? hay.includes(w.replace(/\D/g, '')) : hay.includes(w)));
  }).slice(0, 50);
}
async function cfSearch() {
  CF.busy = true; CF.err = ''; CF.note = ''; CF.done = false; drawFindResults();
  try {
    if (CF.source === 'google') CF.list = await googleSearch(CF.q.trim() || '');
    else if (CF.source === 'microsoft') CF.list = localFilter(await microsoftLoad(), CF.q);
    else if (CF.source === 'file') CF.list = localFilter(CF.file || [], CF.q);
    else if (CF.source === 'device') CF.list = localFilter(CF.picked || [], CF.q);
    CF.done = true;
  } catch (e) { CF.err = e.message || String(e); CF.list = []; }
  CF.busy = false; drawFindResults();
}

}

const refreshComposer = () => { if (wireComposer.refresh) wireComposer.refresh(); };

function kindOf(mime) { return /^image\//.test(mime) ? 'IMAGE' : /^video\//.test(mime) ? 'VIDEO' : /^audio\//.test(mime) ? 'AUDIO' : 'DOCUMENT'; }
function stageFiles(files) {
  files.forEach((f) => {
    if (f.size > 20 * 1048576) { toast(`${f.name} is larger than 20 MB, the upload limit`); return; }
    ATT.push({ kind: kindOf(f.type || ''), blob: f, name: f.name, mime: f.type || 'application/octet-stream', size: f.size, url: URL.createObjectURL(f) });
  });
  drawTray();
  $('#chText').focus();
}
/** The three sizes, the same as the app: the long side of a photo in pixels, the JPEG quality, and the bits a recorded video uses each second. */
const COMPRESS = {
  original: { label: 'Original', edge: 0, q: 1, bps: 8000000, hint: 'Send photos and videos exactly as they are. Large files can be refused by the server and use more data.' },
  balanced: { label: 'Balanced', edge: 1920, q: 0.82, bps: 2500000, hint: 'Photos up to 1920 pixels on the long side. Videos at medium quality. Good for receipts and screenshots.' },
  small: { label: 'Small', edge: 1280, q: 0.68, bps: 1000000, hint: 'Photos up to 1280 pixels on the long side. Videos at low quality. Uses the least data.' },
};
const level = () => COMPRESS[cfg.compression] || COMPRESS.balanced;
/** A photo under 200 KB, a GIF or an SVG is left alone. The result is used only when it is smaller than what was picked. */
async function shrinkPhoto(blob) {
  const L = level();
  if (!L.edge || !/^image\//.test(blob.type) || /gif|svg/.test(blob.type) || blob.size < 200 * 1024 || !window.createImageBitmap) return null;
  try {
    const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
    const long = Math.max(bmp.width, bmp.height), k = long > L.edge ? L.edge / long : 1;
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, c.width, c.height); if (bmp.close) bmp.close();
    // a picture with see-through parts stays a PNG, everything else becomes a JPEG
    let png = false;
    if (blob.type === 'image/png') { const d = g.getImageData(0, 0, c.width, c.height).data; for (let i = 3; i < d.length; i += 4) { if (d[i] < 255) { png = true; break; } } }
    const enc = (q) => new Promise((ok) => c.toBlob(ok, png ? 'image/png' : 'image/jpeg', q));
    let q = L.q, out = await enc(q);
    while (out && !png && out.size > 4500000 && q > 0.4) { q -= 0.12; out = await enc(q); }   // the server reads photos up to 5 MB
    return out && out.size < blob.size ? out : null;
  } catch (e) { return null; }
}
const working = (text) => { const w = $('#chWork'); if (w) { w.hidden = !text; w.innerHTML = text ? `${waitHtml(text)}` : ''; } };
let stageChain = Promise.resolve();
function pushAtt(blob, kind, name, extra = {}) {
  ATT.push(Object.assign({ kind, blob, name, mime: blob.type, size: blob.size, url: URL.createObjectURL(blob) }, extra));
  drawTray();
}
/** Puts a file in the tray. A photo is made smaller first, one at a time so the order is kept. */
function stageBlob(blob, kind, name, extra = {}) {
  stageChain = stageChain.then(async () => {
    if (kind === 'IMAGE' && level().edge) {
      working('Making the photo smaller');
      const small = await shrinkPhoto(blob);
      working('');
      if (small) { pushAtt(small, kind, name.replace(/\.[^.]*$/, '') + (small.type === 'image/png' ? '.png' : '.jpg'), Object.assign({ sub: `, was ${fmtSize(blob.size)}` }, extra)); return; }
    }
    pushAtt(blob, kind, name, extra);
  }).catch(() => { working(''); pushAtt(blob, kind, name, extra); });
}
function thumbOf(a) {
  if (a.kind === 'IMAGE') return `<img src="${a.url}" alt="">`;
  if (a.kind === 'VIDEO') return `<video src="${a.url}" muted preload="metadata"></video>`;
  return `<span class="ic big">${icon(a.kind === 'AUDIO' ? 'audio' : a.kind === 'CONTACTS' ? 'user' : a.kind === 'LOCATION' ? 'pin' : 'doc')}</span>`;
}
function drawTray() {
  const tray = $('#chTray');
  tray.hidden = !ATT.length;
  tray.innerHTML = ATT.map((a, i) => `<div class="tray-item"><div class="thumb">${thumbOf(a)}</div><div class="tinfo"><b>${esc(a.name)}</b><small>${a.size != null ? fmtSize(a.size) : ''}${a.sub ? esc(a.sub) : ''}</small></div><button type="button" class="round sm" data-rm="${i}" aria-label="Remove ${esc(a.name)}">${icon('x')}</button></div>`).join('');
  refreshComposer();
}

/* ---------------------------------------------------------------- voice notes */
async function startRec() {
  if (REC.rec) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { sys('This browser cannot record. Open the console as http://localhost:PORT in a current Chrome, Edge, Firefox or Safari.'); return; }
  try { REC.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { sys(e.name === 'NotAllowedError' ? 'The microphone was blocked. Allow it for this page in the address bar, then try again.' : 'No microphone could be opened: ' + e.message); return; }
  const mime = pickMime(['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']);
  REC.chunks = []; REC.send = false;
  REC.rec = new MediaRecorder(REC.stream, mime ? { mimeType: mime } : {});
  REC.rec.ondataavailable = (e) => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  REC.rec.onstop = finishRec;
  REC.rec.start(250);
  REC.t0 = Date.now();
  $('#chForm').hidden = true; $('#chRec').hidden = false; $('#chChips').hidden = true;
  REC.timer = setInterval(() => {
    const s = Math.floor((Date.now() - REC.t0) / 1000);
    $('#recTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s >= 180) stopRec(true);
  }, 250);
  // a live level meter, drawn on a small canvas
  try {
    REC.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = REC.ctx.createAnalyser(); an.fftSize = 64;
    REC.ctx.createMediaStreamSource(REC.stream).connect(an);
    const data = new Uint8Array(an.frequencyBinCount), cv = $('#recWave'), g = cv.getContext('2d');
    const draw = () => {
      an.getByteFrequencyData(data);
      g.clearRect(0, 0, cv.width, cv.height);
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2457d6';
      const n = 24, w = cv.width / n;
      for (let i = 0; i < n; i++) { const v = data[Math.floor(i * data.length / n)] / 255, h = Math.max(3, v * cv.height); g.fillRect(i * w + 2, (cv.height - h) / 2, w - 4, h); }
      REC.raf = requestAnimationFrame(draw);
    };
    draw();
  } catch (e) { /* the meter is optional */ }
  $('#recHint').textContent = 'Recording. Press send when done.';
}
function stopRec(send) {
  if (!REC.rec) return;
  REC.send = send;
  try { REC.rec.stop(); } catch (e) { finishRec(); }
}
function finishRec() {
  clearInterval(REC.timer); cancelAnimationFrame(REC.raf);
  if (REC.stream) REC.stream.getTracks().forEach((t) => t.stop());
  if (REC.ctx) { try { REC.ctx.close(); } catch (e) { /* already closed */ } REC.ctx = null; }
  const mime = (REC.rec && REC.rec.mimeType) || 'audio/webm', chunks = REC.chunks, send = REC.send, secs = Math.round((Date.now() - REC.t0) / 1000);
  REC.rec = null; REC.stream = null; REC.chunks = [];
  $('#chRec').hidden = true; $('#chForm').hidden = false; $('#chChips').hidden = false; $('#recTime').textContent = '0:00';
  if (send && chunks.length && secs >= 1) {
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    ATT.push({ kind: 'AUDIO', voice: true, blob, name: `Voice note ${secs}s`, mime: blob.type, size: blob.size, url: URL.createObjectURL(blob), secs });
    sendChat();
  } else if (send) toast('That was too short. Hold on a little longer.');
}

/* ---------------------------------------------------------------- camera and location */
const CAM = { stream: null, rec: null, chunks: [], mode: 'photo', t0: 0, timer: 0 };
async function openCam(mode) {

  } catch (e) {

  });

/* ---------------------------------------------------------------- sending */
async function postChat(fields) {
  const r = await send('co.ch.send', { body: Object.assign({ clientMessageId: DYN.msgid() }, fields) });
  if (r.status === 401 || r.status === 403) { dropSession('Your sign-in ended. Sign in again.'); return r; }
  if (!r.ok) sys(`The message was not sent: ${errText(r)}`);
  pollChat(true); setTimeout(() => pollChat(true), 1200);
  return r;
}
/** Uploads one file to the chat and returns the media id, or null. */
async function uploadMedia(a) {

  } catch (e) { r.error = `Cannot reach ${cfg.agentxUrl}. Is the Daraja Agent-X API running with CORS_ALLOWED_ORIGINS=${location.origin}?`; }

async function sendChat() {

  for (let i = 0; i < items.length; i++) {
    const a = items[i], caption = i === 0 && a.kind !== 'AUDIO' && a.kind !== 'CONTACTS' && a.kind !== 'LOCATION' ? text : '';

async function onPhoneClick(ev) {
  const t = ev.target.closest('[data-act],[data-copy]'); if (!t) return;
  if (t.dataset.copy) return copyText(t.dataset.copy, 'Value');
  const act = t.dataset.act;
  switch (act) {
    case 'refresh': loadList(); break;
    case 'unlink': await signOut(); break;
    case 'find': { const a = P.a; openFinder({ title: 'Find in contacts', query: (a.details || {}).contactName || '', onPick: (c) => { P.picked[a.id] = c; renderPhone(); } }); break; }

    case 'back': P.screen = 'list'; P.a = null; P.err = ''; P.info = ''; renderPhone(); loadList(); break;
    case 'close': P.sheet = null; P.err = ''; renderPhone(); break;
    case 'sheet-finger': P.sheet = 'finger'; renderPhone(); break;
    case 'scan': case 'scan-lock': {
      const f = $('#phFinger'); if (f) f.classList.add('scanning');
      await sleep(1000);
      await mutate('approve', { method: act === 'scan' ? 'BIOMETRIC' : 'DEVICE_CREDENTIAL' }, 'Approved. Now open M-Pesa to finish.');
      break; }
    case 'decline': await mutate('decline', undefined, 'Declined.'); break;
    case 'handoff': { const r = await mutate('handoff'); if (r && r.ok) { if (!P.conf) loadConf(); P.sheet = 'mpesa'; renderPhone(); } break; }
    case 'sheet-mpesa': if (!P.conf) loadConf(); P.sheet = 'mpesa'; renderPhone(); break;
    case 'finish-mpesa': {
      const m = fakeSmsFor(withPicked(P.a), P.wrong);
      if (m) { INBOX.unshift(m); saveInbox(); P.info = 'A message from MPESA arrived. Choose Check my M-Pesa message.'; }

    case 'done': await mutate('report', { outcome: 'DONE' }, 'Reported as done. Check your M-Pesa message to back it up.'); break;
    case 'notdone': await mutate('report', { outcome: 'NOT_DONE' }, 'Reported as not done.'); break;

  const r = await bz('GET', '/api/business-accounts');
  BZ.loading = false;
  if (bzFail(r)) return;
  if (r.ok && Array.isArray(r.json)) {
    BZ.accounts = r.json; BZ.loaded = true;
    const keep = BZ.accounts.find((a) => a.id === vars.bizAccountId);
    if (!keep && BZ.accounts[0]) { vars.bizAccountId = BZ.accounts[0].id; saveVars(); }
  } else BZ.err = errText(r);
  drawBzAccounts();
}
function bzCaps(a) {
  return (a.capabilities || []).map((c) => `<span class="tag ${c.ready ? 'good' : ''}" title="${c.ready ? 'Ready' : 'Needs ' + esc(c.needs)}">${esc(c.label)}</span>`).join(' ');
}

  const src = a.credentialSources || { app: a.consumerKeyHint ? (branch ? 'HEAD' : 'OWN') : 'NONE', passkey: a.hasPasskey ? (branch ? 'HEAD' : 'OWN') : 'NONE', initiator: a.hasInitiatorPassword ? (branch ? 'HEAD' : 'OWN') : 'NONE' };

function drawBzAccounts() {
  const box = $('#bzAccounts'); if (!box) return;
  const err = BZ.err ? `<div class="err" role="alert">${esc(BZ.err)}</div>` : '', info = BZ.info ? `<div class="note" role="status">${esc(BZ.info)}</div>` : '';
  let body;
  if (BZ.loading && !BZ.loaded) body = loadingHtml();
  else if (!BZ.accounts.length) body = '<div class="empty">No business accounts yet. Press <b>Add an account</b>, or upload a CSV file below.</div>';
  else body = `<div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Where</th><th>Shortcode</th><th>Credentials</th><th>What it can do</th><th></th></tr></thead><tbody>${bzOrdered().map(bzRow).join('')}</tbody></table></div>`;
  box.innerHTML = `${err}${info}${body}<div class="callout">Secrets are encrypted on the server (AES-256-GCM) and are never sent back. Money going out always waits for approval, see the requests below.</div>`;
}

/* ---------------------------------------------------------------- the account form */
const blankForm = (mode, head, what) => ({
  what: what || 'shared', credentials: what === 'own' ? 'own' : 'head',
  id: null, mode, label: '', environment: 'sandbox', shortcodeType: 'paybill', shortcode: '', tillNumber: '', accountReference: '',
  parentId: head ? head.id : '', consumerKey: '', consumerSecret: '', initiatorName: '', initiatorPassword: '', passkey: '', has: null,
});
function bzReadForm() {
  const f = BZ.form; if (!f) return;
  $$('[data-bf]', $('#bzFormPanel')).forEach((el) => { f[el.dataset.bf] = el.value; });
}
function bzHeadOf(f) { return BZ.accounts.find((a) => a.id === f.parentId); }
function drawBzForm() {
  const p = $('#bzFormPanel'); if (!p) return;
  const f = BZ.form;

  const sel = (key, label, opts, o = {}) => `<div class="field"><label for="bzf-${key}">${label}</label><select id="bzf-${key}" data-bf="${key}" ${o.redraw ? 'data-redraw="1"' : ''}>${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(f[key]) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;

      ${inp('consumerSecret', 'Consumer secret', { type: 'password', help: keep(h.secret, 'secret') || (note ? 'From the same app. Empty uses the head office\'s.' : 'From the same app.') })}</div>
      <div class="grid2">${inp('passkey', 'STK passkey', { type: 'password', help: keep(h.passkey, 'passkey') || (note ? 'Belongs to this shortcode only, so it is never taken from the head office.' : 'Needed for STK Push. The sandbox passkey is on the Daraja portal.') })}
      <div></div></div>
      <div class="grid2">${inp('initiatorName', 'Initiator name', { help: note ? 'For payouts, balance, status and reversals. Empty uses the head office\'s.' : 'For payouts, balance, status and reversals.' })}
      ${inp('initiatorPassword', 'Initiator password', { type: 'password', help: keep(h.initPw, 'password') || 'The security credential is made for you from this and Safaricom\'s certificate.' })}</div>`;
  let fields;
  if (branch) {
    const head = bzHeadOf(f);

    const own = f.what === 'own';
    const h = (f.has || {});
    const chooser = head ? sel('what', 'What is it?', [['shared', bg ? 'A till, on the head office\'s shortcode' : 'An account reference, on the head office\'s shortcode'], ['own', bg ? 'A store number, with its own shortcode' : 'A child shortcode, with its own number']], { redraw: true }) : '';
    let more = '';
    if (!head) more = '<div class="callout">Choose the head office first. A child belongs to a head office and is in its environment.</div>';
    else if (!own) more = `<div class="callout">This one shares the head office\'s shortcode and credentials. ${bg ? 'Add its till number.' : 'Add its account reference.'}</div>${bg ? inp('tillNumber', 'Till number', { ph: '5 to 7 digits', max: 7 }) : inp('accountReference', 'Account reference', { ph: 'Up to 12 letters or digits', max: 12 })}`;
    else {
      more = `<div class="callout">${bg ? 'A store number is a shortcode of its own, with the till number linked to it.' : 'A child of a Paybill is a shortcode of its own and has no till number.'}</div>
        ${inp('shortcode', bg ? 'Store number (child shortcode)' : 'Child shortcode', { ph: '5 to 7 digits', max: 7 })}
        ${bg ? inp('tillNumber', 'Till number linked to this store', { ph: '5 to 7 digits', max: 7 }) : inp('accountReference', 'Account reference (optional)', { ph: 'Up to 12 letters or digits', max: 12 })}
        ${sel('credentials', 'Which credentials does it use?', [['own', 'Its own (it went live on its own)'], ['head', 'The head office\'s']], { redraw: true })}
        ${f.credentials === 'own' ? credFields(h, true) : '<div class="callout">The key and secret, and the initiator, come from the head office. STK Push also needs this shortcode\'s own passkey, so choose its own credentials to add it.</div>'}`;
    }

      ${chooser}${more}`;
  } else {
    const h = (f.has || {});
    fields = `<div class="grid2">${sel('environment', 'Environment', [['sandbox', 'Sandbox (testing)'], ['production', 'Production (real money)']])}
      ${sel('shortcodeType', 'Shortcode type', [['paybill', 'Paybill'], ['buy_goods', 'Buy Goods (store or head office)']])}</div>
      ${inp('shortcode', 'Shortcode', { ph: '5 to 7 digits', max: 7 })}
      <div class="callout">Fill in what this head office has from the Daraja portal. If its stores or child shortcodes went live on their own, you can leave the credentials empty and add them on each one.</div>

    <div class="pb stack">${BZ.formErr ? `<div class="err" role="alert">${esc(BZ.formErr)}</div>` : ''}
      ${inp('label', 'Name', { ph: branch ? (f.what === 'own' ? 'For example Mombasa store' : 'For example Till 1') : 'For example Main shop', max: 80 })}
      ${fields}
      <div class="row"><button type="button" class="btn primary" data-bz="form-save" ${BZ.formBusy ? 'disabled' : ''}>${BZ.formBusy ? 'Saving' : 'Save'}</button><button type="button" class="btn" data-bz="form-close">Cancel</button></div>
    </div>`;
}
function bzEdit(a) {
  const branch = !!a.parentId;
  const s = a.credentialSources || { app: branch ? 'HEAD' : 'OWN', passkey: branch ? 'HEAD' : 'OWN', initiator: branch ? 'HEAD' : 'OWN' };
  const anyOwn = s.app === 'OWN' || s.passkey === 'OWN' || s.initiator === 'OWN';
  BZ.form = Object.assign(blankForm(branch ? 'branch' : 'head', null, a.ownShortcode ? 'own' : 'shared'), {
    id: a.id, labelWas: a.label, label: a.label, environment: (a.environment || 'SANDBOX').toLowerCase(), shortcodeType: a.shortcodeType === 'BUY_GOODS' ? 'buy_goods' : 'paybill',
    shortcode: branch && !a.ownShortcode ? '' : a.shortcode, tillNumber: a.tillNumber || '', accountReference: a.accountReference || '', parentId: a.parentId || '',
    initiatorName: s.initiator === 'HEAD' ? '' : (a.initiatorName || ''), credentials: branch ? (anyOwn ? 'own' : 'head') : 'own',
    has: { secret: s.app === 'OWN' && a.hasConsumerSecret, passkey: s.passkey === 'OWN' && a.hasPasskey, initPw: s.initiator === 'OWN' && a.hasInitiatorPassword, keyHint: s.app === 'OWN' ? a.consumerKeyHint : '' },
  });
  BZ.formErr = ''; drawBzForm(); $('#bzFormPanel').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
async function bzSave() {
  bzReadForm();
  const f = BZ.form; if (!f || BZ.formBusy) return;
  const body = { label: f.label };
  if (f.mode === 'branch') {
    body.parentId = f.parentId || null; body.tillNumber = f.tillNumber; body.accountReference = f.accountReference;
    const head = bzHeadOf(f);
    if (f.what === 'own') {
      body.shortcode = f.shortcode; body.credentials = f.credentials;
      if (f.credentials === 'own') {
        Object.assign(body, { consumerKey: f.consumerKey, consumerSecret: f.consumerSecret, passkey: f.passkey, initiatorName: f.initiatorName, initiatorPassword: f.initiatorPassword });
        const nothing = !(f.consumerKey || f.consumerSecret || f.passkey || f.initiatorName || f.initiatorPassword);
        const had = f.has && (f.has.secret || f.has.passkey || f.has.initPw || f.has.keyHint);
        if (nothing && !had) { BZ.formErr = 'Add the credentials from this shortcode\'s own Daraja app, or choose the head office\'s credentials.'; drawBzForm(); return; }
      }
    } else if (head) {
      body.shortcode = head.shortcode; // the head office\'s own number keeps it on the shared shortcode
    }
  } else {
    Object.assign(body, { environment: f.environment, shortcodeType: f.shortcodeType, shortcode: f.shortcode, consumerKey: f.consumerKey, consumerSecret: f.consumerSecret, passkey: f.passkey, initiatorName: f.initiatorName, initiatorPassword: f.initiatorPassword });
  }
  Object.keys(body).forEach((k) => { if (body[k] === '' || body[k] == null) delete body[k]; });
  BZ.formBusy = true; BZ.formErr = ''; drawBzForm();
  const r = f.id ? await bz('PUT', '/api/business-accounts/' + f.id, { body }) : await bz('POST', '/api/business-accounts', { body });
  BZ.formBusy = false;
  if (bzFail(r)) return;
  if (!r.ok) { BZ.formErr = errText(r); drawBzForm(); return; }
  if (r.json && r.json.id) { vars.bizAccountId = r.json.id; saveVars(); }
  BZ.form = null; BZ.info = f.id ? 'Saved the changes.' : 'Saved the account.'; drawBzForm();
  await loadBzAccounts();
  setTimeout(() => { BZ.info = ''; drawBzAccounts(); }, 4000);
}
async function bzVerify(id) {
  BZ.checking = id; drawBzAccounts();
  const r = await bz('POST', `/api/business-accounts/${id}/verify`, { timeout: 45000 });
  BZ.checking = null;
  if (bzFail(r)) return;
  if (r.json && typeof r.json.ok === 'boolean') BZ.checks[id] = r.json;
  else BZ.checks[id] = { ok: false, message: errText(r), securityCredentialReady: false, securityCredentialMessage: '' };
  await loadBzAccounts();
}
async function bzDelete(id) {
  if (BZ.delConfirm !== id) { BZ.delConfirm = id; drawBzAccounts(); return; }
  BZ.delConfirm = null;
  const r = await bz('DELETE', '/api/business-accounts/' + id);
  if (bzFail(r)) return;
  if (!r.ok) BZ.err = errText(r); else { BZ.err = ''; BZ.info = r.json && r.json.removed > 1 ? `Deleted ${r.json.removed} accounts (the head and its branches).` : 'Deleted.'; delete BZ.checks[id]; if (BZ.form && BZ.form.id === id) BZ.form = null; drawBzForm(); }
  await loadBzAccounts();
  setTimeout(() => { BZ.info = ''; drawBzAccounts(); }, 4000);
}

/* ---------------------------------------------------------------- CSV upload */
function drawBzCsv() {
  const box = $('#bzCsv'); if (!box) return;
  const c = BZ.csv;
  let result = '';
  if (BZ.csvErr) result = `<div class="err" role="alert">${esc(BZ.csvErr)}</div>`;
  else if (c) {
    const issues = c.issues || [], rows = c.rows || [];
    result = `<div class="row tight"><span class="tag">${c.total} row${c.total === 1 ? '' : 's'}</span><span class="tag good">${c.created} to add</span><span class="tag info">${c.updated} to update</span>
      ${issues.length ? `<span class="tag bad">${issues.length} problem${issues.length === 1 ? '' : 's'}</span>` : c.saved ? '<span class="tag good">Saved</span>' : '<span class="tag good">No problems</span>'}</div>
      ${c.ignoredColumns && c.ignoredColumns.length ? `<div class="callout warn">These columns are not used and were ignored: <b>${esc(c.ignoredColumns.join(', '))}</b>.</div>` : ''}
      ${issues.length ? `<div class="callout warn"><b>Nothing was saved.</b> Fix the file and check it again. Row 1 is the header line, so the first account is row 2.</div>
        <div style="overflow-x:auto"><table><thead><tr><th>Row</th><th>Column</th><th>Problem</th></tr></thead><tbody>${issues.map((i) => `<tr><td>${i.row || 'File'}</td><td class="mono">${esc(i.field || '')}</td><td>${esc(i.message)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${rows.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Row</th><th>Name</th><th>Environment</th><th>Type</th><th>Shortcode</th><th>Till or account</th><th>Under</th><th>What happens</th></tr></thead><tbody>${rows.map((x) => `<tr><td>${x.row}</td><td>${esc(x.label)}</td><td>${esc(x.environment || '')}</td><td>${esc(x.shortcodeType || '')}</td><td class="mono">${esc(x.shortcode || '')}</td><td class="mono">${esc(x.tillNumber || x.accountReference || '')}</td><td class="mono">${esc(x.parent || '')}</td><td><span class="tag ${x.action === 'create' ? 'good' : 'info'}">${x.action === 'create' ? 'Add' : 'Update'}</span></td></tr>`).join('')}</tbody></table></div>` : ''}
      ${!issues.length && !c.saved && c.dryRun ? `<div class="row"><button type="button" class="btn primary" data-bz="csv-save" ${BZ.csvBusy ? 'disabled' : ''}>Save ${c.total} account${c.total === 1 ? '' : 's'}</button><span class="muted small">The file is sent again and saved only if it is still clean.</span></div>` : ''}`;
  }
  box.innerHTML = `<p class="muted small">Up to 500 accounts and 1 MB, UTF-8, the first line is the header. Columns can be in any order and can be left out, and commas, semicolons or tabs can separate them. Nothing is saved until the check is clean, and one bad row stops the whole file. <b>Treat a filled-in file as a secret and delete it after uploading.</b></p>
    <div class="row"><input type="file" id="bzFile" accept=".csv,.tsv,.txt,text/csv" aria-label="CSV file"><button type="button" class="btn" data-bz="csv-check" ${BZ.file && !BZ.csvBusy ? '' : 'disabled'}>${BZ.csvBusy && !c ? 'Checking' : 'Check the file'}</button></div>
    ${result}
    <details><summary class="small">What goes in each column</summary><div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Column</th><th>Head row</th><th>Branch row</th></tr></thead><tbody>${CSV_COLUMNS.map(([a, b, d]) => `<tr><td class="mono">${esc(a)}</td><td>${esc(b)}</td><td>${esc(d)}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted small" style="margin-top:6px">A row for an account that is already saved updates it, and an empty consumer_secret keeps the saved one. Values that start with PASTE_ are refused, so the example file cannot be uploaded by mistake.</p></details>`;
  const fi = $('#bzFile');
  if (fi) fi.addEventListener('change', () => { BZ.file = fi.files[0] || null; BZ.csv = null; BZ.csvErr = ''; drawBzCsv(); });
}
async function bzCsv(dry) {
  if (!BZ.file || BZ.csvBusy) return;
  BZ.csvBusy = true; BZ.csvErr = ''; if (dry) BZ.csv = null; drawBzCsv();
  const fd = new FormData(); fd.append('file', BZ.file, BZ.file.name);
  const r = await bz('POST', '/api/business-accounts/import', { form: fd, query: { dryRun: dry ? 'true' : 'false' }, timeout: 60000 });
  BZ.csvBusy = false;
  if (bzFail(r)) return;
  if (r.json && Array.isArray(r.json.rows)) {
    BZ.csv = r.json;
    if (r.json.saved) { BZ.file = null; BZ.info = `Saved: ${r.json.created} added, ${r.json.updated} updated.`; loadBzAccounts(); setTimeout(() => { BZ.info = ''; drawBzAccounts(); }, 5000); }
  } else BZ.csvErr = errText(r);
  drawBzCsv();
}
async function bzTemplate(copy) {
  const r = await bz('GET', '/api/business-accounts/csv-template');
  if (bzFail(r)) return;
  if (!r.ok || !r.text) { toast(errText(r)); return; }
  if (copy) { copyText(r.text, 'The template'); return; }
  const url = URL.createObjectURL(new Blob([r.text], { type: 'text/csv' }));
  const a = document.createElement('a'); a.href = url; a.download = 'agentx-business-accounts-template.csv'; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------------------------------------------------------------- business requests from the chat */
async function loadBzOps(quiet) {
  const r = await bz('GET', '/api/business-operations', { silent: !!quiet });
  if (bzFail(r)) return;
  if (r.ok && Array.isArray(r.json)) {
    BZ.ops = r.json; BZ.opsLoaded = true; BZ.opErr = '';
    if (BZ.ops[0]) { vars.bizOperationId = BZ.ops[0].id; saveVars(); }
  } else if (!quiet) BZ.opErr = errText(r);
  drawBzOps();
}
function drawBzOps() {
  const box = $('#bzOps'); if (!box) return;
  const err = BZ.opErr ? `<div class="err" role="alert">${esc(BZ.opErr)}</div>` : '';
  const list = BZ.ops.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Request</th><th>Account</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${BZ.ops.map(bzOpRow).join('')}</tbody></table></div>`
    : `<div class="empty">${BZ.opsLoaded ? 'No business requests yet. Ask the assistant in the chat, for example: <i>what is the balance of Main shop</i> or <i>send an STK push of 100 to 0712345678 from Main shop</i>.' : waitHtml()}</div>`;
  box.innerHTML = `${err}<div class="callout"><b>Money going out always waits for you.</b> B2C, Pochi, B2B and reversals are sent to Safaricom only after you approve here (the app asks for your fingerprint, face or phone lock, or for a code sent to your number by text message). A request is sent at most once. If the answer is unclear it is marked <b>unclear</b> and never sent again, so check your M-Pesa statement before trying again. The approval method is only recorded, it is not a Safaricom confirmation.</div>${list}`;
}
function bzOpRow(o) {

async function bzOpAct(id, kind) {

/* ---------------------------------------------------------------- events */

  switch (b.dataset.bz) {
    case 'refresh': loadBzAccounts(); break;
    case 'add-head': BZ.form = blankForm('head'); BZ.formErr = ''; drawBzForm(); $('#bzFormPanel').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); break;
    case 'add-branch': BZ.form = blankForm('branch', a); BZ.formErr = ''; drawBzForm(); $('#bzFormPanel').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); break;

    case 'form-save': bzSave(); break;
    case 'verify': bzVerify(id); break;

const pr = (method, path, extra = {}) => http(Object.assign({ svc: 'agentx', method, path, auth: 'bearer' }, extra));
/** True when the token was refused, after showing the sign-in forms again. */

/* ---------------------------------------------------------------- sign up */
function drawPrSign() {
  const s = PR.su;
  const inp = (key, label, o = {}) => `<div class="field"><label for="prsu-${key}">${label}</label><input id="prsu-${key}" data-su="${key}" type="${o.type || 'text'}" autocomplete="off" value="${esc(s[key])}" placeholder="${esc(o.ph || '')}" ${s.sent ? 'disabled' : ''}></div>`;
  $('#prSignBody').innerHTML = `<p class="muted">Already have an account? Ask for a code, then enter it. This is the same sign-in the Chat and Phone tabs use.</p>
    <div class="signin-box">${signInHtml('prof', false)}</div>
    <hr>
    <h3>New here? Create an account</h3>
    <p class="muted small">The details wait until the SMS code is typed. When an email is given, a second code goes to that inbox and is typed under Email after sign in.</p>
    <div class="grid2">${inp('first', 'First name')}${inp('last', 'Last name')}</div>
    <div class="grid2">${inp('middle', 'Middle name (optional)')}${inp('phone', 'Phone number', { type: 'tel', ph: '0712 345 678' })}</div>
    ${inp('email', 'Email (optional)', { type: 'email' })}
    ${s.sent ? `<div class="field"><label for="prsu-code">6 digit code</label><input id="prsu-code" data-su="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" value="${esc(s.code)}"></div>` : ''}
    ${s.err ? `<div class="err" role="alert">${esc(s.err)}</div>` : ''}${s.info ? `<div class="note" role="status">${esc(s.info)}</div>` : ''}
    <div class="row">${s.sent
    ? `<button type="button" class="btn primary" data-pr="su-verify" ${s.busy ? 'disabled' : ''}>${s.busy ? 'Creating' : 'Create account'}</button><button type="button" class="btn" data-pr="su-request" ${s.busy ? 'disabled' : ''}>Send a new code</button><button type="button" class="btn ghost" data-pr="su-change">Change my details</button>`
    : `<button type="button" class="btn primary" data-pr="su-request" ${s.busy ? 'disabled' : ''}>${s.busy ? 'Sending' : 'Send me a code'}</button>`}</div>`;
}
async function prSignupRequest() {
  const s = PR.su; if (s.busy) return;
  if (!s.first.trim() || !s.last.trim()) { s.err = 'Enter the first and last name.'; s.info = ''; return drawPrSign(); }
  if (!s.phone.trim()) { s.err = 'Enter the phone number.'; s.info = ''; return drawPrSign(); }
  s.busy = true; s.err = ''; s.info = ''; drawPrSign();
  const body = { phone: s.phone.trim(), firstName: s.first.trim(), lastName: s.last.trim() };
  if (s.middle.trim()) body.middleName = s.middle.trim();
  if (s.email.trim()) body.email = s.email.trim();
  const r = await send('co.s.request', { body });
  s.busy = false;
  if (!r.ok) s.err = errText(r);
  else { s.sent = true; s.info = r.json && r.json.devCode ? `The code ${r.json.devCode} is filled in below (this server shows codes on screen, CODE_SHOW_IN_APP, development and staging only).` : 'A code is on its way by SMS.'; if (r.json && r.json.devCode) s.code = r.json.devCode; cfg.customerPhone = s.phone.trim(); saveCfg(); }
  drawPrSign();
}
async function prSignupVerify() {
  const s = PR.su; if (s.busy) return;
  if (!/^\d{6}$/.test(s.code.trim())) { s.err = 'The code has 6 digits.'; return drawPrSign(); }
  s.busy = true; s.err = ''; drawPrSign();
  const r = await send('co.s.verify', { body: { phone: s.phone.trim(), code: s.code.trim(), deviceId: cfg.deviceId, deviceName: 'Console' } });
  s.busy = false;
  if (!r.ok) { s.err = errText(r); return drawPrSign(); }
  PR.su = { first: '', middle: '', last: '', phone: '', email: '', code: '', sent: false, busy: false, err: '', info: '' };
  PR.loaded = false; PR.rec = []; PR.recLoaded = false; PR.log = []; PR.logLoaded = false;
  afterSignIn();
}

/* ---------------------------------------------------------------- the profile */
async function loadPrProfile() {
  PR.busy = 'load'; PR.err = ''; drawPrProfile();
  const r = await pr('GET', '/api/profile');
  PR.busy = '';
  if (prFail(r)) return;
  if (r.ok && r.json) { PR.profile = r.json; PR.loaded = true; } else PR.err = errText(r);
  drawPrProfile(); drawPrEmail();
  if (PR.profile && PR.profile.hasPicture && PR.picVer !== PR.profile.pictureVersion) loadPrPicture(); else if (PR.profile && !PR.profile.hasPicture) { PR.picUrl = ''; PR.picVer = -1; drawPrProfile(); }
}
async function loadPrPicture() {
  const ver = PR.profile.pictureVersion;
  const r = await pr('GET', '/api/profile/picture', { silent: true });
  if (r.ok && r.blobUrl) { PR.picUrl = r.blobUrl; PR.picVer = ver; drawPrProfile(); }
}
function drawPrProfile() {
  const box = $('#prProfile'); if (!box) return;
  const p = PR.profile;
  if (!p) { box.innerHTML = PR.err ? `<div class="err" role="alert">${esc(PR.err)}</div>` : loadingHtml(); return; }
  const f = PR.form = PR.form || {};
  const val = (k) => (k in f ? f[k] : (p[k] == null ? '' : p[k]));
  const inp = (key, label, o = {}) => `<div class="field"><label for="prf-${key}">${label}</label><input id="prf-${key}" data-pf="${key}" type="${o.type || 'text'}" autocomplete="off" value="${esc(val(key))}" ${o.step ? `step="${o.step}"` : ''}></div>`;
  const chk = (key, label) => `<label class="row tight"><input type="checkbox" data-pf="${key}" ${val(key) ? 'checked' : ''}> ${label}</label>`;
  const pic = PR.picUrl ? `<img src="${PR.picUrl}" alt="Profile picture" width="72" height="72" style="border-radius:50%;object-fit:cover">`
    : `<div aria-hidden="true" style="width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:700">${esc(p.initials || '?')}</div>`;
  box.innerHTML = `${PR.err ? `<div class="err" role="alert">${esc(PR.err)}</div>` : ''}${PR.info ? `<div class="note" role="status">${esc(PR.info)}</div>` : ''}
    <div class="row">${pic}<div><b>${esc(p.fullName || 'No name yet')}</b><br><span class="muted small">${esc(p.phone)} &middot; ${esc(p.status)}</span></div></div>
    <div class="row"><input type="file" id="prPicFile" accept="image/png,image/jpeg" aria-label="Picture (PNG or JPEG)"><button type="button" class="btn sm" data-pr="pic-upload" ${PR.busy === 'pic' ? 'disabled' : ''}>${PR.busy === 'pic' ? 'Sending' : 'Upload picture'}</button>${p.hasPicture ? '<button type="button" class="btn sm danger" data-pr="pic-remove">Remove picture</button>' : ''}</div>
    <div class="grid2">${inp('firstName', 'First name')}${inp('lastName', 'Last name')}</div>
    <div class="grid2">${inp('middleName', 'Middle name')}${inp('address', 'Street or building')}</div>
    <div class="grid2">${inp('city', 'Town or city')}${inp('county', 'County')}</div>
    <div class="grid2">${inp('country', 'Country')}<div></div></div>
    <div class="grid2">${inp('latitude', 'Latitude', { type: 'number', step: 'any' })}${inp('longitude', 'Longitude', { type: 'number', step: 'any' })}</div>
    <div class="row tight"><button type="button" class="btn sm" data-pr="use-location">Use this computer's location</button><button type="button" class="btn sm ghost" data-pr="clear-location">Clear the saved location</button></div>
    <div class="stack tight">${chk('notifySignIn', 'Email me when my account signs in')}${chk('notifyPayments', 'Email me when a payment is complete')}</div>
    <div class="row"><button type="button" class="btn primary" data-pr="save" ${PR.busy === 'save' ? 'disabled' : ''}>${PR.busy === 'save' ? 'Saving' : 'Save changes'}</button></div>`;
}
async function prSave() {
  const p = PR.profile, f = PR.form || {}; if (!p || PR.busy) return;
  const body = {};
  ['firstName', 'middleName', 'lastName', 'address', 'city', 'county', 'country'].forEach((k) => { if (k in f) body[k] = String(f[k]); });
  if ('notifySignIn' in f) body.notifySignIn = !!f.notifySignIn;
  if ('notifyPayments' in f) body.notifyPayments = !!f.notifyPayments;
  if (f.clearLocation) body.clearLocation = true;
  else if (('latitude' in f || 'longitude' in f) && String(f.latitude ?? p.latitude ?? '') !== '' && String(f.longitude ?? p.longitude ?? '') !== '') { body.latitude = Number(f.latitude ?? p.latitude); body.longitude = Number(f.longitude ?? p.longitude); }
  if (!Object.keys(body).length) { PR.info = 'Nothing changed.'; return drawPrProfile(); }
  PR.busy = 'save'; PR.err = ''; PR.info = ''; drawPrProfile();
  const r = await pr('PUT', '/api/profile', { body });
  PR.busy = '';
  if (prFail(r)) return;
  if (r.ok && r.json) { PR.profile = r.json; PR.form = {}; PR.info = 'Saved.'; setTimeout(() => { PR.info = ''; drawPrProfile(); }, 3000); } else PR.err = errText(r);
  drawPrProfile(); drawPrEmail();
}
async function prPicture(upload) {
  if (PR.busy) return;
  if (upload) {
    const file = $('#prPicFile') && $('#prPicFile').files[0];
    if (!file) { PR.err = 'Choose a PNG or JPEG picture first.'; return drawPrProfile(); }
    if (!/^image\/(png|jpeg)$/.test(file.type)) { PR.err = 'Only PNG and JPEG pictures are accepted.'; return drawPrProfile(); }
    PR.busy = 'pic'; PR.err = ''; drawPrProfile();
    const r = await pr('PUT', '/api/profile/picture', { raw: { blob: file }, timeout: 60000 });
    PR.busy = '';
    if (prFail(r)) return;
    if (r.ok && r.json) { PR.profile = r.json; PR.picVer = -1; await loadPrPicture(); PR.info = 'Picture saved.'; setTimeout(() => { PR.info = ''; drawPrProfile(); }, 3000); } else PR.err = errText(r);
    drawPrProfile();
  } else {
    const r = await pr('DELETE', '/api/profile/picture');
    if (prFail(r)) return;
    if (r.ok && r.json) { PR.profile = r.json; PR.picUrl = ''; PR.picVer = -1; } else PR.err = errText(r);
    drawPrProfile();
  }
}

/* ---------------------------------------------------------------- email and its code */
function drawPrEmail() {
  const box = $('#prEmail'); if (!box) return;
  const p = PR.profile;
  if (!p) { box.innerHTML = loadingHtml(); return; }
  const state = p.email ? `<b>${esc(p.email)}</b> <span class="tag ${p.emailVerified ? 'good' : 'warn'}">${p.emailVerified ? 'Verified' : 'Not verified'}</span>` : '<span class="muted">No email yet.</span>';
  const pending = p.pendingEmail ? `<div class="callout">Waiting for the code sent to <b>${esc(p.pendingEmail)}</b>. Until it is confirmed, reports and alerts keep going to the verified address.</div>` : '';
  const warn = p.emailDelivers ? '' : '<div class="callout warn"><b>This server is not set up to send email.</b> It only writes emails to its log (<code>agentx.mail.transport: log</code>), so the code will not arrive. Read it in the agentx-api log, or set <code>MAIL_TRANSPORT=smtp</code>.</div>';
  box.innerHTML = `${warn}<div class="row">${state}</div>${pending}
    ${PR.emailErr ? `<div class="err" role="alert">${esc(PR.emailErr)}</div>` : ''}${PR.emailInfo ? `<div class="note" role="status">${esc(PR.emailInfo)}</div>` : ''}
    <div class="grid2"><div class="field"><label for="pre-new">${p.email ? 'Change to' : 'Email address'}</label><input id="pre-new" data-pe="newEmail" type="email" autocomplete="off" value="${esc(PR.newEmail)}"></div>
    <div class="field"><label for="pre-code">6 digit code from the inbox</label><input id="pre-code" data-pe="emailCode" type="text" inputmode="numeric" maxlength="6" autocomplete="off" value="${esc(PR.emailCode)}"></div></div>
    <div class="row"><button type="button" class="btn" data-pr="email-send">Send me a code</button><button type="button" class="btn primary" data-pr="email-verify">Verify</button>${p.email ? '<button type="button" class="btn danger" data-pr="email-remove">Remove the email</button>' : ''}</div>`;
}
async function prEmail(kind) {
  PR.emailErr = ''; PR.emailInfo = '';
  let r;
  if (kind === 'send') {
    const email = PR.newEmail.trim() || (PR.profile && PR.profile.pendingEmail) || '';
    if (!email) { PR.emailErr = 'Type the email address first.'; return drawPrEmail(); }
    r = await pr('POST', '/api/profile/email/request-code', { body: { email } });
    if (prFail(r)) return;
    if (r.ok) { PR.emailInfo = `A code was sent to ${email}.`; await loadPrProfile(); } else PR.emailErr = errText(r);
  } else if (kind === 'verify') {
    if (!/^\d{6}$/.test(PR.emailCode.trim())) { PR.emailErr = 'The code has 6 digits.'; return drawPrEmail(); }
    r = await pr('POST', '/api/profile/email/verify', { body: { code: PR.emailCode.trim() } });
    if (prFail(r)) return;
    if (r.ok && r.json) { PR.profile = r.json; PR.newEmail = ''; PR.emailCode = ''; PR.emailInfo = 'Your email is verified.'; drawPrProfile(); } else PR.emailErr = errText(r);
  } else {
    r = await pr('DELETE', '/api/profile/email');
    if (prFail(r)) return;
    if (r.ok && r.json) { PR.profile = r.json; PR.emailInfo = 'Email removed.'; drawPrProfile(); } else PR.emailErr = errText(r);
  }
  drawPrEmail();
}

    <div class="field"><label for="prr-name">Name (optional)</label><input id="prr-name" data-pr-add="name" type="text" autocomplete="off" value="${esc(PR.recAdd.name)}" placeholder="Accountant"></div></div>

    <div class="row"><button type="button" class="btn" data-pr="rec-paste" ${PR.recBusy ? 'disabled' : ''}>Save the pasted addresses</button></div>
    <div class="row"><input type="file" id="prrFile" accept=".csv,.txt,text/csv,text/plain" aria-label="CSV or text file with email addresses"><button type="button" class="btn" data-pr="rec-upload" ${PR.recBusy ? 'disabled' : ''}>Upload the file</button></div>
    <p class="muted small">Up to 1 MB. One address on each line, or a CSV with the addresses in any column. Names are taken from a column called name when there is one.</p>`;
}
function recSummary(j) {
  const parts = [j.added === 0 ? 'No new addresses were saved.' : `${j.added} saved.`];
  if (j.alreadySaved) parts.push(`${j.alreadySaved} already on the list.`);
  if (j.invalid) parts.push(`${j.invalid} not email addresses${j.invalidSamples && j.invalidSamples.length ? ' (for example ' + j.invalidSamples.slice(0, 3).join(', ') + ')' : ''}.`);
  if (j.limitReached) parts.push('The list is full, so some were left out.');
  return parts.join(' ');
}
async function prRecAct(kind, id) {
  if (PR.recBusy) return;
  PR.recErr = ''; PR.recInfo = ''; PR.recBusy = true; drawPrRec();
  let r;
  if (kind === 'add') {
    if (!PR.recAdd.email.trim()) { PR.recBusy = false; PR.recErr = 'Type an email address first.'; return drawPrRec(); }
    r = await pr('POST', '/api/email/recipients', { body: { email: PR.recAdd.email.trim(), name: PR.recAdd.name.trim() } });
    if (r.ok) PR.recAdd = { email: '', name: '' };
  } else if (kind === 'paste') {
    r = await pr('POST', '/api/email/recipients/paste', { body: { text: PR.recPaste } });
    if (r.ok && r.json) { PR.recInfo = recSummary(r.json); PR.recPaste = ''; }
  } else if (kind === 'upload') {
    const file = $('#prrFile') && $('#prrFile').files[0];
    if (!file) { PR.recBusy = false; PR.recErr = 'Choose a file first.'; return drawPrRec(); }
    const fd = new FormData(); fd.append('file', file, file.name);
    r = await pr('POST', '/api/email/recipients/import', { form: fd, timeout: 60000 });
    if (r.ok && r.json) PR.recInfo = recSummary(r.json);
  } else {
    r = await pr('DELETE', '/api/email/recipients/' + encodeURIComponent(id));
  }
  PR.recBusy = false;
  if (prFail(r)) return;
  if (!r.ok) PR.recErr = errText(r);
  await loadPrRec();
}

/* ---------------------------------------------------------------- email a report */
function drawPrRep() {
  const box = $('#prRep'); if (!box) return;
  const s = PR.rep, p = PR.profile;
  const opt = (v, t, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`;
  box.innerHTML = `<p class="muted small">Makes the file on the server and emails it. With <b>To</b> empty it goes to your own verified email${p && p.email ? ` (<span class="mono">${esc(p.email)}</span>${p.emailVerified ? '' : ', not verified yet'})` : ''}. Separate several addresses, or saved names, with commas.</p>
    <div class="grid2"><div class="field"><label for="prp-source">What to send</label><select id="prp-source" data-rp="source">${opt('BUSINESS_REQUESTS', 'Business requests', s.source)}${opt('BUSINESS_ACCOUNTS', 'Business accounts (no secrets)', s.source)}${opt('PAYMENTS', 'Payments', s.source)}</select></div>
    <div class="field"><label for="prp-format">File type</label><select id="prp-format" data-rp="format">${opt('pdf', 'PDF', s.format)}${opt('csv', 'CSV', s.format)}${opt('xlsx', 'Excel (xlsx)', s.format)}</select></div></div>
    <div class="grid2"><div class="field"><label for="prp-to">To</label><input id="prp-to" data-rp="to" type="text" autocomplete="off" value="${esc(s.to)}" placeholder="empty means my email"></div>
    <div class="field"><label for="prp-status">Only this status (optional)</label><input id="prp-status" data-rp="status" type="text" autocomplete="off" value="${esc(s.status)}" placeholder="SUCCEEDED"></div></div>
    <div class="field"><label for="prp-msg">Note in the email (optional)</label><input id="prp-msg" data-rp="message" type="text" autocomplete="off" value="${esc(s.message)}"></div>
    ${s.err ? `<div class="err" role="alert">${esc(s.err)}</div>` : ''}${s.ok ? `<div class="note" role="status">${esc(s.ok)}</div>` : ''}
    <div class="row"><button type="button" class="btn primary" data-pr="rep-send" ${s.busy ? 'disabled' : ''}>${s.busy ? 'Sending' : 'Email the report'}</button></div>`;
}
async function prReport() {
  const s = PR.rep; if (s.busy) return;
  s.busy = true; s.err = ''; s.ok = ''; drawPrRep();
  const to = s.to.split(/[,;\n]+/).map((x) => x.trim()).filter(Boolean);
  const body = { source: s.source, format: s.format, title: 'Report from the console', toMe: !to.length };
  if (to.length) body.to = to;
  if (s.status.trim()) body.status = s.status.trim();
  if (s.message.trim()) body.message = s.message.trim();
  const r = await pr('POST', '/api/email/report', { body, timeout: 60000 });
  s.busy = false;
  if (prFail(r)) return;
  if (!r.ok) s.err = errText(r);
  else if (r.json && r.json.delivered === false) s.err = `The file ${r.json.fileName} was made for ${(r.json.sentTo || []).join(', ')}, but nothing was emailed: this server only writes email to its log.`;
  else if (r.json) s.ok = `Sent ${r.json.fileName} (${r.json.rows} row${r.json.rows === 1 ? '' : 's'}) to ${(r.json.sentTo || []).join(', ')}.`;
  drawPrRep(); loadPrLog();
}

/* ---------------------------------------------------------------- the emails that were sent */
async function loadPrLog() {
  const r = await pr('GET', '/api/email/log', { silent: true });
  if (prFail(r)) return;
  if (r.ok && Array.isArray(r.json)) { PR.log = r.json; PR.logLoaded = true; }
  drawPrLog();
}
const LOG_TONE = { SENT: 'good', FAILED: 'bad', LOGGED: 'warn' };
function drawPrLog() {
  const box = $('#prLog'); if (!box) return;
  box.innerHTML = PR.log.length
    ? `<div style="overflow-x:auto"><table><thead><tr><th>When</th><th>What</th><th>To</th><th>Result</th></tr></thead><tbody>${PR.log.map((l) => `<tr><td>${esc(bzWhen(l.at))}</td><td><b>${esc(l.kind)}</b><br><span class="muted small">${esc(l.subject || '')}${l.attachment ? ' &middot; ' + esc(l.attachment) : ''}</span></td><td class="mono small">${esc(l.recipients || '')}</td><td><span class="tag ${LOG_TONE[l.status] || ''}">${esc(l.status)}</span>${l.error ? `<br><span class="muted small">${esc(l.error)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div><p class="muted small">LOGGED means the server only wrote the email to its log and did not send it.</p>`
    : `<div class="empty">${PR.logLoaded ? 'No emails yet.' : waitHtml()}</div>`;
}

/* ---------------------------------------------------------------- events */
function onProfClick(e) {
  const b = e.target.closest('[data-pr]'); if (!b) return;
  switch (b.dataset.pr) {
    case 'refresh': loadPrProfile(); break;
    case 'save': prSave(); break;
    case 'pic-upload': prPicture(true); break;
    case 'pic-remove': prPicture(false); break;
    case 'use-location':
      if (!navigator.geolocation) { PR.err = 'This browser cannot share a location.'; drawPrProfile(); break; }
      navigator.geolocation.getCurrentPosition((pos) => { PR.form = PR.form || {}; PR.form.latitude = pos.coords.latitude.toFixed(6); PR.form.longitude = pos.coords.longitude.toFixed(6); delete PR.form.clearLocation; PR.err = ''; PR.info = 'Location added. Press Save changes to keep it.'; drawPrProfile(); },
        () => { PR.err = 'The location was not shared.'; drawPrProfile(); }, { timeout: 10000 });
      break;
    case 'clear-location': PR.form = PR.form || {}; PR.form.clearLocation = true; PR.form.latitude = ''; PR.form.longitude = ''; PR.info = 'The location will be removed when you press Save changes.'; drawPrProfile(); break;
    case 'email-send': prEmail('send'); break;
    case 'email-verify': prEmail('verify'); break;
    case 'email-remove': prEmail('remove'); break;
    case 'rec-refresh': loadPrRec(); break;
    case 'rec-add': prRecAct('add'); break;
    case 'rec-paste': prRecAct('paste'); break;
    case 'rec-upload': prRecAct('upload'); break;
    case 'rec-del': prRecAct('del', b.dataset.id); break;
    case 'rep-send': prReport(); break;
    case 'log-refresh': loadPrLog(); break;
    case 'su-request': prSignupRequest(); break;
    case 'su-verify': prSignupVerify(); break;
    case 'su-change': PR.su.sent = false; PR.su.code = ''; PR.su.info = ''; PR.su.err = ''; drawPrSign(); break;
    default: break;
  }
}
function onProfInput(e) {
  const t = e.target; if (!t || !t.dataset) return;
  if ('pf' in t.dataset) { PR.form = PR.form || {}; PR.form[t.dataset.pf] = t.type === 'checkbox' ? t.checked : t.value; }
  else if ('pe' in t.dataset) PR[t.dataset.pe] = t.value;
  else if ('prAdd' in t.dataset) PR.recAdd[t.dataset.prAdd] = t.value;
  else if ('prPaste' in t.dataset) PR.recPaste = t.value;
  else if ('rp' in t.dataset) PR.rep[t.dataset.rp] = t.value;
  else if ('su' in t.dataset) PR.su[t.dataset.su] = t.value;
}
onShow.prof = () => { renderProf(); if (signedIn()) { loadPrProfile(); loadPrRec(); loadPrLog(); } };

/* ------------------------------------------------------------------ command palette */
const CMD = { items: [], shown: [], sel: 0 };
function cmdItems() {
  const items = [];
  VIEWS.forEach((v) => items.push({ k: 'Go to', t: v.title, run: () => show(v.id) }));
  items.push({ k: 'Do', t: 'Run the journey', run: () => { show('route'); setTimeout(runRoute, 60); } });
  items.push({ k: 'Do', t: 'Check the services again', run: checkServices });
  items.push({ k: 'Do', t: 'Open settings', run: openSettings });
  items.push({ k: 'Do', t: 'Show or hide the request log', run: () => setDock($('#logList').hidden) });
  THEMES.forEach((t) => items.push({ k: 'Theme', t: t.name, run: () => setTheme(t.id) }));
  CATALOG.forEach((e) => items.push({ k: e.method, t: `${e.name}  ${e.path}`, run: () => { EX.sel = e.id; EX.q = ''; EX.svc = 'all'; const b = $('#v-api'); delete b.dataset.built; b.innerHTML = ''; show('api'); } }));
  return items;
}
function drawCmd() {
  const q = $('#cmdIn').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  CMD.shown = CMD.items.filter((i) => words.every((w) => (i.k + ' ' + i.t).toLowerCase().includes(w))).slice(0, 40);
  CMD.sel = Math.min(CMD.sel, Math.max(0, CMD.shown.length - 1));
  $('#cmdList').innerHTML = CMD.shown.length ? CMD.shown.map((i, n) => `<button type="button" class="cmd-item" role="option" data-n="${n}" aria-selected="${n === CMD.sel}"><span class="tag ${['GET', 'POST', 'DELETE'].includes(i.k) ? 'method ' + i.k.toLowerCase() : ''}" style="min-width:56px;justify-content:center">${esc(i.k)}</span><span>${esc(i.t)}</span></button>`).join('') : '<div class="empty">Nothing matches.</div>';
  const cur = $('#cmdList [aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function openCmd() {
  CMD.items = cmdItems(); CMD.sel = 0; $('#cmdIn').value = '';
  if (!$('#dlgCmd').open) $('#dlgCmd').showModal();
  drawCmd(); $('#cmdIn').focus();
}
function runCmd(n) { const it = CMD.shown[n]; if (!it) return; $('#dlgCmd').close(); it.run(); }
$('#cmdIn').addEventListener('input', () => { CMD.sel = 0; drawCmd(); });
$('#cmdIn').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); CMD.sel = Math.min(CMD.sel + 1, CMD.shown.length - 1); drawCmd(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CMD.sel = Math.max(CMD.sel - 1, 0); drawCmd(); }
  else if (e.key === 'Enter') { e.preventDefault(); runCmd(CMD.sel); }
});
$('#cmdList').addEventListener('click', (e) => { const b = e.target.closest('.cmd-item'); if (b) runCmd(Number(b.dataset.n)); });
$('#openCmd').addEventListener('click', openCmd);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if ($('#dlgCmd').open) $('#dlgCmd').close(); else openCmd(); }
});

/* ------------------------------------------------------------------ start */
initThemes();
initNav();
renderPills();
drawRoute();
const startView = (location.hash || '').slice(1) || store.get('view') || 'route';
show(startView);
checkServices();
setInterval(() => { if (!document.hidden) checkServices(); }, 45000);
applyLogo();
})();
</script>

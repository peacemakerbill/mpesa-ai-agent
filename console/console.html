<!doctype html>
<html lang="en" data-theme="daylight">
<head>

<style>
/* =====================================================================
   Ten themes. They share one structure and differ in material.
   daylight  light, cool grey, cobalt accent
   graphite  dark, neutral grey, amber accent
   pwani     light, coastal teal header
   mono      print black on white, hard rules, serif headings
   matatu    street yellow, black rules, red accent
   kahawa    espresso brown, teal accent, serif headings
   blueprint drafting navy with a grid, cyan accent
   ===================================================================== */
:root {
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-head: var(--font);
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --head-weight: 650; --head-track: -0.012em;
  --radius: 8px; --radius-sm: 6px;
  --bw: 1px;
  --m-get: #1b7f55; --m-post: #3a5fcf; --m-delete: #c62d3b;
  --accent-2: var(--accent); --tab-line: var(--accent);
}
[data-theme="daylight"] {
  --bg: #f5f6fa; --surface: #ffffff; --surface-2: #eef1f6; --surface-3: #e6e9ef;
  --line: #e3e6ed; --line-strong: #cbd1dc;
  --ink: #0f1419; --ink-2: #444d5c; --ink-3: #5b6676;
  --accent: #2457d6; --accent-ink: #ffffff; --accent-soft: #e9effd; --accent-line: #bfcff5;
  --good: #137a4a; --warn: #9a5d00; --bad: #c42b3a; --info: #2457d6;
  --head-bg: #ffffff; --head-ink: #0f1419; --head-line: #e3e6ed;
  --code-bg: #f7f8fa; --lane: #d4d9e2;
  --elev: 0 1px 2px rgba(17, 21, 27, .05);
  --pop: 0 12px 32px -8px rgba(17, 21, 27, .25), 0 0 0 1px rgba(17, 21, 27, .06);
}
[data-theme="graphite"] {
  --bg: #0e1013; --surface: #16191e; --surface-2: #1e2229; --surface-3: #232830;
  --line: #272c35; --line-strong: #3b424e;
  --ink: #eceef2; --ink-2: #a6aebb; --ink-3: #8790a0;
  --accent: #f0a63a; --accent-ink: #1b1304; --accent-soft: #2b2213; --accent-line: #5a4318;
  --good: #52c68f; --warn: #f0a63a; --bad: #f07272; --info: #78aaff;
  --head-bg: #12151a; --head-ink: #eceef2; --head-line: #272c35;
  --code-bg: #0f1216; --lane: #2a303a;
  --elev: none;
  --pop: 0 16px 40px -8px rgba(0, 0, 0, .7), 0 0 0 1px #343b46;
  --m-get: #52c68f; --m-post: #78aaff; --m-delete: #f07272;
  --font-head: var(--font);
}
[data-theme="pwani"] {
  --bg: #edf3f3; --surface: #ffffff; --surface-2: #e4eded; --surface-3: #d6e4e5;
  --line: #d3e0e0; --line-strong: #aec6c7;
  --ink: #0f2b33; --ink-2: #3b5961; --ink-3: #567078;
  --accent: #0a7480; --accent-ink: #ffffff; --accent-soft: #d9eef0; --accent-line: #8fc6cc; --accent-2: #c2571a;
  --good: #0b6b4b; --warn: #8a4b1f; --bad: #b3261e; --info: #1c5da6;
  --head-bg: #0a5c66; --head-ink: #ffffff; --head-line: #0a5c66; --tab-line: #ffffff;
  --code-bg: #f5f9f9; --lane: #bdd3d4;
  --radius: 10px; --radius-sm: 7px;
  --elev: 0 1px 2px rgba(15, 43, 51, .06);
  --pop: 0 12px 32px -8px rgba(15, 43, 51, .3), 0 0 0 1px rgba(15, 43, 51, .08);
  --font: "Avenir Next", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-head: var(--font);
}
[data-theme="mono"] {
  --font: "Helvetica Neue", Helvetica, "Inter", Arial, sans-serif;
  --font-head: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --head-weight: 700; --head-track: -0.005em;
  --radius: 0; --radius-sm: 0; --bw: 1px;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f3f3f3; --surface-3: #e8e8e8;
  --line: #111111; --line-strong: #111111;
  --ink: #000000; --ink-2: #2e2e2e; --ink-3: #5c5c5c;
  --accent: #000000; --accent-ink: #ffffff; --accent-soft: #ececec; --accent-line: #000000;
  --good: #0a6a2c; --warn: #8a5300; --bad: #b00020; --info: #0b3fa8;
  --head-bg: #ffffff; --head-ink: #000000; --head-line: #000000;
  --code-bg: #f7f7f7; --lane: #9a9a9a;
  --elev: none;
  --pop: 6px 6px 0 #000, 0 0 0 1px #000;
  --m-get: #0a6a2c; --m-post: #0b3fa8; --m-delete: #b00020;
}

[data-theme="savanna"] {
  --bg: #f6f8f5; --surface: #ffffff; --surface-2: #edf2ee; --surface-3: #dfe8e1;
  --line: #dce5de; --line-strong: #b9c9be;
  --ink: #10201a; --ink-2: #3f5348; --ink-3: #586c60;
  --accent: #087f36; --accent-ink: #ffffff; --accent-soft: #e1f3e7; --accent-line: #9fd3b1; --accent-2: #d6001c;
  --good: #087f36; --warn: #8f5b00; --bad: #c8102e; --info: #1c5da6;
  --head-bg: #087f36; --head-ink: #ffffff; --head-line: #087f36; --tab-line: #ffffff;
  --code-bg: #f8faf7; --lane: #c9d8cd;
  --radius: 14px; --radius-sm: 9px;
  --elev: 0 1px 2px rgba(16, 32, 26, .06);
  --pop: 0 14px 34px -8px rgba(16, 32, 26, .3), 0 0 0 1px rgba(16, 32, 26, .08);
}
[data-theme="lipa"] {
  --bg: #f4f4f5; --surface: #ffffff; --surface-2: #eeeef0; --surface-3: #e2e2e6;
  --line: #e2e2e5; --line-strong: #c8c8ce;
  --ink: #17171a; --ink-2: #4f4f57; --ink-3: #676770;
  --accent: #c8001a; --accent-ink: #ffffff; --accent-soft: #fbe6e9; --accent-line: #f0a8b1; --accent-2: #0a7a3b;
  --good: #0a7a3b; --warn: #8f5b00; --bad: #c8001a; --info: #1c5da6;
  --head-bg: #ffffff; --head-ink: #17171a; --head-line: #c8001a;
  --code-bg: #f8f8f9; --lane: #d4d4da;
  --radius: 10px; --radius-sm: 7px;
  --elev: 0 1px 2px rgba(23, 23, 26, .06);
  --pop: 0 12px 32px -8px rgba(23, 23, 26, .3), 0 0 0 1px rgba(23, 23, 26, .07);
}
[data-theme="lipa"] .bar { border-bottom-width: 3px; }
[data-theme="matatu"] {
  --font: "Trebuchet MS", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-head: "Arial Black", "Helvetica Neue", Impact, sans-serif; --head-weight: 900; --head-track: -0.01em;
  --radius: 4px; --radius-sm: 3px;
  --bg: #ffd400; --surface: #ffffff; --surface-2: #fff3b0; --surface-3: #ffe680;
  --line: #111111; --line-strong: #111111;
  --ink: #111111; --ink-2: #2b2b2b; --ink-3: #4a4400;
  --accent: #d4002a; --accent-ink: #ffffff; --accent-soft: #ffe7a1; --accent-line: #111111; --accent-2: #111111;
  --good: #0a6b2f; --warn: #7a4a00; --bad: #b00020; --info: #0b3fa8;
  --head-bg: #111111; --head-ink: #ffd400; --head-line: #111111; --tab-line: #d4002a;
  --code-bg: #fffbe0; --lane: #111111;
  --elev: 3px 3px 0 #111111;
  --pop: 6px 6px 0 #111111, 0 0 0 2px #111111;
  --m-get: #0a6b2f; --m-post: #0b3fa8; --m-delete: #b00020;
}
[data-theme="matatu"] .panel, [data-theme="matatu"] .ph, [data-theme="matatu"] .bar { border-width: 2px; }
[data-theme="matatu"] .bar { border-bottom-color: #d4002a; border-bottom-width: 4px; }
[data-theme="matatu"] .btn { border-width: 2px; border-color: #111111; font-weight: 700; }
[data-theme="matatu"] .bar .dot.up { background: #ffd400; }
[data-theme="matatu"] .bar .dot.down { background: #ff6b6b; }
[data-theme="kahawa"] {
  --bg: #1b1410; --surface: #251c16; --surface-2: #2e231c; --surface-3: #3a2d24;
  --line: #3a2d24; --line-strong: #5a4636;
  --ink: #f3e9dc; --ink-2: #cdbba6; --ink-3: #a8927b;
  --accent: #6cc4b5; --accent-ink: #0d1f1c; --accent-soft: #17302c; --accent-line: #2f6b62; --accent-2: #e6b450;
  --good: #86d0a0; --warn: #e6b450; --bad: #f08a7c; --info: #8fb8e8;
  --head-bg: #140e0b; --head-ink: #f3e9dc; --head-line: #3a2d24;
  --code-bg: #170f0b; --lane: #4a3a2e;
  --radius: 10px; --radius-sm: 7px;
  --elev: none;
  --pop: 0 16px 40px -8px rgba(0, 0, 0, .7), 0 0 0 1px #5a4636;
  --m-get: #86d0a0; --m-post: #8fb8e8; --m-delete: #f08a7c;
  --font-head: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --head-weight: 600; --head-track: 0;
}
[data-theme="kahawa"] { color-scheme: dark; }
[data-theme="blueprint"] {
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; --head-weight: 600; --head-track: 0;
  --radius: 2px; --radius-sm: 2px;
  --bg: #0e2a47; --surface: #123354; --surface-2: #173c63; --surface-3: #1d4875;
  --line: #2d5b8c; --line-strong: #4a7db3;
  --ink: #e8f1fb; --ink-2: #b4cde6; --ink-3: #93b3d4;
  --accent: #7fd6ff; --accent-ink: #06223a; --accent-soft: #16436e; --accent-line: #3d7db3; --accent-2: #ffd24a;
  --good: #7be0a8; --warn: #ffd24a; --bad: #ff8f8f; --info: #7fd6ff;
  --head-bg: #0a2037; --head-ink: #e8f1fb; --head-line: #2d5b8c;
  --code-bg: #0b2540; --lane: #3a6a9c;
  --elev: none;
  --pop: 0 16px 40px -8px rgba(0, 0, 0, .6), 0 0 0 1px #4a7db3;
  --m-get: #7be0a8; --m-post: #7fd6ff; --m-delete: #ff8f8f;
}
[data-theme="blueprint"] { color-scheme: dark; }
[data-theme="blueprint"] body, [data-theme="blueprint"] .app { background-image: linear-gradient(rgba(127, 214, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(127, 214, 255, .06) 1px, transparent 1px); background-size: 24px 24px; }
[data-theme="receipt"] {
  --font: "Courier New", "Courier Prime", "Liberation Mono", ui-monospace, monospace;
  --font-head: var(--font); --head-weight: 700; --head-track: 0;
  --radius: 0; --radius-sm: 0;
  --bg: #ecebe6; --surface: #fbfbf8; --surface-2: #f1f0eb; --surface-3: #e4e3dc;
  --line: #b5b4ae; --line-strong: #6b6a65;
  --ink: #1d1d1b; --ink-2: #45453f; --ink-3: #62625c;
  --accent: #0b6b2e; --accent-ink: #ffffff; --accent-soft: #e4eee2; --accent-line: #9dbe9a; --accent-2: #b3001b;
  --good: #0b6b2e; --warn: #8a5300; --bad: #b3001b; --info: #0b3fa8;
  --head-bg: #fbfbf8; --head-ink: #1d1d1b; --head-line: #1d1d1b; --tab-line: #1d1d1b;
  --code-bg: #f6f5f0; --lane: #8d8c86;
  --elev: none;
  --pop: 5px 5px 0 #1d1d1b, 0 0 0 1px #1d1d1b;
  --m-get: #0b6b2e; --m-post: #0b3fa8; --m-delete: #b3001b;
}
[data-theme="receipt"] .panel, [data-theme="receipt"] .ph, [data-theme="receipt"] .bar { border-style: dashed; }
[data-theme="receipt"] .panel { border-color: var(--line-strong); }
[data-theme="receipt"] .ph, [data-theme="receipt"] th, [data-theme="receipt"] td, [data-theme="receipt"] .logrow { border-bottom-style: dashed; }
[data-theme="receipt"] .btn.primary { border-style: solid; }
[data-theme="receipt"] body, [data-theme="receipt"] .app { background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(0, 0, 0, .025) 27px 28px); }

/* ===================================================================== base */
* { box-sizing: border-box; }
html { color-scheme: light; }
[data-theme="graphite"] { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-head); font-weight: var(--head-weight); letter-spacing: var(--head-track); line-height: 1.2; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.05rem; } h3 { font-size: .95rem; }
p { margin: 0; }
a { color: var(--accent); }
code, pre, kbd, .mono { font-family: var(--font-mono); font-size: .85em; }
kbd { border: var(--bw) solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); font-size: .78rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-theme="mono"] :focus-visible { outline: 3px solid #000; outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.small { font-size: .82rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: grid; gap: 14px; }
.stack.tight { gap: 8px; }
[hidden] { display: none !important; }

/* ===================================================================== app shell */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 20px; height: 52px; background: var(--head-bg); color: var(--head-ink); border-bottom: var(--bw) solid var(--head-line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: var(--head-weight); letter-spacing: var(--head-track); font-size: 1rem; white-space: nowrap; }
.tabs-nav { display: flex; height: 100%; gap: 2px; margin-left: 10px; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: none; border: 0; cursor: pointer; color: inherit; opacity: .68; font-weight: 550; }
.tab svg { width: 17px; height: 17px; }
.tab:hover { opacity: 1; }
.tab[aria-current="page"] { opacity: 1; }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; background: var(--tab-line); }
[data-theme="mono"] .tab[aria-current="page"]::after { height: 3px; }
.bar .sp { flex: 1; }
.chips { display: flex; gap: 6px; }
.svc-chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 999px; border: var(--bw) solid color-mix(in srgb, currentColor 22%, transparent); background: transparent; color: inherit; cursor: pointer; font-size: .8rem; }
.env-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; border: var(--bw) solid currentColor; font-size: .8rem; font-weight: 600; opacity: .8; }
.env-chip.env-staging { color: #b54708; opacity: 1; background: color-mix(in srgb, #b54708 10%, transparent); }
.env-chip.env-production { color: #b42318; opacity: 1; background: color-mix(in srgb, #b42318 10%, transparent); }
[data-theme="mono"] .env-chip { border-radius: 0; color: #000; }
.svc-chip:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
[data-theme="mono"] .svc-chip { border-radius: 0; border-color: #000; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; display: inline-block; }
.dot.up { background: var(--good); } .dot.blocked { background: var(--warn); } .dot.down { background: var(--bad); }
[data-theme="pwani"] .bar .dot.up { background: #9ff0d0; }
[data-theme="pwani"] .bar .dot.down { background: #ffd0c8; }
[data-theme="savanna"] .bar .dot.up { background: #d4ffe2; }
[data-theme="savanna"] .bar .dot.down { background: #ffd0d6; }
[data-theme="mono"] .dot { border-radius: 0; }
[data-theme="mono"] .dot.up { background: #000; } [data-theme="mono"] .dot.down { background: #fff; box-shadow: inset 0 0 0 2px #000; }
.icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm); border: var(--bw) solid transparent; background: none; color: inherit; cursor: pointer; opacity: .8; }
.icon-btn:hover { opacity: 1; background: color-mix(in srgb, currentColor 10%, transparent); }
.icon-btn svg { width: 18px; height: 18px; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--radius-sm); border: var(--bw) solid color-mix(in srgb, currentColor 22%, transparent); font-size: .85rem; }
.menu summary::-webkit-details-marker { display: none; }
.menu summary:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
.menu[open] summary { background: color-mix(in srgb, currentColor 10%, transparent); }
.menu .pop { position: absolute; right: 0; top: 40px; width: 280px; max-height: calc(100vh - 80px); overflow: auto; background: var(--surface); color: var(--ink); border-radius: var(--radius); box-shadow: var(--pop); border: var(--bw) solid var(--line); padding: 6px; z-index: 50; }
.theme-group { padding: 10px 8px 4px; font-size: .74rem; font-weight: 650; color: var(--ink-3); }
.theme-opt { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px; background: none; border: var(--bw) solid transparent; border-radius: var(--radius-sm); cursor: pointer; color: inherit; }
.theme-opt:hover { background: var(--surface-2); }
.theme-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.theme-opt .name { font-weight: 600; } .theme-opt .desc { font-size: .78rem; color: var(--ink-2); }
.swatch { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 44px; height: 30px; border-radius: 5px; overflow: hidden; border: var(--bw) solid rgba(0, 0, 0, .25); }
[data-theme="mono"] .swatch { border-radius: 0; }
.swatch i { display: block; }

main { flex: 1; min-width: 0; }
.view { padding: 22px 24px 28px; max-width: 1360px; margin: 0 auto; width: 100%; display: grid; gap: 18px; align-content: start; }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.view-head p { color: var(--ink-2); max-width: 62ch; margin-top: 4px; }

/* ===================================================================== parts */
.panel { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--elev); min-width: 0; }
[data-theme="mono"] .panel { box-shadow: none; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 16px; border-bottom: var(--bw) solid var(--line); min-height: 46px; flex-wrap: wrap; }
.pb { padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: var(--radius-sm); border: var(--bw) solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 550; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn:active { background: var(--surface-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }

}

table { width: 100%; border-collapse: collapse; }

/* ===================================================================== journey (request trace) */

  background-image: linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane)), linear-gradient(var(--lane), var(--lane));
  background-repeat: no-repeat; background-size: 1px 100%;
  background-position: 10% 0, 30% 0, 50% 0, 70% 0, 90% 0; }
.ev { width: 100%; padding: 0; background: none; border: 0; text-align: left; color: inherit; cursor: pointer; display: grid; }

.ev-self .ev-pill { display: inline-block; padding: 4px 9px; border-radius: 999px; border: var(--bw) solid var(--line-strong); background: var(--surface); font-size: .76rem; max-width: 100%; }

.trace-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-3); padding: 0 40px; }
.outcome { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===================================================================== chat */

.pinmark { display: inline-grid; flex: none; color: var(--accent); }

.chat-acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }

@media (hover: none) { .chat-acts { opacity: 1; } }
.chat-edit { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px; margin: 0; }
.chat-edit input { flex: 1; min-width: 120px; }
.chat-find { margin-bottom: 8px; }
.chat-find input { width: 100%; }
/* composer: attach menu, tray, recorder, media bubbles */
.chat { position: relative; }
.composer { gap: 8px; position: relative; }
.bar2 { display: flex; align-items: flex-end; gap: 8px; }
.bar2 textarea { flex: 1; min-width: 0; resize: none; max-height: 140px; min-height: 38px; padding: 9px 14px; border: var(--bw) solid var(--line-strong); border-radius: 19px; background: var(--surface-2); color: var(--ink); font: inherit; line-height: 1.35; }
.bar2 textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }

.round { width: 38px; height: 38px; flex: none; border-radius: 50%; border: var(--bw) solid var(--line-strong); background: var(--surface); color: var(--ink-2); display: inline-grid; place-items: center; cursor: pointer; padding: 0; transition: background .12s, color .12s, transform .12s; }
.round svg { width: 19px; height: 19px; }

.attach-wrap { position: relative; }
.attach-pop { position: absolute; left: 0; bottom: 46px; width: min(290px, calc(100vw - 52px)); background: var(--surface); border: var(--bw) solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--pop); padding: 6px; z-index: 20; display: grid; gap: 1px; max-height: min(480px, 72vh); overflow: auto; }

.ic { display: inline-grid; place-items: center; flex: none; }

.ic.c0 { background: #5d6675; } .ic.c1 { background: #1f7a4d; } .ic.c2 { background: #a1253a; } .ic.c3 { background: #7a3fb0; }
.ic.c4 { background: #b35a00; } .ic.c5 { background: #2457d6; } .ic.c6 { background: #00758f; } .ic.c7 { background: #8a6a00; }
.tray { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }

.tray-item { display: flex; align-items: center; gap: 9px; padding: 5px 6px 5px 5px; border: var(--bw) solid var(--line-strong); border-radius: var(--radius); background: var(--surface-2); flex: none; max-width: 260px; }
.tray-item .thumb { width: 44px; height: 44px; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-3); display: grid; place-items: center; color: var(--ink-2); }

#recWave { width: 120px; max-width: 30vw; height: 32px; flex: none; }
.grow { flex: 1; min-width: 0; }
.dropveil { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 2px dashed var(--accent); border-radius: inherit; font-weight: 650; color: var(--accent); pointer-events: none; }

.bubble .m-img { display: block; max-width: 100%; width: 260px; max-height: 260px; object-fit: cover; border-radius: 8px; background: #000; }

.bubble:not(.me) .m-doc .ic, .bubble:not(.me) .m-card .ic, .bubble:not(.me) .m-audio .ic { background: var(--surface-3); }

/* camera */

dialog.small-dlg { width: min(420px, calc(100vw - 20px)); }
.form-grid.one { grid-template-columns: 1fr; }
.brand .logo { width: 24px; height: 24px; border-radius: 6px; object-fit: contain; flex: none; }

.req-item { display: grid; gap: 6px; padding: 12px 0; border-bottom: var(--bw) solid var(--line); }

/* ===================================================================== phone (mirrors the Flutter app, same four themes) */

.screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; position: relative; }
[data-theme="mono"] .screen { border-radius: 4px; }
.statusbar { display: flex; justify-content: space-between; padding: 12px 22px 4px; font-size: .72rem; font-weight: 600; color: var(--ink-2); }
.screen .appbar { display: flex; align-items: center; gap: 8px; padding: 6px 14px 10px; }
.screen .appbar h3 { font-size: 1.35rem; flex: 1; }
.screen .appbar button { background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 6px 8px; border-radius: 8px; font-size: .85rem; font-weight: 600; }
.screen .appbar button:hover { background: var(--surface-2); }
.screen .body { flex: 1; overflow: auto; padding: 4px 16px 20px; display: grid; gap: 14px; align-content: start; }
.screen label { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.screen input { width: 100%; height: 42px; padding: 0 12px; border: var(--bw) solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); }
[data-theme="mono"] .screen input { border-radius: 0; }
.screen .note { color: var(--ink-2); font-size: .86rem; }
.screen .err { color: var(--bad); font-size: .86rem; }
.screen .li { display: grid; gap: 2px; width: 100%; text-align: left; padding: 13px 14px; background: var(--surface); border: var(--bw) solid var(--line); border-radius: 12px; cursor: pointer; color: inherit; }
[data-theme="mono"] .screen .li { border-radius: 0; border-color: #000; }
.screen .li:hover { border-color: var(--accent); }
.screen .li b { font-weight: 600; } .screen .li small { color: var(--ink-2); }
.screen .sbtn { height: 46px; border-radius: 12px; border: var(--bw) solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 650; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.screen .sbtn.alt { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.screen .sbtn.out { background: transparent; color: var(--ink); border-color: var(--line-strong); }
[data-theme="mono"] .screen .sbtn { border-radius: 0; border-color: #000; }
.screen .sbtn:disabled { opacity: .5; }
.hero-amt { display: grid; gap: 2px; padding: 6px 0 2px; }
.hero-amt .kes { font-size: .85rem; color: var(--ink-2); font-weight: 600; }
.hero-amt .amt { font-family: var(--font-head); font-size: 2.6rem; font-weight: var(--head-weight); letter-spacing: -0.03em; line-height: 1; }
.hero-amt .sum { color: var(--ink-2); font-size: .9rem; margin-top: 4px; }
.timeline { display: grid; gap: 0; padding: 4px 0; }
.tl { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 8px; top: 16px; bottom: -2px; width: 2px; background: var(--line-strong); }
.tl:last-child::before { display: none; }
.tl i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--bg); position: relative; z-index: 1; }
.tl.done i { background: var(--accent); border-color: var(--accent); }
.tl.now i { border-color: var(--accent-2); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl.bad i { background: var(--bad); border-color: var(--bad); }
.tl.done::before { background: var(--accent); }
.tl span { font-size: .88rem; } .tl small { display: block; color: var(--ink-3); }
.tl.todo span { color: var(--ink-3); }
[data-theme="mono"] .tl i { border-radius: 0; }
.kv { display: grid; gap: 0; border: var(--bw) solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
[data-theme="mono"] .kv { border-radius: 0; border-color: #000; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-bottom: var(--bw) solid var(--line); font-size: .85rem; }
.kv div:last-child { border-bottom: 0; } .kv span { color: var(--ink-2); } .kv b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.proof { padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); border: var(--bw) solid var(--accent-line); font-size: .84rem; }
[data-theme="mono"] .proof { border-radius: 0; }
.warnbox { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: var(--bw) solid color-mix(in srgb, var(--warn) 40%, var(--line)); font-size: .84rem; }
.sheet { position: absolute; inset: auto 0 0 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px 18px; box-shadow: 0 -14px 36px rgba(0, 0, 0, .28); display: grid; gap: 12px; z-index: 5; max-height: 86%; overflow: auto; }
[data-theme="mono"] .sheet { border-radius: 0; border-top: 3px solid #000; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); z-index: 4; }
.finger { width: 88px; height: 88px; border-radius: 50%; margin: 6px auto; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border: var(--bw) solid var(--accent-line); cursor: pointer; }
.finger svg { width: 44px; height: 44px; }
.finger.scanning { animation: scan 1s ease-out; }
@keyframes scan { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: 0 0 0 26px transparent; } }
[data-theme="mono"] .finger { border-radius: 0; }
.ussd { background: #17181b; color: #ececef; border-radius: 12px; padding: 14px; font-family: var(--font-mono); font-size: .82rem; display: grid; gap: 9px; }
.ussd .pin { background: #26282d; border-radius: 8px; padding: 8px 10px; color: #c9cbd2; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.step i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: #34363c; display: grid; place-items: center; font-size: .7rem; }
.step .copy { background: #34363c; color: #ececef; border: 0; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: .74rem; }
.sms { background: var(--surface); border: var(--bw) solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .84rem; }

/* ===================================================================== explorer */
.ex { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.ex-list { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 130px); position: sticky; top: 70px; overflow: hidden; }
.ex-filter { padding: 12px; display: grid; gap: 9px; border-bottom: var(--bw) solid var(--line); }
.seg { display: flex; gap: 5px; flex-wrap: wrap; }
.ex-items { overflow: auto; padding: 6px; }
.ex-group { padding: 12px 8px 4px; font-weight: 650; font-size: .78rem; color: var(--ink-3); }
.ex-item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: transparent; border: var(--bw) solid transparent; color: inherit; cursor: pointer; padding: 6px 8px; border-radius: var(--radius-sm); font-size: .85rem; }
.ex-item:hover { background: var(--surface-2); }
.ex-item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.ex-work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.urlline { display: flex; gap: 8px; align-items: center; background: var(--code-bg); border: var(--bw) solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; font-family: var(--font-mono); font-size: .8rem; word-break: break-all; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

/* ===================================================================== dock (request log), dialogs, toast */
.dock { position: sticky; bottom: 0; z-index: 25; background: var(--surface); border-top: var(--bw) solid var(--line-strong); }
.dock-head { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 38px; }
.dock-head button.toggle { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; font-weight: 650; padding: 0; height: 100%; }
.dock-list { max-height: 260px; overflow: auto; border-top: var(--bw) solid var(--line); }
.logrow { display: grid; grid-template-columns: 76px 60px 58px minmax(0, 1fr) 64px 84px; gap: 10px; padding: 5px 20px; align-items: center; cursor: pointer; background: transparent; border: 0; border-bottom: var(--bw) solid var(--line); width: 100%; text-align: left; color: inherit; font-family: var(--font-mono); font-size: .78rem; }
.logrow:hover { background: var(--surface-2); }
.logrow span:nth-child(4) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog { border: var(--bw) solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 0; width: min(780px, calc(100vw - 28px)); box-shadow: var(--pop); }
dialog::backdrop { background: rgba(8, 10, 14, .5); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: var(--bw) solid var(--line); }
dialog .db { padding: 16px; display: grid; gap: 14px; max-height: 74vh; overflow: auto; }
#dlgCmd { width: min(620px, calc(100vw - 28px)); margin-top: 12vh; }
.cmd-in { border: 0; border-bottom: var(--bw) solid var(--line); border-radius: 0; height: 48px; padding: 0 16px; font-size: 1rem; }
.cmd-in:focus { outline: none; border-color: var(--line); }
.cmd-list { max-height: 50vh; overflow: auto; padding: 6px; }
.cmd-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; background: none; border: 0; border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: inherit; }
.cmd-item[aria-selected="true"] { background: var(--accent-soft); }
.toasts { position: fixed; right: 18px; bottom: 56px; display: grid; gap: 8px; z-index: 100; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 13px; border-radius: var(--radius-sm); box-shadow: var(--pop); max-width: 360px; font-size: .86rem; }

/* ===================================================================== small screens */
@media (max-width: 1100px) {
  .journey, .two, .phone-wrap, .ex, .ex-work { grid-template-columns: minmax(0, 1fr); }
  .phone { margin: 0 auto; }
  .ex-list { position: static; max-height: 340px; }
}
@media (max-width: 760px) {
  .bar { padding: 0 12px; gap: 8px; flex-wrap: wrap; height: auto; padding-top: 6px; }
  .brand span, .chips .svc-chip b, #themeName, #openCmd { display: none; }
  .env-chip { padding: 0 8px; }
  .svc-chip { padding: 0 8px; }
  .tabs-nav { order: 9; width: 100%; margin: 0 -12px; padding: 0 12px; height: 42px; justify-content: space-between; }
  .tab { padding: 0 8px; }
  .view { padding: 14px 12px 20px; }
  .logrow { grid-template-columns: 62px 50px minmax(0, 1fr) 56px; padding: 5px 12px; }
  .logrow span:nth-child(3), .logrow span:nth-child(6) { display: none; }
  .dock-head { padding: 0 12px; }
  .phone { width: 100%; max-width: 372px; height: 700px; }
  .menu .pop { right: -40px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* sign in, chat buttons and menus, contact finder */
.screen .signin { display: grid; gap: 14px; }
.screen .signin .stack { gap: 6px; }
.screen .signin .sbtn { width: 100%; }
.signin-panel { max-width: 520px; }
.signin-box [data-signin] { display: grid; gap: 12px; }
.signin-box .err, .find-dlg .err, .signin .err { color: var(--bad); font-size: .86rem; }
.signin-box .note, .find-dlg .note, .signin .note { color: var(--ink-2); font-size: .86rem; }
.signin-panel[hidden], #chMain[hidden] { display: none; }
.more-wrap { position: relative; }
.attach-pop.more-pop { left: auto; right: 0; bottom: auto; top: 46px; }
.bubble .foot { font-size: .74rem; opacity: .75; margin-top: 4px; }
.bubble .qbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.bubble .qbtns .btn:disabled { opacity: .55; cursor: default; }
.bubble .qlist { display: grid; gap: 4px; margin-top: 8px; min-width: 220px; }
.bubble .qrow { display: grid; text-align: left; gap: 1px; padding: 7px 10px; border: var(--bw) solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink); cursor: pointer; font: inherit; line-height: 1.25; }
.bubble .qrow:hover, .bubble .qrow:focus-visible { border-color: var(--accent); }
.bubble .qrow small { color: var(--ink-3); font-size: .74rem; }
.bubble code { font-family: var(--font-mono); font-size: .86em; padding: 0 3px; border-radius: 3px; background: rgba(127, 127, 127, .18); }
.bubble a { color: inherit; text-decoration: underline; }
.bubble .wait { min-height: 40px; min-width: 120px; background: var(--surface-3); }
.bubble.typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; width: fit-content; }
.bubble.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: tdot 1.1s infinite ease-in-out; }
.bubble.typing i:nth-child(2) { animation-delay: .18s; } .bubble.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes tdot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .bubble.typing i { animation: none; opacity: .6; } }
dialog.find-dlg { width: min(620px, calc(100vw - 20px)); }
.find-dlg .seg { flex-wrap: wrap; }
.find-search { display: flex; gap: 8px; flex-wrap: nowrap; }
.find-search input { flex: 1; min-width: 0; }
.find-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: var(--bw) solid var(--line); border-radius: var(--radius); overflow: hidden; }
.find-list li { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border-bottom: var(--bw) solid var(--line); }
.find-list li:last-child { border-bottom: 0; }
.find-who { display: grid; line-height: 1.25; min-width: 0; }
.find-who small { color: var(--ink-3); font-size: .74rem; }
.find-nums { display: flex; gap: 6px; flex-wrap: wrap; }
.find-nums .btn small { margin-left: 6px; opacity: .75; font-size: .72rem; }

/* business accounts */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.bz-branch td:first-child { padding-left: 26px; }
.bz-branch td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.bz-note td { background: var(--surface-2); }
.bz-note .kv { margin: 2px 0 6px; }
#bzMain .field small { font-size: .76rem; }
#bzMain input[type=file] { max-width: 100%; }
@media (max-width: 560px) { .tab:not([aria-current="page"]) span { display: none; } .tab { padding: 0 12px; } }
#bzMain select[data-bz-method] { width: auto; max-width: 220px; }
#bzMain summary { cursor: pointer; color: var(--ink-2); font-weight: 600; }

/* ===================================================================== the logo */
.dm { display: block; flex: none; }
.dm-a, .dm-f { stroke-dasharray: 560; }
.dm-still .dm-a, .dm-still .dm-f { stroke-dashoffset: 0; }
.dm-intro .dm-a, .dm-intro .dm-f { stroke-dashoffset: 560; animation: dm-draw 1.1s cubic-bezier(.65, 0, .35, 1) forwards; }
.dm-intro .dm-a { animation-delay: .25s; }
.dm-intro .dm-f { animation-delay: .75s; }
.dm-intro .dm-t { transform-box: fill-box; transform-origin: center; animation: dm-settle .9s cubic-bezier(.2, .8, .2, 1) both; }
.dm-loop .dm-a, .dm-loop .dm-f { stroke-dashoffset: 560; animation: dm-loop 3.2s cubic-bezier(.65, 0, .35, 1) infinite; }
.dm-loop .dm-f { animation-delay: .35s; }
@keyframes dm-draw { to { stroke-dashoffset: 0; } }
@keyframes dm-loop { 0% { stroke-dashoffset: 560; } 35%, 65% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -560; } }
@keyframes dm-settle { from { transform: scale(.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .dm *, .dm { animation: none !important; }
  .dm-a, .dm-f { stroke-dashoffset: 0 !important; }
  .dm-coin { display: none; }
}
.brand .dm { width: 28px; height: 28px; }
.dm-wait { display: inline-flex; align-items: center; gap: 10px; }
.dm-wait .dm { width: 26px; height: 26px; }
.empty .dm-wait { justify-content: center; }
/* The first screen of a browser session: the logo draws itself, then the console fades in. Any key or click skips it. */
.boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 18px; background: var(--bg); color: var(--ink); transition: opacity .4s ease, visibility .4s; }
.boot .dm { width: 112px; height: 112px; filter: drop-shadow(0 10px 24px color-mix(in srgb, #0b7a38 38%, transparent)); }
.boot b { font-family: var(--font-head); font-weight: var(--head-weight); letter-spacing: var(--head-track); font-size: 1.05rem; opacity: 0; animation: dm-fade .6s 1.1s ease forwards; }
.boot.out { opacity: 0; visibility: hidden; }
@keyframes dm-fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .boot { display: none; } }

* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.bubble.me ::selection, .bubble.me::selection { background: color-mix(in srgb, var(--accent-ink) 38%, transparent); color: var(--accent-ink); }
.bubble { user-select: text; -webkit-user-select: text; cursor: text; }
.bubble button, .bubble .cp { user-select: none; -webkit-user-select: none; cursor: pointer; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) { --radius: 12px; --radius-sm: 8px; --elev: 0 2px 10px rgba(17, 21, 27, .05), 0 1px 2px rgba(17, 21, 27, .04); --soft: 0 6px 18px rgba(17, 21, 27, .06), 0 1px 3px rgba(17, 21, 27, .04); }
:is([data-theme="graphite"], [data-theme="kahawa"]) { --elev: 0 2px 10px rgba(0, 0, 0, .31), 0 1px 2px rgba(0, 0, 0, .24); --soft: 0 6px 18px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .24); }
[data-theme="savanna"] { --radius: 14px; --radius-sm: 9px; }
[data-theme="lipa"] { --radius: 10px; --radius-sm: 7px; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .tag { border-radius: 999px; padding: 0 9px; }
/* copy */
.cp { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: inherit; opacity: .7; cursor: pointer; vertical-align: middle; flex: none; }
.cp:hover, .cp:focus-visible { opacity: 1; background: rgba(127, 127, 127, .2); }
.cp svg { width: 14px; height: 14px; }
.cp.done { opacity: 1; }
.kv b .cp { margin-left: 4px; color: var(--ink-3); }
.bubble .meta { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.bubble.me .meta { opacity: .92; }
/* a message from the assistant, flat beside the logo */
.bubble .av { display: none; position: absolute; left: 0; top: 4px; width: 26px; height: 26px; }
.bubble .av svg { display: block; width: 100%; height: 100%; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .msgs { gap: 6px; padding: 18px 18px 22px; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble { font-size: 15px; line-height: 1.5; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.me { border: 0; border-radius: 20px 20px 6px 20px; padding: 10px 14px 7px; box-shadow: var(--soft); max-width: min(78%, 560px); margin-top: 6px; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.bot { background: transparent; border: 0; border-radius: 0; box-shadow: none; padding: 2px 0 0 36px; max-width: min(94%, 700px); margin-top: 12px; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.bot + .bubble.bot { margin-top: 0; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.bot .av { display: block; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.bot + .bubble.bot:not(.typing) .av { visibility: hidden; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.bot .meta { justify-content: flex-start; opacity: .8; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.typing { padding: 12px 0 8px 36px; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bubble.typing i { margin-right: 0; }
/* the message box is one rounded bar */
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .composer { border-top: 0; padding: 8px 14px 14px; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 { align-items: center; gap: 4px; padding: 3px 6px; border: 1.5px solid var(--line-strong); border-radius: 28px; background: var(--surface); box-shadow: var(--soft); transition: border-color .12s; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2:focus-within { border-color: var(--accent); }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 textarea { border: 0; border-radius: 0; background: transparent; padding: 9px 6px; min-height: 40px; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 textarea:focus { outline: none; background: transparent; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 .round { width: 40px; height: 40px; border-color: transparent; background: transparent; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 .round:hover { background: var(--surface-2); }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 .round.go, :is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 #chMic { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 .round.go:hover, :is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) .bar2 #chMic:hover { filter: brightness(1.08); background: var(--accent); }
#chSend .i-up { display: none; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) #chSend .i-up { display: inline-grid; }
:is([data-theme="daylight"], [data-theme="graphite"], [data-theme="pwani"], [data-theme="kahawa"], [data-theme="savanna"], [data-theme="lipa"]) #chSend .i-pl { display: none; }
.working { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.working[hidden] { display: none; }
/* the empty chat */
.welcome { margin: auto; width: 100%; max-width: 460px; display: grid; justify-items: center; gap: 8px; padding: 20px 6px; text-align: center; }
.welcome .wm { width: 84px; height: 84px; margin-bottom: 8px; }
.welcome .wm svg { display: block; width: 100%; height: 100%; }
.welcome h2 { margin: 6px 0 0; font-size: 1.3rem; letter-spacing: -.02em; }
.welcome p { margin: 0 0 14px; color: var(--ink-2); max-width: 42ch; }
.idea { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 14px; background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--elev); color: var(--ink); font: inherit; cursor: pointer; }
.idea:hover, .idea:focus-visible { border-color: var(--accent); }
.idea .ii { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
[data-theme="mono"] .idea .ii, [data-theme="receipt"] .idea .ii, [data-theme="mono"] .idea { border-radius: 0; color: var(--ink); }
.idea .ii svg { width: 19px; height: 19px; }
.idea b { display: block; font-weight: 600; } .idea small { color: var(--ink-3); }
</style>
</head>
<body>
<div class="boot" id="boot" aria-hidden="true"><span id="bootMark"></span><b>Daraja Agent-X Console</b></div>
<script>try { if (sessionStorage.getItem('dm.boot')) document.getElementById('boot').remove(); } catch (e) { /* storage is blocked: show it once more */ }</script>
<div class="app">
  <header class="bar">
    <div class="brand" id="brandMark">
      <span>Daraja Agent-X Console</span>
    </div>
    <nav class="tabs-nav" id="nav" aria-label="Views"></nav>
    <div class="sp"></div>
    <div class="chips" id="pills" aria-live="polite"></div>
    <button type="button" class="icon-btn" id="openCmd" aria-label="Open the command palette" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    <details class="menu" id="themeMenu">
      <summary aria-label="Choose a theme"><span class="swatch" id="themeSwatch" style="width:26px;height:18px"></span><span id="themeName">Daylight</span></summary>
      <div class="pop" id="themes" role="group" aria-label="Theme"></div>
    </details>
    <button type="button" class="icon-btn" id="openSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>

  <main>
    <section class="view" id="v-route" aria-label="Journey"></section>
    <section class="view" id="v-chat" aria-label="Chat" hidden></section>
    <section class="view" id="v-phone" aria-label="Phone" hidden></section>
    <section class="view" id="v-biz" aria-label="Business" hidden></section>
    <section class="view" id="v-prof" aria-label="Profile" hidden></section>
    <section class="view" id="v-api" aria-label="Explorer" hidden></section>
  </main>

  <footer class="dock">
    <div class="dock-head">
      <button type="button" class="toggle" id="logToggle" aria-expanded="false" aria-controls="logList">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="dockChev" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        Requests <span class="tag" id="logN">0</span>
      </button>
      <span class="muted small grow" id="logCount" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Nothing sent yet</span>

<script>
(() => {
'use strict';

// A Microsoft sign-in popup lands back on this page with ?code=...: hand it to the page that opened it and close.
if (window.opener && /[?&]code=/.test(location.search) && /[?&]state=mpcms/.test(location.search)) {
  try { window.opener.postMessage({ mpcMs: location.search }, location.origin); } catch (e) { /* the opener is gone */ }
  window.close();
  return;
}

/* ------------------------------------------------------------------ helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ------------------------------------------------------------------ the logo */
let dmCount = 0;
/** The Daraja Agent-X logo as inline SVG. motion is "still", "intro" (draws once, then a coin crosses) or "loop" (for waiting).
 *  Every copy gets its own ids, because a page that holds several copies must not let them share one mask. */
function dmMark(motion = 'still') {
  const i = 'dm' + (++dmCount) + '-';
  const coin = motion === 'intro'
    ? `<circle class="dm-coin" r="15" opacity="0" fill="#fff" stroke="#0b7a38" stroke-width="5"><animateMotion dur="1.3s" begin="2s" fill="remove" path="M92 104 C150 372 362 372 420 104" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="1.3s" begin="2s"/></circle>`
    : '';
  return `<svg class="dm dm-${motion}" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><defs>`
    + `<linearGradient id="${i}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BC554"/><stop offset="1" stop-color="#0B7A38"/></linearGradient>`
    + `<clipPath id="${i}l"><rect width="256" height="512"/></clipPath><clipPath id="${i}r"><rect x="256" width="256" height="512"/></clipPath>`
    + `<path id="${i}a" d="M92 408 C150 140 362 140 420 408"/><path id="${i}f" d="M92 104 C150 372 362 372 420 104"/>`
    + `<mask id="${i}mr" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="#fff"/><use class="dm-a" href="#${i}a" clip-path="url(#${i}r)" fill="none" stroke="#000" stroke-width="78"/></mask>`
    + `<mask id="${i}mw" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="#fff"/><use class="dm-f" href="#${i}f" clip-path="url(#${i}l)" fill="none" stroke="#000" stroke-width="78"/></mask>`
    + `</defs><rect class="dm-t" width="512" height="512" rx="116" fill="url(#${i}g)"/>`
    + `<use class="dm-f" href="#${i}f" fill="none" stroke="#E4202D" stroke-width="46" mask="url(#${i}mr)"/>`
    + `<use class="dm-a" href="#${i}a" fill="none" stroke="#fff" stroke-width="46" mask="url(#${i}mw)"/>${coin}</svg>`;
}
/** The logo spinning beside a word, for places that wait for the server. */
const waitHtml = (label = 'Loading') => `<span class="dm-wait" role="status">${dmMark('loop')}<span>${label}</span></span>`;
const loadingHtml = (label) => `<div class="empty">${waitHtml(label)}</div>`;
$('#brandMark').insertAdjacentHTML('afterbegin', dmMark($('#boot') ? 'still' : 'intro'));
(() => {
  const boot = $('#boot'); if (!boot) return;
  $('#bootMark').innerHTML = dmMark('intro');
  let gone = false;
  const leave = () => { if (gone) return; gone = true; boot.classList.add('out'); setTimeout(() => boot.remove(), 500); try { sessionStorage.setItem('dm.boot', '1'); } catch (e) { /* storage is blocked */ } };
  setTimeout(leave, 2300);
  boot.addEventListener('click', leave);
  window.addEventListener('keydown', leave, { once: true });
})();
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('mpc.' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('mpc.' + k, JSON.stringify(v)); } catch (e) { /* private window: keep working without saving */ } },
};
const dig = (obj, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
const time = (d = new Date()) => d.toLocaleTimeString('en-GB', { hour12: false });

const ICON = {
  route: '<path d="M5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M7 17h6a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h6"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',

  plus: '<path d="M12 5v14M5 12h14"/>',
  more: '<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
};
const icon = (name, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[name]}</svg>`;

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3800);
}

function highlight(value) {
  let text;
  try { text = typeof value === 'string' ? JSON.stringify(JSON.parse(value), null, 2) : JSON.stringify(value, null, 2); } catch (e) { text = String(value); }
  return esc(text).replace(/(&quot;(?:(?!&quot;)[\s\S])*&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g, (m, str, colon, lit, num) => {
    if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
    if (lit) return `<span class="b">${lit}</span>`;
    return `<span class="n">${num}</span>`;
  });
}

/* ------------------------------------------------------------------ settings and saved values */
const DEFAULTS = {
  agentUrl: 'http://localhost:8082', agentxUrl: 'http://localhost:8084',
  internalKey: 'change-me-to-a-long-random-string',
  customerPhone: '254700000001', deviceId: 'console-device-0001',
  googleClientId: '', microsoftClientId: '',
  compression: 'balanced',
};
const VAR_DEFAULTS = {
  chatId: 'abc123abc123', actionId: '00000000-0000-0000-0000-000000000000', bizAccountId: '00000000-0000-0000-0000-000000000000', bizOperationId: '00000000-0000-0000-0000-000000000000',
  linkCode: '', deviceToken: '', mediaId: '',
};
const cfg = Object.assign({}, DEFAULTS, store.get('cfg') || {});
const vars = Object.assign({}, VAR_DEFAULTS, store.get('vars') || {});
const saveCfg = () => store.set('cfg', cfg);
const saveVars = () => store.set('vars', vars);

const DYN = {
  uuid: () => crypto.randomUUID(),
  idem: () => 'wa-' + hex(20),
  msgid: () => 'msg-' + hex(12),
  now: () => String(Math.floor(Date.now() / 1000)), nowMs: () => String(Date.now()),
  tomorrow: () => new Date(Date.now() + 86400000 + 3 * 3600000).toISOString().slice(0, 10),
};
function fill(text, ctx = {}) {
  return String(text).replace(/\{\{(\w+)\}\}/g, (m, k) => {
    if (k in DYN) return (ctx[k] = ctx[k] ?? DYN[k]());
    if (vars[k]) return vars[k];
    if (k in cfg) return cfg[k];
    return m;
  });
}

/* ------------------------------------------------------------------ the one function that talks to the services */
const LOG = [];
async function http(o) {
  const ctx = {};
  const f = (s) => fill(s, ctx);
  const base = String(cfg[o.svc + 'Url'] || '').replace(/\/+$/, '');
  const path = f(o.path);
  let qs = '';
  if (o.query) {
    const p = new URLSearchParams();
    Object.entries(o.query).forEach(([k, v]) => { if (v !== '' && v != null) p.append(k, f(String(v))); });
    qs = p.toString() ? '?' + p.toString() : '';
  }
  const url = base + path + qs;
  const headers = { Accept: 'application/json, text/plain, */*' };
  let bodyText, formData, rawBody;
  if (o.body != null && o.method !== 'GET') {
    bodyText = typeof o.body === 'string' ? f(o.body) : JSON.stringify(o.body);
    bodyText = f(bodyText.replace(/("smsAt":)"\{\{nowMs\}\}"/, '$1{{nowMs}}'));
    headers['Content-Type'] = 'application/json';
  }
  if (o.form) {
    formData = o.form;
    bodyText = '[multipart/form-data] ' + Array.from(o.form.entries()).map(([k, v]) => k + '=' + (v && v.name ? v.name + ' (' + v.size + ' bytes)' : v)).join(', ');
  }
  if (o.raw) {
    rawBody = o.raw.blob; headers['Content-Type'] = o.raw.blob.type || 'application/octet-stream';
    bodyText = `[raw body] ${o.raw.blob.name || 'file'} (${o.raw.blob.size} bytes of ${headers['Content-Type']})`;
  }
  if (o.auth === 'internal') headers['X-Internal-Key'] = cfg.internalKey;
  if (o.auth === 'bearer') headers.Authorization = 'Bearer ' + (vars.deviceToken || '');
  if (o.headers) Object.entries(o.headers).forEach(([k, v]) => { headers[k] = f(String(v)); });
  const result = { method: o.method, url, svc: o.svc, path: path + qs, reqHeaders: headers, reqBody: bodyText, at: new Date(), ms: 0, status: 0, ok: false };
  const t0 = performance.now();
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), o.timeout || 30000);
    let res;
    try { res = await fetch(url, { method: o.method, headers, body: formData || rawBody || bodyText, signal: ctl.signal }); } finally { clearTimeout(timer); }
    result.status = res.status; result.ok = res.ok;
    result.resHeaders = Array.from(res.headers.entries());
    const mime = (res.headers.get('content-type') || '').split(';')[0].trim();
    result.mime = mime;
    if (/json/.test(mime)) {
      result.text = await res.text();
      try { result.json = JSON.parse(result.text); } catch (e) { /* show as text */ }
    } else if (/pdf|image|octet|audio|video/.test(mime)) {
      const blob = await res.blob();
      result.blobUrl = URL.createObjectURL(blob); result.size = blob.size;
    } else {
      result.text = await res.text();
    }
  } catch (e) {
    result.error = e.name === 'AbortError' ? 'The service took too long to answer.'
      : (e.message && !/fetch|network|load failed/i.test(e.message) ? e.message
        : `Cannot reach ${base}. Is the service running? If it is, start it with CORS_ALLOWED_ORIGINS=${location.origin} so this page may call it.`);
  }
  result.ms = Math.round(performance.now() - t0);
  if (result.ok && o.save && result.json) {
    Object.entries(o.save).forEach(([name, expr]) => {
      const v = dig(result.json, expr);
      if (v != null) vars[name] = String(v);
    });
    saveVars();
  }
  if (!o.silent) { LOG.unshift(result); if (LOG.length > 200) LOG.pop(); renderLogBar(); }
  return result;
}

function curlOf(r) {
  const parts = [`curl -i -X ${r.method} '${r.url}'`];
  Object.entries(r.reqHeaders || {}).forEach(([k, v]) => { if (k !== 'Accept') parts.push(`  -H '${k}: ${v}'`); });
  if (r.reqBody) parts.push(`  -d '${r.reqBody.replace(/'/g, "'\\''")}'`);
  return parts.join(' \\\n');
}

async function ping(svc) {
  const t0 = performance.now();
  const probe = {
    agent: { method: 'GET', path: '/actuator/health', auth: 'none' },
    agentx: { method: 'GET', path: '/api/config', auth: 'none' },
  }[svc];
  const r = await http(Object.assign({ svc, silent: true, timeout: 3500 }, probe));
  if (!r.error) return { state: 'up', ms: r.ms, status: r.status, env: svc === 'agentx' && r.json && typeof r.json.environment === 'string' ? r.json.environment : '' };
  // The service may be running but not allow this page. A no-cors request tells the two cases apart.
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 2500);
    await fetch(String(cfg[svc + 'Url']).replace(/\/+$/, '') + '/', { mode: 'no-cors', signal: ctl.signal });
    clearTimeout(timer);
    return { state: 'blocked', ms: Math.round(performance.now() - t0) };
  } catch (e) { return { state: 'down', ms: Math.round(performance.now() - t0) }; }
}

/* ------------------------------------------------------------------ every endpoint of the two services */
const CATALOG = [];

/** Every small copy button: a chat message copies its own words, anything else copies the value it carries. */
document.addEventListener('click', (e) => {
  const x = e.target.closest('.cp'); if (!x) return;
  const b = x.closest('.bubble'), text = x.dataset.cp != null ? x.dataset.cp : b ? bubbleText(b) : '';
  if (!text) return;
  copyText(text, x.dataset.what || 'Message');
  x.classList.add('done'); x.innerHTML = icon('check'); clearTimeout(x._t);
  x._t = setTimeout(() => { x.classList.remove('done'); x.innerHTML = icon('copy'); }, 1600);

function copyText(text, what) {
  const done = () => toast((what || 'Text') + ' copied');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => toast('Copy was blocked by the browser'));
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy was blocked by the browser'); } ta.remove(); }
}

/** One response, shown the same way in the explorer and in the log. */
function responseView(r) {
  const wrap = document.createElement('div');
  const head = `<div class="row"><span class="tag ${tone(r.status)}">${r.status || 'No answer'}</span><span class="muted small">${r.ms} ms</span><span class="muted small">${esc(r.method)} ${esc(r.path)}</span></div>`;
  let body;
  if (r.error) body = `<div class="callout warn">${esc(r.error)}</div>`;
  else if (r.blobUrl) {
    const pdf = /pdf/.test(r.mime), img = /image/.test(r.mime);
    body = `<div class="muted small">${esc(r.mime)}, ${(r.size / 1024).toFixed(1)} KB</div>` +
      (pdf ? `<iframe title="PDF preview" src="${r.blobUrl}" style="width:100%;height:420px;border:0;border-radius:10px;background:#fff"></iframe>` : img ? `<img alt="Response image" src="${r.blobUrl}" style="max-width:100%;border-radius:10px">` : '') +
      `<a class="btn sm" href="${r.blobUrl}" download="response">Download</a>`;
  } else body = `<pre class="json">${r.json !== undefined ? highlight(r.json) : esc(r.text || '(empty body)')}</pre>`;
  const hdrs = (r.resHeaders || []).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td><code>${esc(v)}</code></td></tr>`).join('') || '<tr><td class="muted">No headers (the request did not reach the service).</td></tr>';
  const reqH = Object.entries(r.reqHeaders || {}).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td><code>${esc(v)}</code></td></tr>`).join('');
  const tabs = ['Body', 'Headers', 'Request', 'curl'];
  const panes = [body, `<table>${hdrs}</table>`,
    `<table>${reqH}</table>` + (r.reqBody ? `<pre class="json" style="margin-top:10px">${highlight(r.reqBody)}</pre>` : ''),
    `<pre class="json">${esc(curlOf(r))}</pre><button type="button" class="btn sm" data-copycurl>Copy curl</button>`];
  wrap.innerHTML = head + `<div class="tabs" role="tablist" style="margin-top:10px">${tabs.map((t, i) => `<button type="button" role="tab" aria-selected="${i === 0}" data-tab="${i}">${t}</button>`).join('')}</div>` +
    panes.map((p, i) => `<div data-pane="${i}" ${i ? 'hidden' : ''}>${p}</div>`).join('');
  wrap.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { $$('[data-tab]', wrap).forEach((b) => b.setAttribute('aria-selected', String(b === t))); $$('[data-pane]', wrap).forEach((p) => { p.hidden = p.dataset.pane !== t.dataset.tab; }); }
    if (e.target.closest('[data-copycurl]')) copyText(curlOf(r), 'curl command');
  });
  return wrap;
}

/* ------------------------------------------------------------------ the fake M-Pesa messages (ported from the Flutter parser) */
function parseSms(text) {
  const t = String(text).replace(/\s+/g, ' ').trim();
  const code = (/^([A-Z0-9]{10})\s+confirmed/i.exec(t) || [])[1];
  const amt = /Ksh\s?([\d,]+(?:\.\d{1,2})?)/i.exec(t);
  if (!code || !amt) return null;
  const amount = Math.round(parseFloat(amt[1].replace(/,/g, '')));
  let m;
  if ((m = /bought Ksh\s?[\d,.]+ of airtime(?: for (\+?\d+))?/i.exec(t))) return { code: code.toUpperCase(), kind: 'AIRTIME', amount, payee: m[1] || null, account: null };
  if ((m = /sent to (.+?) for account (\S+?)\.? on /i.exec(t))) return { code: code.toUpperCase(), kind: 'BILL', amount, payee: m[1].trim(), account: m[2] };
  if ((m = /paid to (.+?)\.? on \d/i.exec(t))) return { code: code.toUpperCase(), kind: 'PAID', amount, payee: m[1].trim(), account: null };
  if ((m = /sent to (.+?) on \d/i.exec(t))) return { code: code.toUpperCase(), kind: 'SENT', amount, payee: m[1].trim(), account: null };
  return null;
}
const SMS_CODE = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'; return 'S' + Array.from(crypto.getRandomValues(new Uint8Array(9)), (b) => a[b % a.length]).join(''); };
function smsDate(d = new Date()) {
  const dd = String(d.getDate()).padStart(2, '0'), mm = String(d.getMonth() + 1).padStart(2, '0'), yy = String(d.getFullYear()).slice(2);
  let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${dd}/${mm}/${yy} at ${h}:${String(d.getMinutes()).padStart(2, '0')} ${ap}`;
}
function wrongDigits(num) { const n = String(num); return n.slice(0, -1) + ((Number(n.slice(-1)) + 1) % 10); }
/** What Safaricom would send the customer after this request is paid in M-Pesa. Only for the simulator. */
function fakeSmsFor(a, wrong) {
  const code = SMS_CODE(), when = smsDate(), kes = 'Ksh' + fmtKes(a.amount), d = a.details || {};
  const phone10 = (p) => '0' + String(p).replace(/\D/g, '').slice(-9);
  let text;
  switch (a.type) {
    case 'SEND_MONEY': { const n = d.recipientPhone ? phone10(d.recipientPhone) : '0712345678'; text = `${code} Confirmed. ${kes} sent to ${(d.recipientName || d.contactName || 'JOHN DOE').toUpperCase()} ${wrong ? wrongDigits(n) : n} on ${when}. New M-PESA balance is Ksh2,340.00. Transaction cost, Ksh7.00.`; break; }
    case 'PAY_POCHI': { const n = phone10(d.pochiPhone || '0722000111'); text = `${code} Confirmed. ${kes} sent to ${(d.businessName || 'POCHI SHOP').toUpperCase()} ${wrong ? wrongDigits(n) : n} on ${when}. New M-PESA balance is Ksh2,340.00.`; break; }
    case 'PAY_TILL': text = `${code} Confirmed. ${kes} paid to ${(d.businessName || 'MAMA MBOGA').toUpperCase()}. on ${when}. New M-PESA balance is Ksh2,340.00.`; break;
    case 'PAY_BILL': { const acc = d.account || '123456'; text = `${code} Confirmed. ${kes} sent to ${(d.businessName || 'KPLC PREPAID').toUpperCase()} for account ${wrong ? wrongDigits(acc) : acc} on ${when}. New M-PESA balance is Ksh2,340.00.`; break; }
    case 'BUY_AIRTIME': { const n = d.airtimePhone ? phone10(d.airtimePhone) : null; text = `${code} confirmed. You bought ${kes} of airtime${n ? ' for ' + (wrong ? wrongDigits(n) : n) : ''} on ${when}. New M-PESA balance is Ksh2,340.00.`; break; }
    default: return null;
  }
  return { code, text, at: Date.now() };
}
const INBOX = store.get('inbox') || [];
const saveInbox = () => store.set('inbox', INBOX.slice(0, 20));
function sendableEvidence(sms, action) {
  const p = parseSms(sms.text);
  if (!p) return null;
  // Like the real app: when the request names a contact, the payee is not sent, so the server never learns the number.
  const contact = action && action.details && action.details.contactName && !action.details.recipientPhone;

/** Adds one line to the trace. Lanes are numbered 1 to 5. Returns the element so it can be finished later. */
function evAdd(from, to, title, state, sub) {
  const grid = $('#rtGrid'); const empty = $('#rtEmpty'); if (empty) empty.remove();
  const self = from === to, a = Math.min(from, to), n = Math.abs(to - from) + 1;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'ev' + (self ? ' ev-self' : '');
  b.dataset.state = state; b.dataset.dir = to >= from ? 'right' : 'left';
  b.style.cssText = `--a:${a};--n:${n}`;
  b.innerHTML = self
    ? `<span class="ev-track"><span class="ev-text"><span class="ev-pill">${esc(title)}</span></span></span>`
    : `<span class="ev-track"><span class="ev-text">${esc(title)}</span><span class="ev-rule"></span><span class="ev-sub">${esc(sub || '')}</span></span>`;
  grid.append(b);
  b.scrollIntoView({ block: 'nearest' });
  return b;
}
function evFinish(b, state, title, sub, r) {
  b.dataset.state = state;
  const t = $('.ev-text', b); if (t) { const p = $('.ev-pill', t); if (p) p.textContent = title; else t.textContent = title; }
  const s = $('.ev-sub', b); if (s) s.textContent = sub || '';
  if (r) b._r = r; else { b.tabIndex = -1; b.style.cursor = 'default'; }
}
const subOf = (r) => `${r.method} ${r.path}, ${r.status || 'no answer'}, ${r.ms} ms`;
/** A real call: shown as a moving line, then finished with the answer. */
async function evCall(from, to, title, promise) {
  const b = evAdd(from, to, title, 'run', 'Waiting for the answer');
  const r = await promise;
  evFinish(b, r.ok ? 'ok' : 'err', r.ok ? title : `${title}: ${errText(r)}`, subOf(r), r);
  return r;
}
/** Something the console only pretends to do (a person, a fingerprint, M-Pesa). Drawn dashed. */
async function evNote(from, to, title, sub) {
  const b = evAdd(from, to, title, 'note', sub || '');
  evFinish(b, 'note', title, sub || '');
  await sleep(380);
  return b;
}

async function runRoute() {
  if (RT.busy) return;
  RT.busy = true; $('#rtRun').disabled = true; resetRoute();
  const sc = SCEN.find((s) => s.id === $('input[name=rtScen]:checked').value), wrong = $('#rtWrong').checked, ai = $('#rtAi').checked;
  const stop = (msg) => { evFinish(evAdd(3, 3, msg, 'err'), 'err', msg); $('#rtOutcome').innerHTML = '<span class="tag bad">Stopped</span>'; };
  try {
    // 1 the customer writes
    if (ai) {
      const r = await evCall(1, 2, 'Customer text goes to the agent', send('ag.text', { body: inbound({ text: sc.say }) }));
      if (!r.ok) await evNote(2, 2, 'The AI step failed, the journey carries on without it');
    } else await evNote(1, 2, `Customer writes: ${sc.say}`, 'Simulated, no AI used');
    // 2 the agent prepares the request
    const made = await evCall(2, 3, 'Agent prepares the request', send(sc.ep));
    if (!made.ok) return stop('The request was not created. Check the agentx address and the internal key in Settings.');
    const id = made.json.id; vars.actionId = id; saveVars();
    // 3 the phone is signed in and opens it
    let got = vars.deviceToken ? await send('co.a.get', { silent: true, path: `/api/actions/${id}` }) : { ok: false };
    if (!got.ok) {
      const code = await evCall(2, 3, 'A sign-in code is made for the customer', send('co.i.link'));
      if (!code.ok) return stop('No sign-in code could be made.');
      const ver = await evCall(4, 3, 'Phone signs in with the code', send('co.a.verify'));
      if (!ver.ok) return stop('The phone could not sign in.');
    }
    got = await evCall(4, 3, 'Phone opens the request', send('co.a.get', { path: `/api/actions/${id}` }));
    if (!got.ok) return stop('The phone cannot see the request.');
    // 4 approval on the phone
    await evNote(4, 4, 'Customer confirms with a fingerprint');
    const ap = await evCall(4, 3, 'Phone sends the approval', send('co.a.approve', { path: `/api/actions/${id}/approve` }));
    if (!ap.ok) return stop('Approval failed.');
    const ho = await evCall(4, 3, 'Phone reports it is opening M-Pesa', send('co.a.handoff', { path: `/api/actions/${id}/handoff` }));
    if (!ho.ok) return stop('Hand-off failed.');
    const action = ho.json;
    // 5 M-Pesa
    await evNote(4, 5, 'Phone opens M-Pesa with the details filled in', 'Simulated');
    await evNote(5, 5, 'Customer types the PIN in M-Pesa. This console never sees it');
    const sms = fakeSmsFor(action, wrong);
    INBOX.unshift(sms); saveInbox();
    await evNote(5, 4, 'MPESA sends a confirmation message', sms.text.replace(/ New M-PESA balance.*$/, ''));
    // 6 the message check
    const ev = sendableEvidence(sms, action);
    const chk = await evCall(4, 3, 'Phone sends what the message says', send('co.a.sms', { path: `/api/actions/${id}/sms-evidence`, body: ev }));
    if (wrong) {
      if (chk.status === 400) { $('#rtOutcome').innerHTML = '<span class="tag warn">Wrong message refused</span>'; const last = $$('.ev', $('#rtGrid')).pop(); evFinish(last, 'ok', 'Refused, as it should be: ' + errText(chk), subOf(chk), chk); }
      else { const last = $$('.ev', $('#rtGrid')).pop(); evFinish(last, 'err', `The wrong message was not refused (status ${chk.status})`, subOf(chk), chk); $('#rtOutcome').innerHTML = '<span class="tag bad">Not refused</span>'; }
    } else if (chk.ok) {
      const fin = await evCall(2, 3, 'Agent reads the final state', send('co.i.get', { path: `/internal/actions/${id}` }));
      const j = fin.json || chk.json;
      $('#rtOutcome').innerHTML = `<span class="tag ${STATUS_TONE[j.status] || 'info'}">${esc(STATUS_LABEL[j.status] || j.status)}</span><span class="tag good">${esc(VERIFY_LABEL[j.verification] || j.verification)}</span>`;
    } else $('#rtOutcome').innerHTML = '<span class="tag bad">Message check failed</span>';
    $('#rtAfter').hidden = false;
    $('#rtAfter').innerHTML = `<div class="row"><button type="button" class="btn sm" data-phone="${id}">Open it in the phone</button><button type="button" class="btn sm" data-chatview>Open the chat</button><span class="muted small">Press any line above to see the request and the answer.</span></div>`;
  } catch (e) {
    stop('Something unexpected stopped the run: ' + e.message);
  } finally { RT.busy = false; $('#rtRun').disabled = false; }
}

   Looks a person up wherever the customer keeps contacts: a Google account, a Microsoft or Outlook account,
   the device's own address book, or a vCard or CSV file exported from anywhere else. Everything is read in this
   browser. Nothing is saved, and only the person the customer picks is sent on. */
const CF = {
  source: store.get('csrc') || '', q: '', list: [], busy: false, err: '', note: '', done: false,
  onPick: null, token: { google: null, microsoft: null }, ms: null, file: null, fileName: '', picked: null, warmed: false,

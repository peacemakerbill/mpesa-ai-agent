name: agentx_app
description: Chat with Daraja Agent-X, approve a request with your fingerprint, face or phone lock, then finish it inside M-Pesa.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# SMS reading (flutter_sms_inbox, permission_handler) is Android only and needs the READ_SMS permission, see docs/SMS.md.
# Reading the sign-in code (sms_autofill) is Android only and needs no permission: it uses Google's SMS Retriever, see docs/SMS.md.
# Chat attachments: image_picker, file_picker, record, audioplayers, geolocator, open_filex. The camera on the web and on Linux, Windows and macOS:
# camera with camera_desktop. Documents on the web and the desktop: file_selector. Smaller photos: image. Smaller videos on phones: video_compress.
# Location on Linux: geolocator_linux (needs GeoClue). Browser downloads: web. Contact search: flutter_contacts,
# google_sign_in 6.x (Google), flutter_appauth (Microsoft), file_picker (vCard and CSV). Permissions and OAuth setup: docs/PLATFORM_SETUP.md and docs/CONTACTS.md.
# Dependency versions were resolved on a real Flutter install (pub get). local_auth is pinned to 2.x because the code uses its AuthenticationOptions API.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  flutter_contacts: ^1.1.9+2
  android_intent_plus: ^5.2.0
  flutter_sms_inbox: ^1.0.3
  sms_autofill: ^2.4.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  file_selector: ^1.0.3
  camera: ^0.11.0
  camera_desktop: ^2.0.0
  image: ^4.2.0
  video_compress: ^3.1.3
  web: ^1.1.0
  record: ^6.2.1
  audioplayers: ^6.1.0
  geolocator: ^13.0.1
  geolocator_linux: ^0.2.3
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  google_sign_in: ^6.2.1
  flutter_appauth: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

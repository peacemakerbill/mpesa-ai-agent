<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="172" viewBox="0 0 1200 172" role="img" aria-label="Business accounts. Save a shortcode once, then transact from the chat.">
<title>Business accounts. Save a shortcode once, then transact from the chat.</title>
<defs><clipPath id="bc"><rect width="1200" height="172" rx="10"/></clipPath><pattern id="pbiz" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2" fill="#fff" fill-opacity="0.15000000000000002"/></pattern></defs>
<style>

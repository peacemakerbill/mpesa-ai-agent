.wt { fill: #fff; } .w8 { fill: #fff; fill-opacity: .82; } .w6 { fill: #fff; fill-opacity: .6; }
.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.fu { opacity: 0; animation: fu .8s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes fu { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
.lf { animation: lf .6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes lf { from { fill-opacity: 0; fill: #47C27A } to { fill-opacity: 1; fill: #fff } }
.wipe { animation: wipe 1.2s cubic-bezier(.2,.7,.2,1) both; }
@keyframes wipe { from { clip-path: inset(-12% 100% -12% 0) } to { clip-path: inset(-12% -3% -12% 0) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fu { opacity: 1 !important; } }

.tl { animation: tl .5s cubic-bezier(.2,.7,.2,1) both; }
@keyframes tl { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
.tt { animation: tt .6s steps(var(--n), end) both; clip-path: inset(-30% -2% -30% 0); }
@keyframes tt { from { clip-path: inset(-30% 100% -30% 0) } to { clip-path: inset(-30% -2% -30% 0) } }
.tb { transform-box: fill-box; transform-origin: left center; animation: ac .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ac { from { transform: scaleX(0) } to { transform: scaleX(1) } }
.ti * { stroke-dasharray: 1; animation: dr 1s ease-in-out both; animation-delay: inherit; }
@keyframes dr { from { stroke-dashoffset: 1; opacity: 0 } 6% { opacity: 1 } to { stroke-dashoffset: 0; opacity: 1 } }
.hc { opacity: 0; animation: hc 19.2s ease-in-out infinite; }
@keyframes hc { 0% { opacity: 0 } 2%,11% { opacity: 1 } 13%,100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .tt,.tb,.ti *,.tl { animation: none !important; } .hc { display: none; } .tt { clip-path: none; } }
</style>

<text class="title" x="58" y="168" fill="url(#shine)">M-Pesa AI Agent</text>
<g id="h0g"><clipPath id="h0clip"><rect class="h0" x="60" y="208" width="0" height="34"/></clipPath><text x="60" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#E8F4EC" clip-path="url(#h0clip)" xml:space="preserve">Chat. Approve. Pay inside M-Pesa.</text><rect class="h0c" x="60" y="212.3" width="12.0" height="24.0" fill="#2BD576" rx="1"/></g><g id="h1g"><clipPath id="h1clip"><rect class="h1" x="60" y="208" width="0" height="34"/></clipPath><text x="60" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#E8F4EC" clip-path="url(#h1clip)" xml:space="preserve">The assistant prepares. You move the money.</text><rect class="h1c" x="60" y="212.3" width="12.0" height="24.0" fill="#2BD576" rx="1"/></g><g id="h2g"><clipPath id="h2clip"><rect class="h2" x="60" y="208" width="0" height="34"/></clipPath><text x="60" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#E8F4EC" clip-path="url(#h2clip)" xml:space="preserve">No PIN stored. No customer keys held.</text><rect class="h2c" x="60" y="212.3" width="12.0" height="24.0" fill="#2BD576" rx="1"/></g><g id="h3g"><clipPath id="h3clip"><rect class="h3" x="60" y="208" width="0" height="34"/></clipPath><text x="60" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#E8F4EC" clip-path="url(#h3clip)" xml:space="preserve">Spring Boot 4, Flutter and Claude.</text><rect class="h3c" x="60" y="212.3" width="12.0" height="24.0" fill="#2BD576" rx="1"/></g>
<g class="pill" style="animation-delay:0.20s"><rect x="60" y="276" width="139" height="30" rx="15" fill="#14231C" stroke="#22372C"/><text x="130" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8DA89A">Spring Boot 4.1</text></g><g class="pill" style="animation-delay:0.32s"><rect x="209.0" y="276" width="80" height="30" rx="15" fill="#14231C" stroke="#22372C"/><text x="249" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8DA89A">Flutter</text></g><g class="pill" style="animation-delay:0.44s"><rect x="298.8" y="276" width="72" height="30" rx="15" fill="#14231C" stroke="#22372C"/><text x="335" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8DA89A">Claude</text></g><g class="pill" style="animation-delay:0.56s"><rect x="381.20000000000005" y="276" width="87" height="30" rx="15" fill="#14231C" stroke="#22372C"/><text x="425" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8DA89A">RabbitMQ</text></g><g class="pill" style="animation-delay:0.68s"><rect x="478.40000000000003" y="276" width="65" height="30" rx="15" fill="#14231C" stroke="#22372C"/><text x="511" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8DA89A">Redis</text></g><g class="pill" style="animation-delay:0.80s"><rect x="553.4000000000001" y="276" width="220" height="30" rx="15" fill="#14231C" stroke="#22372C"/><text x="664" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8DA89A">MongoDB  PostgreSQL  MySQL</text></g>
<text class="sub" x="60" y="338">Customers chat. The assistant prepares. Only the customer can move the money.</text>


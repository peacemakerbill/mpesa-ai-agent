<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="M-Pesa AI Agent: chat, approve, pay inside M-Pesa">
<title>M-Pesa AI Agent: chat, approve, pay inside M-Pesa</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110C"/><stop offset="1" stop-color="#0D2217"/></linearGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-600" y1="0" x2="0" y2="0">
  <stop offset="0" stop-color="#2BD576"/><stop offset="0.35" stop-color="#EFFFF5"/><stop offset="0.7" stop-color="#4FD1C5"/><stop offset="1" stop-color="#2BD576"/>
  <animate attributeName="x1" values="-600;600" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1200" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#2BD576" stop-opacity=".34"/><stop offset="1" stop-color="#2BD576" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#4FD1C5" stop-opacity=".22"/><stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="36 36" dur="9s" repeatCount="indefinite"/></pattern>
<clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath></defs>
<style>
.pill { opacity: 0; animation: rise .7s ease-out forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
.title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 70px; letter-spacing: -1.5px; }
.sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; fill: #8DA89A; }
.blink { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
.orb1 { animation: drift1 14s ease-in-out infinite alternate; }
.orb2 { animation: drift2 17s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(0,0) } to { transform: translate(120px, 30px) } }
@keyframes drift2 { from { transform: translate(0,0) } to { transform: translate(-90px, -26px) } }
/* chat mock: one 15 second loop */
.m1 { animation: m1 15s ease-in-out infinite; opacity: 0; }
.m2 { animation: m2 15s ease-in-out infinite; opacity: 0; }
.s1 { animation: s1 15s ease-in-out infinite; opacity: 0; }
.s2 { animation: s2 15s ease-in-out infinite; opacity: 0; }
.s3 { animation: s3 15s ease-in-out infinite; opacity: 0; }
.s4 { animation: s4 15s ease-in-out infinite; opacity: 0; }
@keyframes m1 { 0%,3% { opacity: 0; transform: translateY(10px) } 7%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
@keyframes m2 { 0%,12% { opacity: 0; transform: translateY(10px) } 17%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
@keyframes s1 { 0%,20% { opacity: 0 } 24%,38% { opacity: 1 } 42%,100% { opacity: 0 } }
@keyframes s2 { 0%,40% { opacity: 0 } 44%,58% { opacity: 1 } 62%,100% { opacity: 0 } }
@keyframes s3 { 0%,60% { opacity: 0 } 64%,78% { opacity: 1 } 82%,100% { opacity: 0 } }
@keyframes s4 { 0%,80% { opacity: 0 } 84%,94% { opacity: 1 } 98%,100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .m1,.m2,.s1 { opacity: 1; } }
@keyframes h0 { 0% { width: 0 } 0.00% { width: 0 } 11.50% { width: 476.8px } 22.00% { width: 476.8px } 24.00% { width: 0 } 100% { width: 0 } }
@keyframes h0c { 0% { transform: translateX(0); opacity: 1 } 0.01% { transform: translateX(0); opacity: 1 } 11.50% { transform: translateX(476.8px); opacity: 1 } 22.00% { transform: translateX(476.8px); opacity: 1 } 24.00% { transform: translateX(476.8px); opacity: 1 } 24.02% { transform: translateX(0); opacity: 0 } 100% { transform: translateX(0); opacity: 0 } }
.h0 { animation: h0 18.4s steps(33, end) infinite; }
.h0c { animation: h0c 18.4s steps(33, end) infinite; }
@media (prefers-reduced-motion: reduce) { .h0 { width: 476.8px; } .h0c { transform: translateX(476.8px); } }
@keyframes h1 { 0% { width: 0 } 25.00% { width: 0 } 36.50% { width: 621.3px } 47.00% { width: 621.3px } 49.00% { width: 0 } 100% { width: 0 } }
@keyframes h1c { 0% { transform: translateX(0); opacity: 0 } 24.98% { transform: translateX(0); opacity: 0 } 25.01% { transform: translateX(0); opacity: 1 } 36.50% { transform: translateX(621.3px); opacity: 1 } 47.00% { transform: translateX(621.3px); opacity: 1 } 49.00% { transform: translateX(621.3px); opacity: 1 } 49.02% { transform: translateX(0); opacity: 0 } 100% { transform: translateX(0); opacity: 0 } }
.h1 { animation: h1 18.4s steps(43, end) infinite; }
.h1c { animation: h1c 18.4s steps(43, end) infinite; }
@media (prefers-reduced-motion: reduce) { .h1 { width: 621.3px; } .h1c { transform: translateX(621.3px); } }
@keyframes h2 { 0% { width: 0 } 50.00% { width: 0 } 61.50% { width: 534.6px } 72.00% { width: 534.6px } 74.00% { width: 0 } 100% { width: 0 } }
@keyframes h2c { 0% { transform: translateX(0); opacity: 0 } 49.98% { transform: translateX(0); opacity: 0 } 50.01% { transform: translateX(0); opacity: 1 } 61.50% { transform: translateX(534.6px); opacity: 1 } 72.00% { transform: translateX(534.6px); opacity: 1 } 74.00% { transform: translateX(534.6px); opacity: 1 } 74.02% { transform: translateX(0); opacity: 0 } 100% { transform: translateX(0); opacity: 0 } }
.h2 { animation: h2 18.4s steps(37, end) infinite; }
.h2c { animation: h2c 18.4s steps(37, end) infinite; }
@media (prefers-reduced-motion: reduce) { .h2 { width: 534.6px; } .h2c { transform: translateX(534.6px); } }
@keyframes h3 { 0% { width: 0 } 75.00% { width: 0 } 86.50% { width: 491.2px } 97.00% { width: 491.2px } 99.00% { width: 0 } 100% { width: 0 } }
@keyframes h3c { 0% { transform: translateX(0); opacity: 0 } 74.98% { transform: translateX(0); opacity: 0 } 75.01% { transform: translateX(0); opacity: 1 } 86.50% { transform: translateX(491.2px); opacity: 1 } 97.00% { transform: translateX(491.2px); opacity: 1 } 99.00% { transform: translateX(491.2px); opacity: 1 } 99.02% { transform: translateX(0); opacity: 0 } 100% { transform: translateX(0); opacity: 0 } }
.h3 { animation: h3 18.4s steps(34, end) infinite; }
.h3c { animation: h3c 18.4s steps(34, end) infinite; }
@media (prefers-reduced-motion: reduce) { .h3 { width: 491.2px; } .h3c { transform: translateX(491.2px); } }
@media (prefers-reduced-motion: reduce) { #h1g { display: none; } #h2g { display: none; } #h3g { display: none; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>


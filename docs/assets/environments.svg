<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="138" viewBox="0 0 880 138" role="img" aria-label="Three environments: development checks nothing, staging warns and still starts, production refuses unsafe settings.">
<title>Three environments: development checks nothing, staging warns and still starts, production refuses unsafe settings.</title>
<defs></defs>
<style>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="172" viewBox="0 0 1200 172" role="img" aria-label="Chat files. Where photos, voice notes and documents are kept.">
<title>Chat files. Where photos, voice notes and documents are kept.</title>
<defs><clipPath id="bc"><rect width="1200" height="172" rx="10"/></clipPath><pattern id="pstorage" width="80" height="24" patternUnits="userSpaceOnUse"><rect x="0" y="23" width="80" height="1" fill="#fff" fill-opacity="0.10500000000000001"/><rect x="79" y="0" width="1" height="24" fill="#fff" fill-opacity="0.06"/></pattern></defs>
<style>
:root { --bg:#F6F7F4; --pn:#FFFFFF; --ink:#14211A; --mut:#5B6A62; --rule:#D8DDD6; --grn:#17803D; --amb:#A8650A; --red:#B3261E; --blu:#1F5FBF; --dot:#C9D0C8; }
@media (prefers-color-scheme: dark) { :root { --bg:#0F1512; --pn:#151D19; --ink:#E7EDE9; --mut:#8D9C94; --rule:#2A352F; --grn:#47C27A; --amb:#E0A84A; --red:#FF7B72; --blu:#6EA8FF; --dot:#26312B; } }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }

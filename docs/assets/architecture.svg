<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1360" height="560" viewBox="0 0 1360 560" role="img" aria-label="Architecture: the app talks to ganji-api, which relays to agent-service and Claude. Shared database, Redis and RabbitMQ. Optional payment-service and Daraja.">
<title>Architecture: the app talks to ganji-api, which relays to agent-service and Claude. Shared database, Redis and RabbitMQ. Optional payment-service and Daraja.</title>
<defs><clipPath id="ac"><rect width="1360" height="560" rx="10"/></clipPath><clipPath id="ib"><rect x="381" y="250" width="614" height="120" rx="6"/></clipPath><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" style="fill:var(--mut)"/></marker><pattern id="ah" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M-4 4L4 -4M0 18L18 0M14 22L22 14" style="stroke:var(--mut)" stroke-opacity="0.22" stroke-width="2"/></pattern><pattern id="gd" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" style="fill:var(--dot)"/></pattern></defs>
<style>
:root { --bg:#F6F7F4; --pn:#FFFFFF; --ink:#14211A; --mut:#5B6A62; --rule:#D8DDD6; --grn:#17803D; --amb:#A8650A; --red:#B3261E; --blu:#1F5FBF; --dot:#C9D0C8; }
@media (prefers-color-scheme: dark) { :root { --bg:#0F1512; --pn:#151D19; --ink:#E7EDE9; --mut:#8D9C94; --rule:#2A352F; --grn:#47C27A; --amb:#E0A84A; --red:#FF7B72; --blu:#6EA8FF; --dot:#26312B; } }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
:where(text:not([fill])) { fill: var(--ink); }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.mut { fill: var(--mut); }
.bg { fill: var(--bg); stroke: var(--rule); }
.pn { fill: var(--pn); stroke: var(--rule); }
.hl { stroke: var(--rule); fill: none; }
.hf { fill: var(--rule); }
.g { fill: var(--grn); } .gs { stroke: var(--grn); fill: none; }
.ms { stroke: var(--mut); fill: none; }
.wt { fill: #fff; } .w8 { fill: #fff; fill-opacity: .82; } .w6 { fill: #fff; fill-opacity: .6; }
.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.fu { opacity: 0; animation: fu .8s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes fu { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
.lf { animation: lf .6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes lf { from { fill-opacity: 0; fill: #47C27A } to { fill-opacity: 1; fill: #fff } }
.wipe { animation: wipe 1.2s cubic-bezier(.2,.7,.2,1) both; }
@keyframes wipe { from { clip-path: inset(-12% 100% -12% 0) } to { clip-path: inset(-12% -3% -12% 0) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fu { opacity: 1 !important; } }

.mk { stroke-dasharray: 5 6; animation: dash 1.8s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -11 } }
.lab { font-size: 12px; }
@keyframes lit { 0%,16% { stroke: var(--rule); stroke-width: 1 } 3%,12% { stroke: var(--grn); stroke-width: 2 } }
@keyframes litf { 0%,16% { fill: var(--pn) } 3%,12% { fill: var(--bg) } }
.nd { animation: lit 12s ease-in-out infinite; }
</style>

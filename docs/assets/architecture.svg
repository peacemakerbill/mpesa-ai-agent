/circle><text class="lab halo" x="679" y="90" text-anchor="middle">relays chat</text><path id="p3" d="M978 108 H1095" class="ms" stroke-width="1.5" marker-end="url(#ar)"/><circle r="5" class="g" opacity="0"><animateMotion dur="12s" begin="3.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.108;1" calcMode="linear"><mpath xlink:href="#p3"/></animateMotion><animate attributeName="opacity" dur="12s" begin="3.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.098;0.108;1"/></circle><text class="lab halo" x="1036" y="90" text-anchor="middle">tool calls</text><path d="M144 156 V284" class="ms mk" stroke-width="1.5" marker-end="url(#ar)"/><text class="lab halo" x="160" y="224" text-anchor="start">Hand-off. The PIN is typed only in M-Pesa.</text><path id="p5" d="M501 156 V250" class="ms" stroke-width="1.5" marker-end="url(#ar)"/><circle r="5" class="g" opacity="0"><animateMotion dur="12s" begin="4.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.083;1" calcMode="linear"><mpath xlink:href="#p5"/></animateMotion><animate attributeName="opacity" dur="12s" begin="4.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.073;0.083;1"/></circle><path id="p6" d="M858 156 V250" class="ms" stroke-width="1.5" marker-end="url(#ar)"/><circle r="5" class="g" opacity="0"><animateMotion dur="12s" begin="5.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.083;1" calcMode="linear"><mpath xlink:href="#p6"/></animateMotion><animate attributeName="opacity" dur="12s" begin="5.8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.073;0.083;1"/></circle><path d="M978 140 C1060 165, 1190 175, 1215 250" class="ms mk" stroke-width="1.5" marker-end="url(#ar)"/><text class="lab halo" x="1112" y="190" text-anchor="middle">business mode</text><path d="M1215 346 V424" class="ms mk" stroke-width="1.5" marker-end="url(#ar)"/><text class="lab halo" x="1199" y="390" text-anchor="end">STK Push and callbacks</text><path d="M1095 298 H995" class="ms mk" stroke-width="1.5" marker-end="url(#ar)"/><rect class="pn nd" x="24" y="60" width="240" height="96" rx="6" style="animation-delay:0s"/><circle cx="246" cy="80" r="4" class="g"/><text x="42" y="94" font-size="16" font-weight="700">M-Ganji app</text><text class="mut" x="42" y="116" font-size="12.5">Chat, approve, hand off</text><text class="m mut" x="42" y="137" font-size="12">Flutter, Android, iOS</text><rect class="pn nd" x="381" y="60" width="240" height="96" rx="6" style="animation-delay:1.4s"/><circle cx="603" cy="80" r="4" class="g"/><text x="399" y="94" font-size="16" font-weight="700">ganji-api</text><text class="mut" x="399" y="116" font-size="12.5">Sign-in, chat relay, requests</text><text class="m mut" x="399" y="137" font-size="12">port 8084</text><rect class="pn nd" x="738" y="60" width="240" height="96" rx="6" style="animation-delay:2.8s"/><circle cx="960" cy="80" r="4" class="g"/><text x="756" y="94" font-size="16" font-weight="700">agent-service</text><text class="mut" x="756" y="116" font-size="12.5">The assistant and its tools</text><text class="m mut" x="756" y="137" font-size="12">port 8082</text><rect class="pn nd" x="1095" y="60" width="240" height="96" rx="6" style="animation-delay:4.2s"/><circle cx="1317" cy="80" r="4" class="g"/><text x="1113" y="94" font-size="16" font-weight="700">Claude API</text><text class="mut" x="1113" y="116" font-size="12.5">Model with tool use</text><text class="m mut" x="1113" y="137" font-size="12">api.anthropic.com</text><rect class="pn" x="24" y="284" width="280" height="96" rx="6" stroke-dasharray="5 4"/><circle cx="286" cy="304" r="4" style="fill:none;stroke:var(--mut);stroke-width:1.4"/><text x="42" y="318" font-size="16" font-weight="700">M-Pesa on the phone</text><text class="mut" x="42" y="340" font-size="12.5">Dialler or the M-Pesa app</text><text class="m mut" x="42" y="361" font-size="12">Customer only</text><rect class="pn" x="1095" y="250" width="240" height="96" rx="6" stroke-dasharray
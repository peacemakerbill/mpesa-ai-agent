.sh { animation: sh 9s ease-in-out infinite both; }
@keyframes sh { 0% { transform: translateX(0) skewX(-18deg) } 9% { transform: translateX(110px) skewX(-18deg) } 100% { transform: translateX(110px) skewX(-18deg) } }
.ac { transform-box: fill-box; transform-origin: left center; animation: ac .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ac { from { transform: scaleX(0) } to { transform: scaleX(1) } }
.rg { transform-box: fill-box; transform-origin: center; animation: rg 2.4s ease-out infinite; }
@keyframes rg { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(2.6); opacity: 0 } }
.od { animation: od 1.3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes od { from { transform: translateY(0) } }
@media (prefers-reduced-motion: reduce) { .sh, .rg { display: none; } .dr *, .pp, .ac { animation: none !important; } }

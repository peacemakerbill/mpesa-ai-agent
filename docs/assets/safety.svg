<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="288" viewBox="0 0 880 288" role="img" aria-label="Safety built in: no PIN, phone lock approval, whitelist checks, read-back, scam warnings, one phone one chat, rate limits and a 30 minute expiry.">
<title>Safety built in: no PIN, phone lock approval, whitelist checks, read-back, scam warnings, one phone one chat, rate limits and a 30 minute expiry.</title>
<defs></defs>
<style>

@keyframes ac { from { transform: scaleX(0) } to { transform: scaleX(1) } }
.ti * { stroke-dasharray: 1; animation: dr 1s ease-in-out both; animation-delay: inherit; }
@keyframes dr { from { stroke-dashoffset: 1; opacity: 0 } 6% { opacity: 1 } to { stroke-dashoffset: 0; opacity: 1 } }
.hc { opacity: 0; animation: hc 19.2s ease-in-out infinite; }
@keyframes hc { 0% { opacity: 0 } 2%,11% { opacity: 1 } 13%,100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .tt,.tb,.ti *,.tl { animation: none !important; } .hc { display: none; } .tt { clip-path: none; } }
</style>

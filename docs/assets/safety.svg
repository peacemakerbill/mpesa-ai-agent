.tt { animation: tt .6s steps(var(--n), end) both; clip-path: inset(-30% -2% -30% 0); }
@keyframes tt { from { clip-path: inset(-30% 100% -30% 0) } to { clip-path: inset(-30% -2% -30% 0) } }

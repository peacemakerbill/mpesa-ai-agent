  <path pathLength="1" d="M12 17h.01" /></g></g><text class="tt" style="--n:13;animation-delay:1.26s;animation-duration:0.50s" x="18" y="82" font-size="14.5" font-weight="700">Scam warnings</text><text class="mut" x="18" y="103" font-size="12">Prizes, loans, jobs and</text><text class="mut" x="18" y="120" font-size="12">release fee stories.</text><rect class="hc" style="animation-delay:12.6s;stroke:var(--blu)" fill="none" stroke-width="2" x="1" y="1" width="205.5" height="132" rx="7.5"/></g></g><g transform="translate(224.5,152)"><g class="tl" style="animation-delay:0.90s"><rect class="pn" x=".5" y=".5" width="206.5" height="133" rx="8"/><rect class="tb" style="animation-delay:1.05s;fill:var(--blu)" x="1" y="1" width="205.5" height="3" /><g transform="translate(18,20) scale(1.25)"><g class="ti" fill="none" style="stroke:var(--blu);animation-delay:1.10s" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M19 16v-2a2 2 0 0 0-4 0v2" />

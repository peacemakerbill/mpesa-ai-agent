" y="0" width="400" height="84" style="fill:#0B3D24"/><g clip-path="url(#hc2)"><g class="dpd2"><rect x="786" y="-14" width="428" height="112" fill="url(#pd2)"/></g></g><rect x="800" y="80" width="400" height="4" style="fill:#47C27A"/><text x="824" y="52" font-size="24" font-weight="700" letter-spacing="-.4" fill="#fff">MongoDB</text><rect x="950" y="34" width="204" height="24" rx="4" fill="#000" fill-opacity=".3" stroke="#fff" stroke-opacity=".4"/><text class="m" x="959" y="50" font-size="11.5" fill="#fff">default for payment-service</text><line class="hl" x1="800" y1="84" x2="800" y2="298"/><text class="mut" x="824" y="126" font-size="12">Schema</text><text x="824" y="148" font-size="15">Created by the service, indexes included</text><text class="mut" x="824" y="182" font-size="12">Two requests, one record</text><text x="824" y="204" font-size="15">Version number. The loser gets 409</text><text class="mut" x="824" y="238" font-size="12">One change, several records</text><text x="824" y="260" font-size="15">Not atomic across records</text><line class="hl" x1="0" y1="298" x2="1200" y2="298"/><text class="mut" x="24" y="332" font-size="13">Pick one with DATABASE_TYPE. The environment wins over application.yml. The highlight reads across one row at a time.</text></g><rect class="hl" x=".5" y=".5" width="1199" height="359" rx="10"/>

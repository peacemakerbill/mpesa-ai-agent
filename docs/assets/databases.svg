<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PostgreSQL, MySQL and MongoDB compared: schema, concurrency and multi-record changes">

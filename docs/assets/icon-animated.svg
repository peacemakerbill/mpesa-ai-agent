<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Daraja Agent-X</title>
  <defs>
  <style>
    .arch,.flow{stroke-dasharray:560;stroke-dashoffset:560;animation:draw 1.1s cubic-bezier(.65,0,.35,1) forwards}
    .arch{animation-delay:.25s}
    .flow{animation-delay:.75s}
    @keyframes draw{to{stroke-dashoffset:0}}
    .tile{transform-origin:256px 256px;animation:settle .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes settle{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.arch,.flow,.tile{animation:none;stroke-dashoffset:0;opacity:1;transform:none}.dot{display:none}}
  </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BC554"/>
      <stop offset="1" stop-color="#0B7A38"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="right"><rect x="256" y="0" width="256" height="512"/></clipPath>
    <!-- the bridge: an arch that rises from the left bank and lands on the right -->
    <path id="arch" d="M92 408 C150 140 362 140 420 408"/>
    <!-- the payment: its reflection, a curve that dips and comes back up -->
    <path id="flow" d="M92 104 C150 372 362 372 420 104"/>
    <mask id="m-red" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use class="arch" href="#arch" clip-path="url(#right)" fill="none" stroke="#000" stroke-width="78"/>
    </mask>
    <mask id="m-white" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use class="flow" href="#flow" clip-path="url(#left)" fill="none" stroke="#000" stroke-width="78"/>
    </mask>
  </defs>
  <rect class="tile" width="512" height="512" rx="116" fill="url(#g)"/>
  <use class="flow" href="#flow" fill="none" stroke="#E4202D" stroke-width="46" mask="url(#m-red)"/>
  <use class="arch" href="#arch" fill="none" stroke="#fff" stroke-width="46" mask="url(#m-white)"/>

  <g class="dot"><circle r="15" opacity="0" fill="#fff" stroke="#0B7A38" stroke-width="5">
    <animateMotion dur="3.4s" begin="2.2s" repeatCount="indefinite" path="M92 104 C150 372 362 372 420 104" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
  </circle></g>
</svg>

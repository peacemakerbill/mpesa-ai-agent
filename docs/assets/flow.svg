<!-- PLACE THIS FILE AT: m-ganji/docs/assets/flow.svg  (create the docs/assets folder if it does not exist) -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-label="Request flow: ask, prepare, approve, hand off, record">
<title>Request flow: ask, prepare, approve, hand off, record</title>
<defs><clipPath id="fc"><rect width="1200" height="252" rx="10"/></clipPath><pattern id="fg" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" style="fill:var(--dot)"/></pattern></defs>
<style>
:root { --bg:#F6F7F4; --pn:#FFFFFF; --ink:#14211A; --mut:#5B6A62; --rule:#D8DDD6; --grn:#17803D; --amb:#A8650A; --red:#B3261E; --blu:#1F5FBF; --dot:#C9D0C8; }
@media (prefers-color-scheme: dark) { :root { --bg:#0F1512; --pn:#151D19; --ink:#E7EDE9; --mut:#8D9C94; --rule:#2A352F; --grn:#47C27A; --amb:#E0A84A; --red:#FF7B72; --blu:#6EA8FF; --dot:#26312B; } }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
:where(text:not([fill])) { fill: var(--ink); }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.mut { fill: var(--mut); }
.bg { fill: var(--bg); stroke: var(--rule); }
.pn { fill: var(--pn); stroke: var(--rule); }
.hl { stroke: var(--rule); fill: none; }
.hf { fill: var(--rule); }
.g { fill: var(--grn); } .gs { stroke: var(--grn); fill: none; }
.ms { stroke: var(--mut); fill: none; }
.wt { fill: #fff; } .w8 { fill: #fff; fill-opacity: .82; } .w6 { fill: #fff; fill-opacity: .6; }
.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.fu { opacity: 0; animation: fu .8s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes fu { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
.lf { animation: lf .6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes lf { from { fill-opacity: 0; fill: #47C27A } to { fill-opacity: 1; fill: #fff } }
.wipe { animation: wipe 1.2s cubic-bezier(.2,.7,.2,1) both; }
@keyframes wipe { from { clip-path: inset(-12% 100% -12% 0) } to { clip-path: inset(-12% -3% -12% 0) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fu { opacity: 1 !important; } }

@keyframes ln { 0% { transform: scaleX(0); opacity: 1 } 80.0%,94% { transform: scaleX(1); opacity: 1 } 98%,100% { transform: scaleX(1); opacity: 0 } }
.ln { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: ln 12s linear infinite; }
@keyframes tok { 0% { transform: translateX(0); opacity: 1 } 80.0% { transform: translateX(960px); opacity: 1 } 83.0%,100% { transform: translateX(960px); opacity: 0 } }
.tok { animation: tok 12s linear infinite; }
@keyframes ring { 0% { transform: scale(.6); opacity: .8 } 100% { transform: scale(2.2); opacity: 0 } }
@keyframes st0 { 0%,0.0% { opacity: 0; transform: scale(.4) } 1.5% { opacity: 1; transform: scale(1.5) } 4.0%,94% { opacity: 1; transform: scale(1) } 98%,100% { opacity: 0 } }
.st0 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: st0 12s ease-out infinite; }
@keyframes rg0 { 0%,0.0% { transform: scale(.6); opacity: 0 } 0.5% { transform: scale(.6); opacity: .8 } 6.0%,100% { transform: scale(2.4); opacity: 0 } }
.rg0 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rg0 12s ease-out infinite; }
@keyframes st1 { 0%,20.0% { opacity: 0; transform: scale(.4) } 21.5% { opacity: 1; transform: scale(1.5) } 24.0%,94% { opacity: 1; transform: scale(1) } 98%,100% { opacity: 0 } }
.st1 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: st1 12s ease-out infinite; }
@keyframes rg1 { 0%,20.0% { transform: scale(.6); opacity: 0 } 20.5% { transform: scale(.6); opacity: .8 } 26.0%,100% { transform: scale(2.4); opacity: 0 } }
.rg1 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rg1 12s ease-out infinite; }
@keyframes st2 { 0%,40.0% { opacity: 0; transform: scale(.4) } 41.5% { opacity: 1; transform: scale(1.5) } 44.0%,94% { opacity: 1; transform: scale(1) } 98%,100% { opacity: 0 } }
.st2 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: st2 12s ease-out infinite; }
@keyframes rg2 { 0%,40.0% { transform: scale(.6); opacity: 0 } 40.5% { transform: scale(.6); opacity: .8 } 46.0%,100% { transform: scale(2.4); opacity: 0 } }
.rg2 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rg2 12s ease-out infinite; }
@keyframes st3 { 0%,60.0% { opacity: 0; transform: scale(.4) } 61.5% { opacity: 1; transform: scale(1.5) } 64.0%,94% { opacity: 1; transform: scale(1) } 98%,100% { opacity: 0 } }
.st3 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: st3 12s ease-out infinite; }
@keyframes rg3 { 0%,60.0% { transform: scale(.6); opacity: 0 } 60.5% { transform: scale(.6); opacity: .8 } 66.0%,100% { transform: scale(2.4); opacity: 0 } }
.rg3 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rg3 12s ease-out infinite; }
@keyframes st4 { 0%,80.0% { opacity: 0; transform: scale(.4) } 81.5% { opacity: 1; transform: scale(1.5) } 84.0%,94% { opacity: 1; transform: scale(1) } 98%,100% { opacity: 0 } }
.st4 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: st4 12s ease-out infinite; }
@keyframes rg4 { 0%,80.0% { transform: scale(.6); opacity: 0 } 80.5% { transform: scale(.6); opacity: .8 } 86.0%,100% { transform: scale(2.4); opacity: 0 } }
.rg4 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rg4 12s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .ln { transform: scaleX(1) !important; } .tok { opacity: 0 !important; } .st0 { opacity: 1 !important; transform: none !important; } .st1 { opacity: 1 !important; transform: none !important; } .st2 { opacity: 1 !important; transform: none !important; } .st3 { opacity: 1 !important; transform: none !important; } .st4 { opacity: 1 !important; transform: none !important; } }
</style>
<g clip-path="url(#fc)"><rect width="1200" height="252" class="bg" style="stroke:none"/><rect width="1200" height="252" fill="url(#fg)"/>
<line class="hl" x1="120" y1="96" x2="1080" y2="96" stroke-width="3"/>
<line class="gs ln" x1="120" y1="96" x2="1080" y2="96" stroke-width="3"/>
<text class="m mut" x="120" y="66" font-size="12" text-anchor="middle">1</text><circle class="pn" cx="120" cy="96" r="9" stroke-width="1.5"/><circle class="gs rg0" cx="120" cy="96" r="9" stroke-width="1.5"/><circle class="g st0" cx="120" cy="96" r="9"/><text x="120" y="138" font-size="16" font-weight="700" text-anchor="middle">Ask</text><text class="mut" x="120" y="160" font-size="12.5" text-anchor="middle">The customer chats in the app</text><text class="m mut" x="360" y="66" font-size="12" text-anchor="middle">2</text><circle class="pn" cx="360" cy="96" r="9" stroke-width="1.5"/><circle class="gs rg1" cx="360" cy="96" r="9" stroke-width="1.5"/><circle class="g st1" cx="360" cy="96" r="9"/><text x="360" y="138" font-size="16" font-weight="700" text-anchor="middle">Prepare</text><text class="mut" x="360" y="160" font-size="12.5" text-anchor="middle">The assistant builds the request</text><text class="m mut" x="600" y="66" font-size="12" text-anchor="middle">3</text><circle class="pn" cx="600" cy="96" r="9" stroke-width="1.5"/><circle class="gs rg2" cx="600" cy="96" r="9" stroke-width="1.5"/><circle class="g st2" cx="600" cy="96" r="9"/><text x="600" y="138" font-size="16" font-weight="700" text-anchor="middle">Approve</text><text class="mut" x="600" y="160" font-size="12.5" text-anchor="middle">The phone confirms the owner</text><text class="m mut" x="840" y="66" font-size="12" text-anchor="middle">4</text><circle class="pn" cx="840" cy="96" r="9" stroke-width="1.5"/><circle class="gs rg3" cx="840" cy="96" r="9" stroke-width="1.5"/><circle class="g st3" cx="840" cy="96" r="9"/><text x="840" y="138" font-size="16" font-weight="700" text-anchor="middle">Hand off</text><text class="mut" x="840" y="160" font-size="12.5" text-anchor="middle">Dialler opens, PIN in M-Pesa</text><text class="m mut" x="1080" y="66" font-size="12" text-anchor="middle">5</text><circle class="pn" cx="1080" cy="96" r="9" stroke-width="1.5"/><circle class="gs rg4" cx="1080" cy="96" r="9" stroke-width="1.5"/><circle class="g st4" cx="1080" cy="96" r="9"/><text x="1080" y="138" font-size="16" font-weight="700" text-anchor="middle">Record</text><text class="mut" x="1080" y="160" font-size="12.5" text-anchor="middle">Reported, or matched to the SMS</text>
<g class="tok"><circle cx="120" cy="96" r="14" class="g" fill-opacity=".18"/><circle cx="120" cy="96" r="5" class="g"/></g>

<text class="mut" x="600.0" y="226" font-size="13" text-anchor="middle">Safaricom is never asked to confirm. The status is a record, not proof.</text></g>
<rect class="hl" x=".5" y=".5" width="1199" height="251" rx="10"/>
</svg>
